# src/r/utils/recoding_registry.yml
#
# Machine-readable catalogue of every recoding function in src/r/utils/recoding.R
# referenced by name in YAML harmonization specs (`fn:` field).
#
# Schema (one entry per function):
#   - fn:             Function name as written in YAML `fn:` field
#     input_scale:    [min, max] of expected raw input, or null if not a numeric scale
#     output_scale:   [min, max] of produced output, or null if not a numeric scale
#     reverses:       true if function flips direction (n+1-x or equivalent)
#     monotonic:      true if monotone transform of input (Spearman rho ±1 vs raw)
#     requires_data:  true if function reads data argument (e.g. country-conditional)
#     notes:          short clause; mark "unverified — needs human review" if ambiguous
#
# Private helpers (.validate_semantic_label, .safe_npt) are intentionally excluded:
# they are not referenced in any YAML `fn:` field. Public wrappers use them internally.
#
# Layers 1, 3, 4 of the audit framework consume this registry.
# Drift between this file and recoding.R is checked by:
#   src/r/audit/check_registry_complete.R

# ─────────────────────────────────────────────────────────────────────────────
