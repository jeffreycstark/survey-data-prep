# concept_groups.yml
# ─────────────────────────────────────────────────────────────────────────────
# Concept group definitions for slope_prospector.R group-coherence analysis.
#
# Purpose: Group theoretically related variables so the prospector can detect
#   whether a concept is moving coherently (all variables shift together) or
#   divergently (sister variables pull in opposite directions — which is where
#   the interesting stories live).
#
# Usage: Edit these groups freely as your theoretical framework develops.
#   The prospector will warn you at runtime if a variable name here does not
#   appear in the data — that usually means a typo or the variable is absent
#   for the current survey/wave set.
#
# Format: Each group is a named list of harmonized variable IDs (matching the
#   `id:` field in the YAML specs under src/config/abs/harmonize/).
# ─────────────────────────────────────────────────────────────────────────────

concept_groups:

  # ── INSTITUTIONAL TRUST: EXECUTIVE BRANCH ──────────────────────────────────
  # How much the public trusts the core executive and enforcement apparatus.
  # A coherent decline here is the classic legitimacy crisis signal.
  institutional_trust_executive:
    - trust_national_government
    - trust_local_government
    - trust_civil_service
    - trust_military
    - trust_president
    - trust_police

  # ── INSTITUTIONAL TRUST: INTERMEDIARY / CHECKS-AND-BALANCES ───────────────
  # Legislatures, courts, parties, media. When this group diverges from
  # executive trust, it can signal selective legitimation or partisan sorting.
  institutional_trust_intermediary:
    - trust_parliament
    - trust_political_parties
    - trust_courts
    - trust_election_commission
    - trust_newspapers
    - trust_television
    - trust_ngos

  # ── CORRUPTION PERCEPTIONS ─────────────────────────────────────────────────
  # Direct assessments of corruption and anti-corruption effort.
  # Watch for divergence between experienced corruption (corrupt_witnessed)
  # and perceived systemic corruption — that gap is theoretically important.
  corruption:
    - corrupt_national_govt
    - corrupt_local_govt
    - corrupt_witnessed
    - corrupt_better_than_before
    - govt_anticorrupt_effort

  # ── ACCOUNTABILITY PERCEPTIONS ─────────────────────────────────────────────
  # Whether citizens believe the system provides meaningful accountability.
  # Divergence within this group (e.g., elections seen as real choice but
  # courts powerless) reveals selectivity in perceived accountability channels.
  accountability_perceptions:
    - gov_no_accountability_between_elections
    - gov_elections_make_responsive
    - gov_legislature_oversight
    - gov_leaders_abuse_power
    - gov_courts_powerless
    - gov_remove_through_elections
    - gov_elections_real_choice
    - gov_enforce_laws
    - gov_opposition_opportunities

  # ── DEMOCRATIC SATISFACTION ────────────────────────────────────────────────
  # Pure satisfaction measures — the outcome variable for the output legitimacy
  # argument. Kept separate from responsiveness perceptions so cross-group
  # detection can test whether satisfaction tracks economics or democratic quality.
  democratic_satisfaction:
    - gov_sat_national
    - sat_president_govt
    - democracy_satisfaction

  # ── GOVERNMENT RESPONSIVENESS ──────────────────────────────────────────────
  # Perceived responsiveness and information transparency — distinct from
  # satisfaction. Divergence between these two groups is theoretically important:
  # satisfaction rising while responsiveness falls = output legitimacy.
  government_responsiveness:
    - govt_responds_people
    - govt_withholds_info

  # ── RULE OF LAW / EQUALITY UNDER THE STATE ────────────────────────────────
  rule_of_law:
    - gov_economic_equality
    - gov_ethnic_equality
    - gov_free_to_organize
    - rich_poor_treated_equally
    - gov_basic_necessities

  # ── POLITICAL EFFICACY ─────────────────────────────────────────────────────
  # Internal and external efficacy. A divergence here — e.g., people feel
  # capable but believe they have no influence — maps onto alienation theory.
  political_efficacy:
    - efficacy_no_influence
    - efficacy_politics_complicated
    - efficacy_ability_participate
    - democracy_efficacy

  # ── DEMOCRACY SUPPORT (NORMATIVE) ─────────────────────────────────────────
  # Whether citizens prefer and value democracy in principle.
  democracy_support_normative:
    - dem_always_preferable
    - dem_best_form
    - dem_want_democratic
    - democracy_suitability

  # ── DEMOCRACY ASSESSMENT (EMPIRICAL) ──────────────────────────────────────
  # How democratic the respondent thinks their country currently is.
  # Watch for divergence from normative support — the "aspiration gap."
  democracy_assessment_empirical:
    - dem_extent_current
    - dem_country_present_govt
    - dem_country_future
    - democracy_satisfaction

  # ── AUTHORITARIAN SYSTEM SUPPORT ──────────────────────────────────────────
  # Support for non-democratic alternatives. Rising here while democracy
  # support stays flat is the classic democratic erosion footprint.
  authoritarian_support:
    - strongman_rule
    - single_party_rule
    - military_rule
    - expert_rule

  # ── ECONOMIC EVALUATIONS: PRESENT ─────────────────────────────────────────
  # Current conditions — sociotropic (national) vs. pocketbook (family).
  # Also includes subjective wellbeing measures that likely co-move with
  # satisfaction if the output legitimacy hypothesis holds.
  economic_present:
    - econ_national_now
    - econ_family_now
    - hh_income_sat
    - subjective_social_status

  # ── ECONOMIC EVALUATIONS: RETROSPECTIVE ───────────────────────────────────
  # How things have changed vs. the past. Divergence from present signals
  # whether people think conditions are improving or just tolerable.
  economic_retrospective:
    - econ_change_1yr
    - econ_family_change

  # ── ECONOMIC EVALUATIONS: OUTLOOK ─────────────────────────────────────────
  # Prospective assessments. In Korea, these are declining while present
  # evaluations stay flat — the "stable now, worried about tomorrow" pattern.
  economic_outlook:
    - econ_outlook_1yr
    - econ_family_outlook

  # ── SOCIAL TRUST ──────────────────────────────────────────────────────────
  social_trust:
    - trust_generalized_binary
    - trust_generalized_ordinal
    - trust_relatives
    - trust_neighbors
    - trust_acquaintances
    - trust_strangers
    - trust_govt_do_right

  # ── POLITICAL ACTION: VOTING ──────────────────────────────────────────────
  # Voting and electoral participation. In Korea, this has trended OPPOSITE
  # to contacting/protest — that divergence is the "hollow citizenship" story.
  political_action_voting:
    - voted_last_election
    - voting_frequency
    - attended_campaign_rally
    - persuaded_others_vote
    - persuade_others_vote

  # ── POLITICAL ACTION: CONTACTING & PROTEST ────────────────────────────────
  # Non-electoral participation. Sharp decline in Korea across all 6 ABS waves
  # while voting stayed flat — keep these separate so the divergence surfaces
  # in cross-group detection rather than being averaged away.
  political_action_contacting_protest:
    - action_contact_elected
    - action_contact_civil_servant
    - action_contact_media
    - action_contact_influential
    - action_demonstration
    - action_petition
    - action_join_cause
    - action_risky_political
    - action_internet_political

  # ── MEDIA AND INFORMATION ACCESS ──────────────────────────────────────────
  media_and_information:
    - political_interest
    - pol_discuss
    - pol_news_follow
    - pol_news_television
    - pol_news_newspaper
    - pol_news_radio
    - internet_access_home
    - internet_access_mobile
    - news_internet
    - sm_use_any

  # ── SOCIAL MEDIA POLITICAL USE ────────────────────────────────────────────
  social_media_political:
    - sm_express_political
    - sm_express_political_binary
    - sm_organize_politics
    - sm_share_news
    - internet_political_info
    - action_internet_political

  # ── REGIME COMPARATIVE RATINGS ────────────────────────────────────────────
  # Relative assessments of other systems (China, USA, India, Japan models).
  # Interesting to track alongside authoritarian_support.
  regime_comparative:
    - dem_rating_china
    - dem_rating_india
    - dem_rating_japan
    - dem_rating_usa
    - intl_china_country_influence_valence
    - intl_usa_country_influence_valence

  # ══════════════════════════════════════════════════════════════════════════
  # Pass A expansion (2026-07-13): coverage-verified groups over previously
  # ungrouped ABS batteries. Only variables with >= 3 waves are included, so
  # each group can yield a slope. See the DEFERRED block at the end for the
  # Wave-6-only batteries that become viable once a W7 gives them time depth.
  # ══════════════════════════════════════════════════════════════════════════

  # ── ILLIBERAL VALUES ───────────────────────────────────────────────────────
  # Endorsement of illiberal executive action (censorship, judicial deference,
  # leader discretion). Distinct from authoritarian_support (strongman/military
  # regime forms) — this is approval of specific illiberal *acts*. Rising here
  # is the attitudinal footprint of democratic backsliding.
  illiberal_values:
    - auth_govt_censor_ideas
    - auth_judges_defer_executive
    - govt_should_censor_ideas
    - upright_leader_discretion

  # ── ANTI-PLURALISM ─────────────────────────────────────────────────────────
  # Belief that diversity/organized difference threatens social harmony —
  # Levitsky-Ziblatt's marker for the erosion of pluralist norms.
  anti_pluralism:
    - antiplu_diversity_chaotic
    - antiplu_groups_disrupt_harmony

  # ── SYSTEM SUPPORT ─────────────────────────────────────────────────────────
  # The four agree/disagree system-support items (reversed in harmonization so
  # higher = more support). NOTE: system_needs_change is deliberately EXCLUDED —
  # it is a different, opposite-polarity item (higher = more desire for change),
  # per the ABS system-support gotcha in CLAUDE.md.
  system_support:
    - system_capable
    - system_prefer
    - system_proud
    - system_deserves_support

  # ── TRADITIONAL AUTHORITY ──────────────────────────────────────────────────
  # Deference to hierarchical authority (parents, teachers, elders, religious
  # authorities, coworkers, mother-in-law). Falling here is the value-change /
  # modernization signal.
  traditional_authority:
    - trad_obey_parents
    - trad_hierarchical_obedience
    - trad_teacher_authority
    - trad_religious_authorities
    - trad_defer_coworkers
    - trad_motherinlaw_obey

  # ── GENDER TRADITIONALISM ──────────────────────────────────────────────────
  # Traditional gender norms (women in politics, son preference). Kept separate
  # from traditional_authority so a divergence between the two surfaces.
  gender_traditionalism:
    - trad_women_politics
    - trad_son_preference

  # ── ECONOMIC NATIONALISM ───────────────────────────────────────────────────
  # Cultural defense + trade protection + immigration restriction — the
  # populist economic-nationalist / cultural-backlash battery.
  economic_nationalism:
    - glob_cultural_defense
    - glob_trade_protection
    - glob_immigration_policy

  # ── SOCIAL MOBILITY ────────────────────────────────────────────────────────
  # The past>present>future mobility ladder (self/parents/children staircase)
  # plus generational-opportunity. Falling = the mobility staircase collapsing.
  social_mobility:
    - self_staircase
    - parents_staircase
    - children_staircase
    - econ_generation_opportunity

  # ══════════════════════════════════════════════════════════════════════════
  # DEFERRED — Wave-6-only batteries (single wave as of ABS W6, so no slope can
  # be estimated yet). Add these groups when a later wave gives them >= 3 waves:
  #   democratic_criticism : democrit_citizens_not_ready, democrit_econ_over_democracy,
  #                          democrit_harms_values, democrit_indecisive,
  #                          democrit_ineffective_stability, demo_crit_poor_economy
  #   emergency_powers     : emergency_powers_{corruption,economic_crisis,health_crisis,
  #                          security_crisis,war} (+ emergency_* variants)
  #   covid_restrictions   : covid_restrict_{censor_media,limit_assembly,
  #                          postpone_elections,lockdown,track_location}
  #   redistribution_prefs : econ_state_ownership, econ_govt_reduce_inequality,
  #                          econ_distribution_fair, govt_resp_inequality
  #   china_orientation /  : intl_china_* / intl_usa_* (mostly 2-wave as of W6)
  #   usa_orientation
  #   illiberal_values (+) : auth_econ_no_elections, auth_leader_break_rules,
  #                          auth_leader_decree, auth_order_over_democracy
  # ══════════════════════════════════════════════════════════════════════════
