      y2007: p10st
      y2008: p18st
      y2009: p51st.a
      y2010: P44ST.A
      y2011: P49ST.A
      y2013: P50TGB.A
      y2015: P17STGBS
      y2016: P11STGBS
      y2017: P11STGBSC
      y2018: null
      y2020: null
      y2023: null
      y2024: P19ST
    scale:
      min: 1
      max: 10
      labels:
        1: "Not democratic"
        10: "Totally democratic"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
        note: "All waves use same 1-10 coding. Higher = more democratic."
    qc:
      valid_range: [1, 10]

