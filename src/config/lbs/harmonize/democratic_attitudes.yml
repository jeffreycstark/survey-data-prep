# LBS Democratic Attitudes
# Waves: 24 years (1995-2024)
#
# MISSING VALUES:
# All waves: negative values are missing

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-5, -4, -3, -2, -1]
    description: "LBS standard missing codes"

variables:
  - id: dem_always_preferable
    concept: democratic_attitudes
    description: "Support for democracy: Democracy is preferable (1) vs Authoritarian sometimes (2) vs Doesn't matter (3)"
    type: nominal
    source:
      y1995: p20
      y1996: p19
      y1997: sp31
      y1998: sp28
      y2000: P29ST
      y2001: p46st
      y2002: p32st
      y2003: p14st
      y2004: p13st
      y2005: p16st
      y2006: p17st
      y2007: p9st
      y2008: p13st
      y2009: p10st
      y2010: P10ST
      y2011: P13ST
      y2013: P12STGBS
      y2015: P11STGBS
      y2016: P8STGBS
      y2017: P8STGBS
      y2018: P12STGBS
      y2020: P10STGBS
      y2023: P10STGBS
      y2024: P11STGBS
    scale:
      min: 1
      max: 3
      labels:
        1: "Democracy is preferable"
        2: "Authoritarian sometimes preferable"
        3: "Doesn't matter"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
        note: "All waves use same 1-3 coding. Nominal item."
    qc:
      valid_range: [1, 3]

  - id: dem_satisfaction
    concept: democratic_attitudes
    description: "Satisfaction with democracy (1-4, higher = more satisfied)"
    type: ordinal
    source:
      y1995: p21
      y1996: p20
      y1997: sp32
      y1998: sp29
      y2000: P30ST
      y2001: p45st
      y2002: p33st
      y2003: p15st
      y2004: p14st
      y2005: p18st
      y2006: p21st
      y2007: p12st
      y2008: p22st.a
      y2009: p12st.a
      y2010: P11ST.A
      y2011: P14ST.A
      y2013: P13TGB.A
      y2015: P12TG.A
      y2016: P9STGBSA
      y2017: P9STGBSC.A
      y2018: P13STGBS.A
      y2020: P11STGBS.A
      y2023: P11STGBS.A
      y2024: P12STGBS.A
    scale:
      min: 1
      max: 4
      labels:
        1: "Not at all satisfied"
        2: "Not very satisfied"
        3: "Quite satisfied"
        4: "Very satisfied"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_4pt
        note: "All waves coded 1=Very satisfied -> 4=Not at all; reverse so high=satisfied"
    qc:
      valid_range: [1, 4]

  - id: dem_best_system
    concept: democratic_attitudes
    description: "Democracy may have problems but it is the best system of government (Churchill quote, 1-4 agree-disagree)"
    type: ordinal
    source:
      y1995: null
      y1996: null
      y1997: null
      y1998: null
      y2000: null
      y2001: null
      y2002: p38no2c
      y2003: p16st.c
      y2004: p22sta
      y2005: p25stb
      y2006: p22st.a
      y2007: p13sta
      y2008: p19s.ta
      y2009: p20st.a
      y2010: P14ST.A
      y2011: P16ST.A
      y2013: P43ST.A
      y2015: P13ST.A
      y2016: P31STA
      y2017: P22ST
      y2018: P24ST
      y2020: P20ST.A
      y2023: P18ST.A
      y2024: P18ST.A
    scale:
      min: 1
      max: 4
      labels:
        1: "Strongly disagree"
        2: "Disagree"
        3: "Agree"
        4: "Strongly agree"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_4pt
        note: "Raw 1=Strongly agree -> 4=Strongly disagree; reverse so high=pro-democracy"
    qc:
      valid_range: [1, 4]

  - id: dem_how_democratic_10pt
    concept: democratic_attitudes
    description: "How democratic is [country]? (1=Not democratic, 10=Totally democratic)"
    type: ordinal
    source:
      y1995: null
      y1996: null
      y1997: np34
      y1998: null
      y2000: null
      y2001: null
      y2002: null
      y2003: null
      y2004: null
