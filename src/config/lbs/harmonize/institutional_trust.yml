# LBS Institutional Trust (Confidence in Institutions)
# Waves: 24 years (1995-2024)
#
# SCALE DIRECTION:
# Raw: 1=A lot, 2=Some, 3=Little, 4=No trust
# Target: 1=No trust, 2=Little, 3=Some, 4=A lot
# All waves need safe_reverse_4pt so higher = more trust
#
# MISSING VALUES:
# All waves: negative values are missing
# -1=Don't know, -2=No answer, -3=Not applicable, -4=Not asked, -5=DK/NA combined

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-5, -4, -3, -2, -1]
    description: "LBS standard missing codes"

variables:
  - id: trust_churches
    concept: institutional_trust
    description: "Confidence in the Church"
    type: ordinal
    source:
      y1995: p27a
      y1996: p33a
      y1997: sp63a
      y1998: sp38a
      y2000: P35ST.A
      y2001: p61sta
      y2002: p34sta
      y2003: p21sta
      y2004: p32stc
      y2005: p42sta
      y2006: p32st.d
      y2007: p27st.c
      y2008: p28st.g
      y2009: p26st.g
      y2010: P20ST.G
      y2011: P20ST.G
      y2013: P28ST.E
      y2015: P16ST.E
      y2016: P13STC
      y2017: P14ST.C
      y2018: P15STGBSC.C
      y2020: P13ST.C
      y2023: P13ST.C
      y2024: P14ST.C
    scale:
      min: 1
      max: 4
      labels:
        1: "No trust"
        2: "Little"
        3: "Some"
        4: "A lot"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_4pt
        note: "All waves coded 1=A lot -> 4=No trust; reverse so high=trust"
    qc:
      valid_range: [1, 4]
      validate:
        - waves: [y1995, y1996, y1997, y1998, y2000, y2001, y2002, y2003, y2004, y2005, y2006, y2007, y2008, y2009, y2010, y2011, y2013, y2015, y2016, y2017, y2018, y2020, y2023, y2024]
          phrase: "church"

