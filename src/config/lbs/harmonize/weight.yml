# LBS Survey Weights
# Waves: w1=2015, w2=2016, w3=2018, w4=2020, w5=2023
#
# Individual country weights normalize to mean ~1 within each country.
# All waves use variable name: WT
#
# MISSING VALUES:
# All waves: negative values are missing
# -1=Don't know, -2=No answer, -3=Not applicable, -4=Not asked, -5=DK/NA combined

missing_conventions:
  treat_as_na:
    codes: [-5, -4, -3, -2, -1, 0]
    description: "LBS standard missing codes plus zero (invalid weight)"

variables:
  - id: weight
    concept: sampling
    description: "Individual country weight (normalizes to mean ~1 within country)"
    type: continuous
    source:
      w1: WT
      w2: WT
      w3: WT
      w4: WT
      w5: WT
    scale:
      min: 0
      max: 50
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [0, 50]
    tags: [sampling, weight]
