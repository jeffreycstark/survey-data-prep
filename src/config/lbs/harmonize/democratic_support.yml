# LBS Democratic Support / Authoritarian Alternatives
# Extended to 24 waves (1995-2024) — most variables only available in recent waves
#
# NOTE: These variables have SPARSE coverage. Most are only asked in 2-3 recent waves.
# They are preserved for backward compatibility but are NOT the focus of the
# time-series extension (use dem_always_preferable and dem_satisfaction instead).
#
# MISSING VALUES:
# All waves: negative values are missing
# -1=Don't know, -2=No answer, -3=Not applicable, -4=Not asked, -5=DK/NA combined

missing_conventions:
  treat_as_na:
    codes: [-5, -4, -3, -2, -1]
    description: "LBS standard missing codes"

variables:
  - id: dem_nondem_ok
    concept: democratic_support
    description: "Wouldn't mind a non-democratic government if it could solve problems (1-4, higher = more agreement)"
    type: ordinal
    note: "Very sparse coverage. Only 2016, 2020, 2023."
    source:
      y1995: null
      y1996: null
      y1997: null
      y1998: null
      y2000: null
      y2001: null
      y2002: null
      y2003: null
      y2004: null
      y2005: null
      y2006: null
      y2007: null
      y2008: null
      y2009: null
      y2010: null
      y2011: null
      y2013: null
      y2015: null
      y2016: P44STMB
      y2017: null
      y2018: null
      y2020: P22STM.B
      y2023: P18STM.B
      y2024: null
    scale:
      min: 1
      max: 4
      labels:
        1: "Strongly disagree"
        2: "Disagree"
        3: "Agree"
        4: "Strongly agree"
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_4pt
    qc:
      valid_range: [1, 4]

