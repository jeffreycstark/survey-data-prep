# KLoSA National Pension — CONFOUND (age-linked contributory pension, distinct
# from the Basic Pension treatment in pension_basic.yml)
# Waves: W1-W9 (2006, 2008, 2010, 2012, 2014, 2016, 2018, 2020, 2022)
#
# E033/E035, present + stably coded across all 9 waves (no relocation issue
# here, unlike the G->E pension_basic pattern).
#
# MISSING VALUES:
# -9 = Don't know, -8 = Refuse to answer

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-9, -8]
    description: "KLoSA missing codes"

variables:
  - id: natl_pension_receipt
    concept: pension_other
    description: "Received National Pension benefit in the last year (1=yes, 0=no). Age-60/65 contributory confound — keep distinct from Basic Pension."
    type: binary
    note: "E033 is 4-category: 1=only monthly benefit, 2=only lump-sum, 3=received both, 4=no. Recode 'received any' = {1,2,3}->1, 4->0."
    source:
      w1: w01E033
      w2: w02E033
      w3: w03E033
      w4: w04E033
      w5: w05E033
      w6: w06E033
      w7: w07E033
      w8: w08E033
      w9: w09E033
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: recode
        mapping:
          1: 1
          2: 1
          3: 1
          4: 0
    qc:
      valid_range: [0, 1]

  - id: natl_pension_amount
    concept: pension_other
    description: "Monthly average National Pension benefit (unit: 10,000 KRW)"
    type: continuous
    source:
      w1: w01E035
      w2: w02E035
      w3: w03E035
      w4: w04E035
      w5: w05E035
      w6: w06E035
      w7: w07E035
      w8: w08E035
      w9: w09E035
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [0, 1000]
