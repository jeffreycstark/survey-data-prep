# KLoSA Social/Civic Participation (outcome battery)
# Waves: W1-W9 (2006, 2008, 2010, 2012, 2014, 2016, 2018, 2020, 2022)
#
# KLoSA RENUMBERS THE ENTIRE BATTERY IN W1: the membership items live at
# A017m01-08 in W1 but A033m01-08 in W2-W9; the paired frequency items live
# at A019_01-06 in W1 but A035_01-06 in W2-W9. Confirmed by Task 2's probe
# (outputs/klosa/variable_map.csv) that coding is IDENTICAL across the
# renumbering in both families -- this is a pure questionnaire-revision
# artifact, the same pattern as the A001->A002 age/birth-year shift in
# demographics.yml. The battery IS present in W1 (the placebo wave) --
# a naive w01A033m0N lookup would wrongly conclude it is absent.
#
# MEMBERSHIP items (part_*): raw 0=No / 1=Yes, identical in both the
# A017m (W1) and A033m (W2-W9) families. Harmonized as identity (already
# 0/1) with qc.valid_range enforcing the binary domain.
#
# part_civic (A017m06/A033m06, "Participating to the Political parties, the
# NGOs, the interest groups") is the narrow civic-participation outcome --
# the "buy a citizen" item.
#
# FREQUENCY items (partfreq_*): raw A019_0N (W1) / A035_0N (W2-W9), a 10-pt
# ordinal scale that is DECLINING in frequency -- code 1 = most frequent
# ("almost every day"), code 10 = "almost never engaged". This is the
# opposite of an intuitive increasing-frequency scale; downstream consumers
# must reverse (e.g. 11 - x) before treating higher values as "more
# frequent". Harmonized as identity (raw ordinal preserved) so the reversal
# decision is made once, downstream, not silently baked in here.
#
# No frequency pairs for part_none (A017m08/A033m08) -- "no group
# memberships" has no associated frequency item, by construction.
#
# participation_count / participation_any are NOT built here -- they are
# derived later (Task 9 / 99_create_final_dataset.R) from the membership
# items in this spec.
#
# MISSING VALUES:
# -9 = Don't know, -8 = Refuse to answer

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-9, -8]
    description: "KLoSA: -9=Don't know, -8=Refuse to answer"

variables:
  - id: part_religious
    concept: participation
    description: "Member of a religious organization/group (1=yes, 0=no)"
    type: binary
    note: "W1 column is w01A017m01 (A017m family); W2-W9 are w0NA033m01 (A033m family) -- pure renumbering, coding confirmed identical (0/1) in both."
    source:
      w1: w01A017m01
      w2: w02A033m01
      w3: w03A033m01
      w4: w04A033m01
      w5: w05A033m01
      w6: w06A033m01
      w7: w07A033m01
      w8: w08A033m01
      w9: w09A033m01
    scale:
      min: 0
      max: 1
      labels:
        0: "No"
        1: "Yes"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [0, 1]

