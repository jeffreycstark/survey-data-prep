# KLoSA Basic (Old-Age) Pension — the paper's TREATMENT variable
# Waves: W1-W9 (2006, 2008, 2010, 2012, 2014, 2016, 2018, 2020, 2022)
#
# ⚠️ DESIGN NOTE (corrects an earlier "G->E relocation" story): the G-block
# (G111/G112/G113) is present and well-populated W2-W9, NOT superseded by the
# E-block. The E-block income-module line (E111/E113) exists only from W5
# onward (2014, the Basic Old-Age Pension -> Basic Pension reform wave) and
# agrees with G-block receipt ~92%+ where both exist. Decision (Jeff, via
# Task 6 brief): harmonize BOTH. G-block is the NAMED DEFAULT for the whole
# panel (W2-W9); E-block is kept as a W5-W9 alternate/robustness cross-check.
# W1 (2006) predates any pension program -> pure placebo (all null).
#
# MISSING VALUES:
# -9 = Don't know, -8 = Refuse to answer

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-9, -8]
    description: "KLoSA missing codes: -9 DK, -8 Refuse"

variables:
  - id: basic_pension_receipt
    concept: pension_basic
    description: "Received Basic (Old-Age) Pension — G-block default (1=currently receiving, 0=not). Treatment/first-stage."
    type: binary
    note: >
      NAMED DEFAULT = G-block G111, present W2-W9 (consistent across the 2014
      reform; the item keeps the "Basic Old-Age Pension" label post-2014 but
      tracks the renamed Basic Pension). G111 categories: 1=currently
      receiving, 3=will receive at pension age, 5=not entitled. ⚠️ SCREENER:
      G111 is asked of applicants only, so its NA is a SKIP (didn't apply),
      NOT a refusal — mean(x, na.rm=TRUE) is conditional-on-application
      (~92%), NOT a population rate. Population reading treats skip->0
      (paper-side choice; document KIPA-style, cf.
      src/r/lookups/kipa_bribery_series.R). Cross-check:
      basic_pension_receipt_eblock (E-block) agrees ~92%+ where both exist
      (W5-W9). W1 (2006) predates any pension -> null placebo.
    source:
      w1: null
      w2: w02G111
      w3: w03G111
      w4: w04G111
      w5: w05G111
      w6: w06G111
      w7: w07G111
      w8: w08G111
      w9: w09G111
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: recode
        mapping:
          1: 1
          3: 0
          5: 0
    qc:
      valid_range: [0, 1]
      skip_unmapped_check: true   # W1 intentionally unmapped (placebo)

  - id: basic_pension_receipt_eblock
    concept: pension_basic
    description: "Received Basic Pension — E-block income-module alternate (W5-W9), 1=received in last year, 0=blank/not received."
    type: binary
    note: >
      ALTERNATE (robustness/cross-check), W5-W9 only. E111 is a checkbox:
      1=Check (received, paired 1:1 with non-NA E113 amount), blank=not
      received. Recode 1->1 and treat blank as 0 (blank=not-received
      inference; true item-nonresponse is indistinguishable). Not present
      pre-2014 -> W1-W4 null.
    source:
      w1: null
      w2: null
      w3: null
      w4: null
      w5: w05E111
      w6: w06E111
      w7: w07E111
      w8: w08E111
      w9: w09E111
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: recode
        mapping:
          1: 1
    qc:
      valid_range: [0, 1]
      skip_unmapped_check: true   # W1-W4 intentionally unmapped (pre-2014)

  - id: basic_pension_amount
    concept: pension_basic
    description: "Monthly average Basic (Old-Age) Pension benefit — G-block default (unit: 10,000 KRW). The dose."
    type: continuous
    note: >
      G-block default G112, W2-W9 (paired with basic_pension_receipt).
      Enables the dose (not on/off) framing across the whole panel.
      ⚠️ UNIT BUG FOUND IN VERIFICATION: G112's SPSS variable label reads
      "unit: 10,000 won", but the raw stored values are the literal KRW
      amount rounded to the nearest 10,000 (observed raw range ~20,000-
      500,000 across waves) — NOT already divided by 10,000. Confirmed
      against known policy amounts: W5 (2014) raw values of 200,000/320,000
      match the real individual/couple Basic Pension amounts introduced
      that year exactly. Harmonized here with won_to_10k_won() (divide by
      10,000) to actually land in the unit the label claims and match
      basic_pension_amount_eblock's scale. This is distinct from the
      cosmetic KLoSA age-label bug in demographics.yml (there the label
      text is wrong but stored values are correct; here the stored values
      themselves were in the wrong unit).
      ⚠️ G/E-BLOCK DIVERGENCE NEAR 2014 REFORM: The G-block amount
      (entitlement/schedule level) and the E-block amount (amount actually
      received) DIVERGE ~2× in W5–W6 (median 20 vs 9–10, 10k-won) and only
      converge in W7–W9 — most likely the 2014–15 National-Pension-linkage
      deduction reducing actual payouts below the statutory maximum. Do NOT
      treat the two amount measures as interchangeable near the 2014 reform
      boundary (the very window an RD/diff-in-disc identifies on).
    source:
      w1: null
      w2: w02G112
      w3: w03G112
      w4: w04G112
      w5: w05G112
      w6: w06G112
      w7: w07G112
      w8: w08G112
      w9: w09G112
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: won_to_10k_won
    qc:
      valid_range: [0, 300]   # 10k-won units; widen if probe shows higher
      skip_unmapped_check: true

  - id: basic_pension_amount_eblock
    concept: pension_basic
    description: "Monthly average Basic Pension — E-block income-module alternate (W5-W9), unit 10,000 KRW."
    type: continuous
    note: >
      Paired with basic_pension_receipt_eblock. W5 median ~9 (10k-won,
      ~90,000 KRW/mo) rising to ~25 by W9. Absent pre-2014.
      ⚠️ G/E-BLOCK DIVERGENCE NEAR 2014 REFORM: E-block (actual amount
      received) and G-block (entitlement/schedule level) DIVERGE ~2× in
      W5–W6 (median 9–10 vs 20, 10k-won) and only converge in W7–W9 — most
      likely the 2014–15 National-Pension-linkage deduction reducing actual
      payouts below the statutory maximum. Do NOT treat the two amount
      measures as interchangeable near the 2014 reform boundary (the very
      window an RD/diff-in-disc identifies on).
    source:
      w1: null
      w2: null
      w3: null
      w4: null
      w5: w05E113
      w6: w06E113
      w7: w07E113
      w8: w08E113
      w9: w09E113
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [0, 300]
      skip_unmapped_check: true

  - id: basic_pension_couple
    concept: pension_basic
    description: "Benefit is for the couple vs. the individual (1=couple, 0=individual). Affects the means test. G-block only (no E-block equivalent)."
    type: binary
    note: "G113, W2-W9. Raw: 1=Provided to the individual, 5=Provided to the couple. No E-block 'self or couple' flag exists."
    source:
      w1: null
      w2: w02G113
      w3: w03G113
      w4: w04G113
      w5: w05G113
      w6: w06G113
      w7: w07G113
      w8: w08G113
      w9: w09G113
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: recode
        mapping:
          1: 0
          5: 1
    qc:
      valid_range: [0, 1]
      skip_unmapped_check: true
