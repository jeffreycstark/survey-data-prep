# Afrobarometer R9 Social Trust
# Wave: w9 (Round 9, 2021-2023)
#
# No binary generalized trust item available in Afrobarometer R9.
# Column will be NA for cross-survey compatibility.
#
# MISSING VALUES:
# -1=Missing, 8=Refused, 9=Don't know, 998=Refused, 999=Don't know

missing_conventions:
  treat_as_na:
    codes: [-1, 8, 9, 98, 99, 998, 999]
    description: "Afrobarometer standard missing codes"

variables:
  - id: trust_generalized_binary
    concept: social_trust
    description: "Most people can be trusted vs. You must be very careful"
    type: nominal
    note: "No binary generalized trust item in Afrobarometer R9. Column will be NA."
    source:
      w9: null
    scale:
      min: 0
      max: 1
      labels:
        1: "Most people can be trusted"
        0: "One can never be too careful"
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [0, 1]
