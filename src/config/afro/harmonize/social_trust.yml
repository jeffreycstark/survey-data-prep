# Afrobarometer Social Trust
# Waves: w1-w9 (Rounds 1-9)
#
# No binary generalized trust item available in Afrobarometer.
# Column will be NA for cross-survey compatibility.

missing_conventions:
  treat_as_na:
    codes: [-1, 8, 9, 98, 99, 998, 999]
    description: "Afrobarometer standard missing codes"

variables:
  - id: trust_generalized_binary
    concept: social_trust
    description: "Most people can be trusted vs. You must be very careful"
    type: nominal
    note: "No binary generalized trust item in Afrobarometer. Column will be NA."
    source:
      w1: null
      w2: null
      w3: null
      w4: null
      w5: null
      w6: null
      w7: null
      w8: null
      w9: null
    scale:
      min: 0
      max: 1
      labels:
        1: "Most people can be trusted"
        0: "One can never be too careful"
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [0, 1]
