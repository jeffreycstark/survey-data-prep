# Afrobarometer Survey Weights
# Waves: w1-w9 (Rounds 1-9)
#
# R1-R7: withinwt (within-country weight)
# R4: Withinwt (capitalized)
# R8: withinwt_hh (household-level, preferred)
# R9: withinwt_hh
#
# MISSING VALUES:
# -1=Missing, 0=Invalid weight

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-1, 0]
    description: "Missing and invalid weight values"

variables:
  - id: weight
    concept: sampling
    description: "Within-country weight (normalizes to mean ~1 within country)"
    type: continuous
    source:
      w1: withinwt
      w2: withinwt
      w3: withinwt
      w4: Withinwt
      w5: withinwt
      w6: withinwt
      w7: withinwt
      w8: withinwt_hh
      w9: withinwt_hh
    scale:
      min: 0
      max: 50
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [0, 50]
    tags: [sampling, weight]
