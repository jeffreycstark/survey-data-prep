# Afrobarometer Demographics
# Rounds 1-9
#
# MISSING VALUES:
# Standard Afro: -1=Missing, 8/98=Refused, 9/99/999=Don't know, 998=Refused
# R1 age: 101=Refused, 999=Missing; educ: 10=DK, 98=Refused, 99=Missing

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-1, 8, 9, 10, 98, 99, 101, 998, 999]
    description: "Afrobarometer standard missing codes"
  education_ladder_missing:
    codes: [-1, 98, 99, 998, 999]
    description: |
      For the 0-9 education ladder (q84/q90/Q89/Q97/Q94), where 8 and 9 are
      SUBSTANTIVE values -- 8="University completed", 9="Post-graduate" --
      not missing codes. The shared `treat_as_na` set lists 8/9 because on
      Afrobarometer's 0-3 items they mean Refused/Don't-know; applying it to
      the ladder silently deleted every university-completed and post-graduate
      respondent (verified in raw R5/R7/R9: thousands per round).

      Code 9 is genuinely ambiguous across waves: Post-graduate in the 0-9
      detailed variable (R2-R4), but "Don't know" in the 0-3 EDUC_COND
      (R5-R9). Since `missing:` cannot vary by wave and `codes:` only appends
      to a convention, EDUC_COND's 9 is instead caught by `valid_range: [0,3]`
      and converted to NA there. That is correct but shows up in the
      out-of-range log rather than as a missing code -- expected, not a fault.
  no_missing_codes:
    codes: []
    description: |
      Empty convention for derived numeric variables whose values are
      ordinary integers (e.g. int_month 1-12) and would otherwise collide
      with the treat_as_na codes 8/9 (month Aug/Sep get incorrectly excluded
      from raw_valid).

variables:
  - id: gender
    concept: demographics
    description: "Gender of respondent (1=Male, 2=Female)"
    type: nominal
    source:
      w1: gender
      w2: q96
      w3: q101
      w4: Q101
      w5: Q101
      w6: Q101
      w7: Q101
      w8: Q101
      w9: Q100
    scale:
      min: 1
      max: 2
      labels:
        1: "Male"
        2: "Female"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 2]

  - id: age
    concept: demographics
    description: "Age of respondent in years"
    type: continuous
    source:
      w1: age
      w2: q80
      w3: q1
      w4: Q1
      w5: Q1
      w6: Q1
      w7: Q1
      w8: Q1
      w9: Q1
    scale:
      min: 18
      max: 110
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
        note: "Continuous age in years. Clean missing codes."
    qc:
      valid_range: [18, 110]

  - id: age_cohort
    concept: demographics
    description: "Age cohort (1=18-29, 2=30-39, 3=40-49, 4=50-59, 5=60+)"
    type: ordinal
    note: "Derived from continuous age variable. Same source columns as age."
    source:
      w1: age
      w2: q80
      w3: q1
      w4: Q1
      w5: Q1
      w6: Q1
      w7: Q1
      w8: Q1
      w9: Q1
    scale:
      min: 1
      max: 5
      labels:
        1: "18-29 (youth)"
        2: "30-39"
        3: "40-49"
        4: "50-59"
        5: "60+"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: recode_age_cohort
        note: "Bins continuous age into 5 cohorts"
    qc:
      valid_range: [1, 5]

  - id: education_level
    concept: demographics
    description: "Education level (0=No formal, 1=Primary, 2=Secondary, 3=Post-secondary)"
    type: ordinal
    note: "R1 uses educ (0-3); R2 q84, R3 q90, R4 Q89 (0-9 detailed, collapse); R5-R9 EDUC_COND (0-3)"
    source:
      w1: educ
      w2: q84
      w3: q90
      w4: Q89
      w5: EDUC_COND
      w6: EDUC_COND
      w7: EDUC_COND
      w8: EDUC_COND
      w9: EDUC_COND
    scale:
      min: 0
      max: 3
      labels:
        0: "No formal schooling"
        1: "Primary"
        2: "Secondary"
        3: "Post-secondary"
    missing:
      # NOT `treat_as_na`: R2-R4 read the 0-9 ladder, where 8/9 are substantive
      # (University completed / Post-graduate) and must survive to be collapsed
      # into 3 = Post-secondary. `codes: [10]` adds R1 educ's Don't-know code.
      # EDUC_COND's 9 (Don't know, R5-R9) is NA'd by qc.valid_range below.
      use_convention: education_ladder_missing
      codes: [10]
    harmonize:
      default:
        method: identity
        note: "R1, R5-R9 already 0-3"
      exceptions:
        w2:
          method: r_function
          fn: recode_afro_educ_detailed
          note: "R2 q84: 0-9 -> 0-3"
        w3:
          method: r_function
          fn: recode_afro_educ_detailed
          note: "R3 q90: 0-9 -> 0-3"
        w4:
          method: r_function
          fn: recode_afro_educ_detailed
          note: "R4 Q89: 0-9 -> 0-3"
    qc:
      valid_range: [0, 3]

  - id: education_detailed
    concept: demographics
    description: "Education level detailed (0-9 scale from Q94/Q97 raw)"
    type: ordinal
    note: "R1 only has condensed 0-3 (educ), so null. R2-R9 have detailed 0-9."
    source:
      w1: null
      w2: q84
      w3: q90
      w4: Q89
      w5: Q97
      w6: Q97
      w7: Q97
      w8: Q97
      w9: Q94
    scale:
      min: 0
      max: 9
      labels:
        0: "No formal schooling"
        1: "Informal schooling only"
        2: "Some primary schooling"
        3: "Primary school completed"
        4: "Some secondary school / high school"
        5: "Secondary school completed / high school"
        6: "Post-secondary qualifications, not university"
        7: "Some university"
        8: "University completed"
        9: "Post-graduate"
    missing:
      # NOT `treat_as_na`: 8 = "University completed", 9 = "Post-graduate" are
      # substantive on this ladder. Using the shared convention deleted them.
      use_convention: education_ladder_missing
    harmonize:
      default:
        method: identity
        note: "Raw 0-9 scale preserved. Missing codes cleaned."
    qc:
      valid_range: [0, 9]

  - id: urban_rural
    concept: demographics
    description: "Urban / Rural / Semi-Urban PSU (1=Urban, 2=Rural, 3=Semi-Urban)"
    type: nominal
    source:
      w1: urbrur
      w2: urbrur
      w3: urbrur
      w4: URBRUR
      w5: URBRUR
      w6: URBRUR
      w7: URBRUR
      w8: URBRUR
      w9: URBRUR
    note: |
      R5+ raw includes a 3rd category 3=Semi-Urban (~600-720 respondents
      per round). Previously the YAML's `note` claimed "Peri-urban (3) ->
      1 (Urban)" but the harmonize method was identity, so code 3 was
      actually being NA-coerced by valid_range [1,2]. Widened scale to
      [1,3] on 2026-05-14 to preserve the substantive category.

      2026-07-31: the SAME leak was still open one code further out. R6 (88
      cases) and R7 (40) also carry `460 = "Peri-Urban"`, which valid_range
      [1,3] was silently deleting — the identical failure mode the paragraph
      above describes, found this time by the out-of-range triage
      (src/r/audit/03_oob_triage.R) rather than by hand. R7 carries codes 3
      and 460 simultaneously (647 vs 40), so 460 is a separate source code,
      but "Peri-Urban" and "Semi-Urban" name the same concept and no round
      offers both as distinct substantive options. Folded 460 into 3,
      consistent with the 2026-05-14 decision to preserve rather than drop.
    scale:
      min: 1
      max: 3
      labels:
        1: "Urban"
        2: "Rural"
        3: "Semi-Urban"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
      by_wave:
        w6: &urbrur_peri
          method: recode
          note: "460 ('Peri-Urban') folded into 3 ('Semi-Urban') — same concept."
          mapping:
            1: 1
            2: 2
            3: 3
            460: 3
        w7: *urbrur_peri
    qc:
      valid_range: [1, 3]

  - id: int_month
    concept: identifiers
    description: "Interview month (1-12)"
    type: ordinal
    source:
      w1: null
      w2: dateintr
      w3: dateintr
      w4: DATEINTR
      w5: DATEINTR
      w6: DATEINTR
      w7: DATEINTR
      w8: DATEINTR
      w9: DATEINTR
    note: |
      DATEINTR is Date class in R2-R9. R1 has no date variable. Uses an
      empty missing-codes convention because month values 8 (August) and
      9 (September) would collide with treat_as_na codes 8/9.
    scale:
      min: 1
      max: 12
    missing:
      use_convention: no_missing_codes
    harmonize:
      default:
        method: r_function
        fn: extract_month_from_date
    qc:
      valid_range: [1, 12]

  - id: int_year
    concept: identifiers
    description: "Interview year"
    type: ordinal
    source:
      w1: null
      w2: dateintr
      w3: dateintr
      w4: DATEINTR
      w5: DATEINTR
      w6: DATEINTR
      w7: DATEINTR
      w8: DATEINTR
      w9: DATEINTR
    note: "DATEINTR is Date class in R2-R9. R1 has no date variable."
    scale:
      min: 1999
      max: 2024
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: extract_year_from_date
    qc:
      valid_range: [1999, 2024]

  - id: int_date
    concept: identifiers
    description: "Full interview date (Date class)"
    type: continuous
    source:
      w1: null
      w2: dateintr
      w3: dateintr
      w4: DATEINTR
      w5: DATEINTR
      w6: DATEINTR
      w7: DATEINTR
      w8: DATEINTR
      w9: DATEINTR
    note: |
      Date class in R2-R9. R1 has no date variable. Harmonized output is
      R Date class — typeof=double but is.numeric() returns FALSE (Date
      class blocks numeric semantics), so the type_stability check sees
      storage as "double" not "numeric". Skip the type check.
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: extract_date
    qc:
      skip_range_check: true
      skip_type_stability: true
