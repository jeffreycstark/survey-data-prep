  # perceived corruption. Q-codes verified against R5/R8/R9 merged .sav
  # value labels 2026-07-03. Tax officials (Q60F/Q42G) exist but are NOT
  # part of the T&M six-item index — deliberately excluded.
  # The additive index `corruption_perc` (sum 0-18, complete cases) is
  # built in src/r/data_prep_modules/afro/99_create_final_dataset.R.
  # NB: R5 judges = Q60G (Q60F is tax officials); R8/R9 judges = Q42F/Q38F.
