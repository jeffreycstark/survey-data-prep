      w5: Q61D
      w6: Q55J
      w7: Q49T
      w8: Q44N
      w9: Q43E
    scale:
      min: 0
      max: 3
      labels:
        0: "Never"
        1: "Once or twice"
        2: "A few times"
        3: "Often"
    missing:
      use_convention: treat_as_na
    harmonize:
