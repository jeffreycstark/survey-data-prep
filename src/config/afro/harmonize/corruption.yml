# Afrobarometer Corruption Experience
# Rounds 2-9
#
# Bribery experience items: "How often, if ever, did you have to pay a bribe?"
# Scale: 0=Never, 1=Once or twice, 2=A few times, 3=Often
# Higher = more bribery experience
#
# R1 has different items (pfpcr1-5 perception; no comparable bribery experience)
#
# MISSING VALUES:
# -1=Missing, 7=Not applicable/No experience, 8/98=Refused, 9/99=Don't know

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-1, 7, 8, 9, 98, 99, 997, 998]
    description: "Afrobarometer standard missing codes; 7=Not applicable treated as NA; 997=Not asked (R5 corruption battery)"

variables:
  - id: bribe_document
    concept: corruption_experience
    description: "Pay bribe for document or permit (0-3, higher = more often)"
    type: ordinal
    source:
      w1: null
      w2: q59a
      w3: q57a
      w4: Q51A
      w5: Q61A
      w6: Q55F
      w7: Q49K
      w8: Q44I
      w9: Q42C
    scale:
      min: 0
      max: 3
      labels:
        0: "Never"
        1: "Once or twice"
        2: "A few times"
        3: "Often"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
        note: "0-3 scale consistent R2-R9. Clean missing codes."
    qc:
      valid_range: [0, 3]

  - id: bribe_police
    concept: corruption_experience
    description: "Pay bribe to avoid problem with police (0-3, higher = more often)"
    type: ordinal
    source:
