# Afrobarometer R9 Institutional Trust
# Wave: w9 (Round 9, 2021-2023)
#
# SCALE DIRECTION:
# Raw: 0=Not at all, 1=Just a little, 2=Somewhat, 3=A lot
# Target: 1=Not at all, 2=Just a little, 3=Somewhat, 4=A lot
# All items need recode_0_3_to_1_4 (+1 shift) so higher = more trust
#
# MISSING VALUES:
# -1=Missing, 8=Refused, 9=Don't know, 998=Refused, 999=Don't know

missing_conventions:
  treat_as_na:
    codes: [-1, 8, 9, 98, 99, 998, 999]
    description: "Afrobarometer standard missing codes"

variables:
  - id: trust_president
    concept: institutional_trust
    description: "Trust in the President"
    type: ordinal
    source:
      w9: Q37A
    scale:
      min: 1
      max: 4
      labels:
        1: "Not at all"
        2: "Just a little"
        3: "Somewhat"
        4: "A lot"
    harmonize:
      default:
        method: r_function
        fn: recode_0_3_to_1_4
        note: "Raw 0-3 scale shifted +1 to match 1-4 target"
    qc:
      valid_range: [1, 4]

