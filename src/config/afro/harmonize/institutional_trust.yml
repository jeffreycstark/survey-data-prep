# Afrobarometer Institutional Trust
# Waves: w1-w9 (Rounds 1-9)
#
# SCALE DIRECTION:
# R1: Raw 1-4 (1=Not at all, 2=Distrust somewhat, 3=Trust somewhat, 4=Trust a lot)
#   → Use recode_afro_r1_trust (identity after missing cleanup)
# R2-R9: Raw 0-3 (0=Not at all, 1=Just a little, 2=Somewhat, 3=A lot)
#   → Use recode_0_3_to_1_4 (+1 shift)
# Target: 1=Not at all, 2=Just a little, 3=Somewhat, 4=A lot
#
# MISSING VALUES:
# -1=Missing, 8=Refused, 9=Don't know, 98=Refused, 99=Don't know, 998=Refused, 999=Don't know

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-1, 8, 9, 98, 99, 998, 999]
    description: "Afrobarometer standard missing codes"

variables:
  - id: trust_president
    concept: institutional_trust
    description: "Trust in the President"
    type: ordinal
    source:
      w1: trspre
      w2: q43a
      w3: q55a
      w4: Q49A
      w5: Q59A
      w6: Q52A
      w7: Q43A
      w8: Q41A
      w9: Q37A
    scale:
      min: 1
      max: 4
      labels:
        1: "Not at all"
        2: "Just a little"
        3: "Somewhat"
        4: "A lot"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: recode_0_3_to_1_4
        note: "R2-R9: raw 0-3 scale shifted +1 to 1-4"
      w1:
        method: r_function
        fn: recode_afro_r1_trust
        note: "R1 already 1-4; clean missing codes only"
    qc:
      valid_range: [1, 4]

