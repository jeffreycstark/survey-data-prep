# Afrobarometer Democratic Attitudes
# Waves: w1-w9 (Rounds 1-9)
#
# MISSING VALUES:
# -1=Missing, 8=Refused, 9=Don't know, 98=Refused, 99=Don't know, 998=Refused, 999=Don't know

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-1, 8, 9, 98, 99, 998, 999]
    description: "Afrobarometer standard missing codes"

variables:
  # ===========================================================================
  # Support for Democracy (Churchillian item)
  # ===========================================================================
  # R1: 1=Dem pref, 2=Doesn't matter, 3=Non-dem pref → recode_afro_dem_pref_r1
  # R2-R8: 1=Doesn't matter, 2=Non-dem pref, 3=Dem pref → recode_afro_dem_pref_r2_r8
  # R9: 1=Dem pref, 2=Non-dem pref, 3=Doesn't matter → identity
  # Target: 1=Dem pref, 2=Non-dem pref, 3=Doesn't matter

  - id: dem_support_preferable
    concept: democratic_attitudes
    description: "Support for democracy: Democracy preferable (1) vs Non-dem sometimes preferable (2) vs Doesn't matter (3)"
    type: nominal
    source:
      w1: supdem
      w2: q38
      w3: q37
      w4: Q30
      w5: Q32
      w6: Q30
      w7: Q28
      w8: Q21
      w9: Q23
    scale:
      min: 1
      max: 3
      labels:
        1: "Democracy is preferable to any other kind of government"
        2: "In some circumstances, a non-democratic government can be preferable"
        3: "For someone like me, it doesn't matter what kind of government we have"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
        note: "R9 already uses target coding"
      w1:
        method: r_function
        fn: recode_afro_dem_pref_r1
        note: "R1: 1=Dem,2=Doesn't matter,3=Non-dem → swap 2 and 3"
      w2:
        method: r_function
        fn: recode_afro_dem_pref_r2_r8
        note: "R2: 1=Doesn't matter,2=Non-dem,3=Dem → reverse"
      w3:
        method: r_function
        fn: recode_afro_dem_pref_r2_r8
      w4:
        method: r_function
        fn: recode_afro_dem_pref_r2_r8
      w5:
        method: r_function
        fn: recode_afro_dem_pref_r2_r8
      w6:
        method: r_function
        fn: recode_afro_dem_pref_r2_r8
      w7:
        method: r_function
        fn: recode_afro_dem_pref_r2_r8
      w8:
        method: r_function
        fn: recode_afro_dem_pref_r2_r8
    qc:
      valid_range: [1, 3]
      # R1 uses a 4-category scheme where code 4 = "Don't know" (substantive
      # 4th category, not declared as missing in the codebook). R2+ drop DK
      # via the engine's missing convention (code 9 or 8). For consistency,
      # R1 DK is also treated as NA — declared here so the audit's coverage
      # check sees the drop as intentional rather than as silent loss.
      # Code 97 = "Not applicable" (R1) is similarly intentional.
      coverage_missing_codes_by_wave:
        w1: [4, 97]

  # ===========================================================================
  # Satisfaction with Democracy
  # ===========================================================================
  # R1: 0-5 scale (different from target 1-4) → null
  # R2-R8: 0=Not a democracy(→NA), 1-4 satisfaction → recode_afro_dem_sat
  # R9: 1-4 → identity

  # NOTE: Raw code 0 ("Country is not a democracy") is intentionally dropped
  # to NA here (R2-R8 via recode_afro_dem_sat; R9 via the valid_range [1,4]
  # range-coercion of the identity method). The 0-responders are preserved
  # as a separate binary in dem_country_not_democracy (added 2026-05-12).
  # Without this intent declaration via coverage_missing_codes_by_wave, the
  # audit's coverage check flagged the drops as 1.6-2.2% coverage loss
  # (E2 finding pre-2026-05-12).
  - id: dem_satisfaction
    concept: democratic_attitudes
    description: "Satisfaction with democracy (1-4, higher = more satisfied). 'Country is not a democracy' responders are excluded here and captured in dem_country_not_democracy."
    type: ordinal
    source:
      w1: null
      w2: q40
      w3: q47
      w4: Q43
      w5: Q43
      w6: Q41
      w7: Q36
      w8: Q37
      w9: Q31
    scale:
      min: 1
      max: 4
      labels:
        1: "Not at all satisfied"
        2: "Not very satisfied"
        3: "Fairly satisfied"
        4: "Very satisfied"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
        note: "R9 already uses 1-4 target scale"
      w2:
        method: r_function
        fn: recode_afro_dem_sat
        note: "R2-R8: 0=Not a democracy treated as NA, 1-4 identity"
      w3:
        method: r_function
        fn: recode_afro_dem_sat
      w4:
        method: r_function
        fn: recode_afro_dem_sat
      w5:
        method: r_function
        fn: recode_afro_dem_sat
      w6:
        method: r_function
        fn: recode_afro_dem_sat
      w7:
        method: r_function
        fn: recode_afro_dem_sat
      w8:
        method: r_function
        fn: recode_afro_dem_sat
    qc:
      valid_range: [1, 4]
      # Declare the intentional drop of code 0 ("Country is not a democracy")
      # so the audit's coverage check classifies it as expected. The dropped
      # respondents are preserved in dem_country_not_democracy.
      coverage_missing_codes_by_wave:
        w2: [0]
        w3: [0]
        w4: [0]
        w5: [0]
        w6: [0]
        w7: [0]
        w8: [0]
        w9: [0]   # R9 uses identity but valid_range [1,4] also drops 0

  # ===========================================================================
  # Sister variable to dem_satisfaction: captures the "Country is not a
  # democracy" responses that recode_afro_dem_sat treats as NA.
  # ===========================================================================
  # Authored 2026-05-12 after investigating the 1.6% R2 coverage loss
  # finding (JEFF_MUST_INVESTIGATE.md medium TODO #4). Rather than declaring
  # the 0 → NA mapping with coverage_missing_codes_by_wave (which loses the
  # information), preserve it as a binary signal.
  #
  # Substantive distinction:
  #   dem_satisfaction       = 1-4 satisfaction conditional on "yes, my
  #                            country is democratic enough to be satisfied
  #                            with". NA for everyone else.
  #   dem_country_not_democracy = 1 if respondent said "my country is not a
  #                               democracy" on this question, 0 if they
  #                               answered the satisfaction scale, NA for
  #                               DK/refused/etc.
  #
  # Per-wave raw scale check (verified 2026-05-12 against the merged .sav files):
  #   R1 (dmpsat): 0=not democracy, 1-5=5-pt satisfaction (Ghana only uses 3),
  #                97=N/A, 9=DK, 98/99=admin missing. Ghana/Nigeria didn't
  #                offer code 0 (their respondents physically couldn't say
  #                "not a democracy" on this question) — so their values
  #                here will be 0 (= "did not pick not-democracy"), which
  #                undercounts the construct in those two countries.
  #                Acceptable for cross-wave use; flag in any R1 analysis.
  #   R2-R8 (q40 etc.): 0=not democracy, 1-4=4-pt satisfaction, 9=DK,
  #                98=Refused, -1=Missing.
  #   R9 (Q31): 0=not democracy (932 cases — currently silently NA-coerced
  #             by the engine's valid_range [1,4] in dem_satisfaction),
  #             1-4=satisfaction, 8=Refused, 9=DK.

  - id: dem_country_not_democracy
    concept: democratic_attitudes
    description: >
      Binary: 1 = respondent said "my country is not a democracy" when
      asked about satisfaction with democracy (raw code 0 on the
      dem-satisfaction question); 0 = answered the satisfaction scale.
      Sister to dem_satisfaction — captures the population that
      recode_afro_dem_sat drops as NA.
    type: binary
    source:
      w1: dmpsat
      w2: q40
      w3: q47
      w4: Q43
      w5: Q43
      w6: Q41
      w7: Q36
      w8: Q37
      w9: Q31
    scale:
      min: 0
      max: 1
      labels:
        0: "Answered satisfaction scale (1-4 or 1-5)"
        1: "Country is not a democracy"
    missing:
      use_convention: treat_as_na
      codes: [97]   # R1-only N/A code; not in afro treat_as_na convention
    harmonize:
      default:
        method: recode
        mapping:
          0: 1   # the substantive "not democracy" response
          1: 0   # answered satisfaction = not "not democracy"
          2: 0
          3: 0   # R1 Ghana's neutral OR R2-R9 "Fairly satisfied"
          4: 0
          5: 0   # R1 only ("Very satisfied" in the 5-pt scheme)
    qc:
      valid_range: [0, 1]
      validate:
        - waves: [w1, w2, w3, w4, w5, w6, w7, w8, w9]
          phrase: "satisf.*democracy|democracy.*satisf"

  # ===========================================================================
  # How Democratic Is Country (qualitative, 1-4)
  # ===========================================================================
  # R1: 0-3 scale (different from 1-4 target) → null
  # R2-R9: 1-4 → identity (8/9=DK handled by missing_conventions)

  - id: dem_how_democratic_qual
    concept: democratic_attitudes
    description: "How democratic is the country (1-4, higher = more democratic)"
    type: ordinal
    source:
      w1: null
      w2: q37
      w3: q46
      w4: Q42A
      w5: Q42
      w6: Q40
      w7: Q35
      w8: Q36
      w9: Q30
    scale:
      min: 1
      max: 4
      labels:
        1: "Not a democracy"
        2: "A democracy with major problems"
        3: "A democracy with minor problems"
        4: "A full democracy"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
        note: "R2-R9 all use 1-4 coding. 8=Don't understand, 9=DK handled by missing codes."
    qc:
      valid_range: [1, 4]

  # ===========================================================================
  # How Democratic (10-point) — NOT AVAILABLE
  # ===========================================================================

  - id: dem_how_democratic_10pt
    concept: democratic_attitudes
    description: "How democratic is the country on a 1-10 scale"
    type: ordinal
    note: "No 10-point version in Afrobarometer. Column will be NA."
    source:
      w1: null
      w2: null
      w3: null
      w4: null
      w5: null
      w6: null
      w7: null
      w8: null
      w9: null
    scale:
      min: 1
      max: 10
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 10]

  # ===========================================================================
  # Churchill Quote: Democracy Best System — NOT AVAILABLE
  # ===========================================================================

  - id: dem_best_system
    concept: democratic_attitudes
    description: "Agreement that democracy is the best system of government"
    type: ordinal
    note: "No Churchill item in Afrobarometer. Column will be NA."
    source:
      w1: null
      w2: null
      w3: null
      w4: null
      w5: null
      w6: null
      w7: null
      w8: null
      w9: null
    scale:
      min: 1
      max: 4
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 4]
