# Afrobarometer Democratic Support / Authoritarian Alternatives
# Waves: w1-w9 (Rounds 1-9)
#
# None of the LBS democratic_support variables have direct equivalents
# in Afrobarometer at matching scales.
# All columns will be NA for cross-survey compatibility.

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-1, 8, 9, 98, 99, 998, 999]
    description: "Afrobarometer standard missing codes"

variables:
  - id: dem_nondem_ok
    concept: democratic_support
    description: "Wouldn't mind a non-democratic government if it could solve problems"
    type: ordinal
    note: "No equivalent in Afrobarometer. Column will be NA."
    source:
      w1: null
      w2: null
      w3: null
      w4: null
      w5: null
      w6: null
      w7: null
      w8: null
      w9: null
    scale:
      min: 1
      max: 4
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 4]

  - id: dem_military_support
    concept: democratic_support
    description: "Would support a military government"
    type: nominal
    note: "Afro has similar items but uses different scales. Column will be NA."
    source:
      w1: null
      w2: null
      w3: null
      w4: null
      w5: null
      w6: null
      w7: null
      w8: null
      w9: null
    scale:
      min: 1
      max: 2
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 2]

  - id: dem_solves_problems
    concept: democratic_support
    description: "Democracy allows us to solve problems"
    type: ordinal
    note: "No equivalent in Afrobarometer. Column will be NA."
    source:
      w1: null
      w2: null
      w3: null
      w4: null
      w5: null
      w6: null
      w7: null
      w8: null
      w9: null
    scale:
      min: 1
      max: 4
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 4]

  - id: pol_say_what_think
    concept: political_expression
    description: "Do people say what they think about politics?"
    type: nominal
    note: "Afro has similar items but uses different scales. Column will be NA."
    source:
      w1: null
      w2: null
      w3: null
      w4: null
      w5: null
      w6: null
      w7: null
      w8: null
      w9: null
    scale:
      min: 1
      max: 2
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 2]
