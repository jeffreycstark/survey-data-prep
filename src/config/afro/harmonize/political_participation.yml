# Afrobarometer Political Participation & Clientelism
# Added 2026-07-03 for the Tambe & Monyake (2023) extension
# (paper-bank Block 1). Q-codes verified against the R5/R6/R8/R9 merged
# .sav value labels on 2026-07-03.
#
# ⚠️ AVAILABILITY CONSTRAINTS (verified against raw data, not just codebooks):
#   - vote_buying is NOT fielded in R6, R7, or R9. The extension window can
#     only be R8 — BLOCK1_DESIGN_LOCK.md's "Rounds 8-9" framing is infeasible.
#   - polint (interest in public affairs) exists only in R5 and R6; the
#     R8 extension model must drop it from the control set.
#
# MISSING VALUES: Afrobarometer standard is -1=Missing, 8/98/998=Refused,
# 9/99=Don't know; 997=Not asked (R5). Item-specific codes handled in the
# per-variable mappings below (structural ineligibility -> null, not 0).

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-1, 7, 8, 9, 98, 99, 997, 998]
    description: "Afrobarometer standard missing codes; 7=Not applicable/no experience treated as NA"
  dk_refused_only:
    codes: [-1, 9, 98, 99, 997, 998]
    description: "DK/Refused/Missing only — for items whose 7/8 codes are substantive (turnout reasons)"

variables:
  - id: turnout
    concept: political_participation
    description: "Voted in most recent national election (1=voted, 0=did not vote for substantive reasons; ineligible -> NA)"
    type: binary
    note: >
      Tambe & Monyake (2023) DV. Judgment call logged 2026-07-03 (their text
      does not specify): voted=1; substantive non-voting (decided not to,
      could not find polling station, prevented, no time, name not in
      register, other reason)=0; STRUCTURALLY INELIGIBLE (not registered,
      too young) -> NA, not 0; R8/R9 "can't remember" -> NA, not 0.
      R5 code 7 "did not vote for some other reason" counted as substantive
      non-voting (=0). R5 uses the rich 0-9 reason scale (Q27); R8/R9 use
      the collapsed 4-code scale (Q13). R6/R7 turnout items exist in those
      rounds' codebooks but are outside the T&M design; left unmapped.
    source:
      w1: null
      w2: null
      w3: null
      w4: null
      w5: Q27
      w6: null
      w7: null
      w8: Q13
      w9: Q13
    scale:
      min: 0
      max: 1
      labels:
        0: "Did not vote (substantive reason)"
        1: "Voted"
    missing:
      use_convention: dk_refused_only
      codes: [8]        # w8/w9 Refused; w5 code 8 (too young) mapped to null below
    harmonize:
      by_wave:
        w5:
          method: recode
          mapping:
            0: null   # not registered — structurally ineligible
            1: 1      # voted
            2: 0      # decided not to vote
            3: 0      # could not find polling station
            4: 0      # prevented from voting
            5: 0      # did not have time
            6: 0      # name not in register
            7: 0      # some other reason (substantive non-vote; judgment call)
            8: null   # too young — structurally ineligible
          note: "9=DK/can't remember + 998=Refused masked by convention"
        w8:
          method: recode
          mapping:
            0: 0      # did not vote
            1: null   # too young — structurally ineligible
            2: null   # can't remember — missing, not 0
            3: 1      # voted
        w9:
          method: recode
          mapping:
            0: 0
            1: null
            2: null
            3: 1
    qc:
      valid_range: [0, 1]

  - id: vote_buying
    concept: political_participation
    description: "Offered food/gift/money for vote during last election (0=never, 1=ever offered)"
    type: binary
    note: >
      Tambe & Monyake (2023) key IV, their binary collapse (0=never,
      1=once or twice/a few times/often). ⚠️ NOT FIELDED in R6, R7, or R9
      (verified against raw variable labels 2026-07-03) — the extension
      window is R8 ONLY. R5 code 7 "No experience with this in past year"
      treated as NA per the repo-wide Afrobarometer convention for code 7
      (consistent with the bribe_* battery), not as 0=never; logged as a
      judgment call since T&M do not discuss code 7.
    source:
      w1: null
      w2: null
      w3: null
      w4: null
      w5: Q61F
      w6: null
      w7: null
      w8: Q16B
      w9: null
    scale:
      min: 0
      max: 1
      labels:
        0: "Never offered"
        1: "Ever offered"
    missing:
      use_convention: treat_as_na
    harmonize:
      by_wave:
        w5:
          method: recode
          mapping:
            0: 0
            1: 1
            2: 1
            3: 1
        w8:
          method: recode
          mapping:
            0: 0
            1: 1
            2: 1
            3: 1
    qc:
      valid_range: [0, 1]

  - id: polint
    concept: political_participation
    description: "Interest in public affairs (0=not at all ... 3=very interested)"
    type: ordinal
    note: >
      Control in Tambe & Monyake (2023). Fielded in R5 (Q14) and R6 (Q13)
      only; ABSENT from R7-R9 (verified against raw variable labels
      2026-07-03) — unavailable for the R8 extension model; drop from that
      specification and note the deviation from the original control set.
    source:
      w1: null
      w2: null
      w3: null
      w4: null
      w5: Q14
      w6: Q13
      w7: null
      w8: null
      w9: null
    scale:
      min: 0
      max: 3
      labels:
        0: "Not at all interested"
        1: "Not very interested"
        2: "Somewhat interested"
        3: "Very interested"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
        note: "0-3 identical wording/coding in R5 and R6."
    qc:
      valid_range: [0, 3]

  - id: region_admin1
    concept: geography
    description: "Region/province (admin1) — country-specific numeric codes with named labels"
    type: nominal
    note: >
      Raw REGION passthrough (e.g. Benin 100-111, Botswana 140-164). Codes
      are country-specific and NOT comparable across countries; join on
      (country, region_admin1). Needed as the level-2 grouping candidate for
      the T&M extension. Kept for the three design rounds; other rounds can
      be added on request.
    source:
      w1: null
      w2: null
      w3: null
      w4: null
      w5: REGION
      w6: null
      w7: null
      w8: REGION
      w9: REGION
    missing:
      use_convention: dk_refused_only
    harmonize:
      default:
        method: identity
        note: "Country-specific admin1 codes; no cross-country scale."
