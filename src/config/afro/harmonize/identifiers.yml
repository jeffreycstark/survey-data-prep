# Afrobarometer — respondent/interview identifiers.
# IDs are DATA for raw-traceability and merges, never the uniqueness
# backbone (that is row_uid). ID variables carry NO missing codes — the
# generalized lesson of the 2026-08-09 ABS idnumber bug.
# Sources + key verdicts label/measure-verified 2026-08-10; see
# docs/superpowers/specs/2026-08-10-row-identifiers-design.md.
schema_version: 1

missing_conventions:
  no_missing_codes:
    codes: []
    description: "Serial IDs have no refused/DK values; every code is real."

variables:
  - id: respno
    concept: identifiers
    description: "Respondent number (raw respno/RESPNO; round+country+respno unique except R8's 24 release-file duplicates — see key_uniqueness_exemptions.yml). w1 null: merged R1 carries no respno. w10 source is lowercase because the R10 per-country stacker lowercases names."
    type: nominal
    source:
      w1: null
      w2: respno
      w3: respno
      w4: RESPNO
      w5: RESPNO
      w6: RESPNO
      w7: RESPNO
      w8: RESPNO
      w9: RESPNO
      w10: respno
    missing:
      use_convention: no_missing_codes
    harmonize:
      default:
        method: identity
    qc:
      skip_range_check: true
      skip_unmapped_check: true
