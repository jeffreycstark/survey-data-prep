# Known native-key violations that are KEPT AND DOCUMENTED, never dropped
# (Jeff's policy call, 2026-08-10). Each entry allows AT MOST `max_dup_rows`
# surplus rows (rows beyond one per key value) for the given survey — a
# larger violation than declared here is an ERROR, so growth of a known
# anomaly cannot hide behind its exemption.
#
# All six anomalies are present in the surveys' own release files; verified
# against raw 2026-08-09/10.

schema_version: 1

exemptions:
  - survey: abs
    max_dup_rows: 2
    reason: >
      Hong Kong W5 duplicate pairs 704273201 (identical in all 308 columns)
      and 704273901 (identical in 307 of 308, differing only in survey
      weight). In ABS's release file, not our merge. Kept per Jeff
      2026-08-10; two people giving byte-identical answers to 300+
      questions is not credible, but dropping rows changes samples and
      weight totals.
      RE-VERIFIED INDEPENDENTLY 2026-08-15 against the raw release
      (data/abs/raw/wave5/20230505_W5_merge_15.sav), because the original
      write-up's "it's upstream" claim had never been checked a second time.
      It holds, and three further facts came out of it. (a) Each pair sits in
      ADJACENT file rows — 1453/1454 and 1459/1460 — which is the signature of
      a row copied during file assembly, not of two respondents coincidentally
      agreeing on 300+ items. (b) These are the ONLY duplicated
      country+idnumber keys anywhere in raw W5, and raw W5 has no NA
      idnumbers. (c) Hong Kong W5 is exactly 1200 rows carrying 1198 distinct
      idnumbers, and its weights sum to exactly 1200.0000 — i.e. ABS
      normalized the weights WITH the duplicate rows inside the denominator.
      That is the concrete cost of the "drop" option: deleting the two copies
      leaves n=1198 against sum(w)=1197.7253, breaking the sum(w)==n
      convention every other country in the wave follows, so a drop would have
      to re-scale HK weights by 1198/1197.7253 (a 0.02% adjustment). Keeping
      them costs nothing as long as nothing keys on country+wave+idnumber,
      which row_uid now makes unnecessary.
  - survey: afro
    max_dup_rows: 24
    reason: >
      R8 merged release carries 24 duplicated round+country+respno rows.
      Release-file artifact; kept and documented.
  - survey: kipa_corruption
    max_dup_rows: 75
    reason: >
      The 2019 release file (handle 24742) duplicates 74 id values, and the
      cumulative 2004-2007 release carries 1 duplicate id within its 2006
      block (raw-verified 2026-08-10). Release-file artifacts; kept and
      documented.
  - survey: arab-barometer
    max_dup_rows: 2402
    reason: >
      W5 has 3 surplus country+id duplicate rows, and W8 ships a 2,400-row
      block with ID=0 — IDs never assigned in the release; zeros kept
      verbatim (an ID variable has no missing codes, and inventing IDs
      would be fabrication). The zero block collapses to 2,399 surplus
      rows; + 3 from W5 = 2,402.
  - survey: lbs
    max_dup_rows: 2920
    reason: >
      numentre is NOT a within-country respondent key in seven years:
      1997, 1998, 2000, 2001, 2002, 2006 and 2010 carry 2,920 surplus
      wave+country+numentre rows in total (1998 alone: 2,841, verified in
      the raw release — the questionnaire numbering repeats across
      subsamples). Discovered by the post-rebuild exact-match verification
      2026-08-10; the initial evidence sample (2003, 2024) hit only clean
      years. numentre stays a traceability column; treat it as a key only
      in the fifteen clean years.
  - survey: wvs
    max_dup_rows: 0
    reason: >
      Placeholder for visibility: w3's raw S007 carries 4,005 within-country
      duplicates, which is why w3 is deliberately NOT mapped in
      identifiers.yml (see that spec). No exemption is consumed because the
      dup-ridden wave never enters the harmonized column; if s007 ever gets
      mapped for w3, this check must be revisited.
