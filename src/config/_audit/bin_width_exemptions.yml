    survey: abs
    reason: >
      W5 pole-merge seam (6,5->4 and 2,1->1): W5 top/bottom bins hold two
      source categories vs one elsewhere. Fixed 2026-08-08 by the native
      companion trust_president_w5_6pt; use it for W5 levels, the 4-pt for
