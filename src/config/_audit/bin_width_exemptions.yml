# Bin-width parity exemptions
# -----------------------------------------------------------------------------
# The bin-width parity check (src/r/audit/04_bin_width_parity.R, Check D)
# flags variables whose waves pack DIFFERENT numbers of source categories
# into the same harmonized bin — the ABS W5 6->4pt trust pole-merge class,
# which mechanically inflates the collapsing wave's top-box shares and means
# even though every direction check passes.
#
# Exemption is a deliberate editorial act: a variable listed here has a
# KNOWN, DOCUMENTED cross-wave binning seam that we accept (e.g. the seam is
# described in the survey docs page and flagged in the verbatim dictionary
# notes). Prefer FIXING the seam (native-scale companion columns, or a
# uniform mapping) over exempting it. Do NOT exempt to silence a finding you
# have not triaged.
#
# The 13 ABS W5 trust items are deliberately NOT exempted (decision
# 2026-07-22): they stay visible, like the ABS label-recon backlog, until
# the seam itself is fixed/documented.
#
# Form: exempt_variables, each entry {variable, reason, survey (optional —
# omit to match the id in every survey)}.

schema_version: 1

exempt_variables:
  # -------------------------------------------------------------------------
  # The three below are seams CREATED DELIBERATELY on 2026-07-31 to close
  # out-of-range findings (Check E). In each case the wave carried an extra
  # source code that valid_range was silently deleting; folding it into an
  # existing bin preserves the respondents at the price of one wave's bin
  # holding two source categories. That trade was chosen consciously — the
  # alternative was to keep discarding real respondents — so the seam is
  # recorded here rather than left to read as an unexamined failure.
  # -------------------------------------------------------------------------
  - variable: hh_generations
    survey: abs
    reason: >
      W6 Japan alone offers `10 = "Single"` (107 cases), deleted outright
      until 2026-07-31. Folded into 1 = "One generation", so W6's bin 1 holds
      {1, 10} against {1} elsewhere. A single-person household IS one
      generation, and respondents elsewhere who live alone simply answer 1 —
      the seam is in the Japanese questionnaire, and this mapping removes its
      effect rather than introducing one. See the note on the variable in
      src/config/abs/harmonize/demographics.yml.
  - variable: bribe_police
    survey: afro
    reason: >
      R2 Mozambique alone offers a 5th frequency point `4 = "Always"` (30
      cases), deleted outright until 2026-07-31. Folded into 3 = "Often", so
      R2's top bin holds {3, 4} against {3} elsewhere. This one IS a genuine
      loss of resolution, accepted because the alternative biases a
      bribe-FREQUENCY measure downward for Mozambique R2 by dropping exactly
      its most frequent payers. Anyone comparing R2 Mozambique top-box against
      other rounds should know its top box is wider. Revisit if a paper leans
      on that cell.
  - variable: urban_rural
    survey: afro
    reason: >
      R6 (88 cases) and R7 (40) carry `460 = "Peri-Urban"` alongside
      `3 = "Semi-Urban"`, deleted outright until 2026-07-31. Folded into 3, so
      those rounds' bin 3 holds {3, 460}. The variable is `type: nominal`, for
      which "bin width" carries no ordinal meaning, and the two labels name
      the same concept — no round offers them as distinct substantive options.
      Continues the 2026-05-14 decision on this same variable to preserve the
      semi-urban category rather than NA-coerce it.

  - variable: education_level
    survey: afro
    reason: >
      Documented condensation: R1/R5-R9 field the 0-3 condensed ladder
      natively; R2-R4 field only the 0-9 detailed ladder, collapsed by
      recode_afro_educ_detailed. Noted in the variable's spec
      (src/config/afro/harmonize/demographics.yml) and in the CLAUDE.md
      education gotcha; cross-survey comparisons use education_5cat from
      src/r/utils/education.R, not this column.
  - variable: education_level
    survey: wvs
    reason: >
      Documented widening 3->6 levels on 2026-07-09; W7 fields a finer
      native ladder collapsed via explicit recode mapping. Noted in
      src/config/wvs/harmonize/demographics.yml. Cross-survey comparisons
      use education_5cat.
  - variable: crime_victim
    survey: lbs
    reason: >
      Documented instrument change: 2024 P50ST.A is a native 1=Yes/2=No
      binary, while 2015-2023 build the binary from multi-category items
      via combine_lbs_victim_any. Noted in
      src/config/lbs/harmonize/security_voting.yml (paper 29 work).
  - variable: uni_view
    survey: ipus
    reason: >
      Documented 2019 questionnaire restructure: codes 1+2 ("at any cost" +
      "ASAP") deliberately collapsed to harmonized 1 for w2019-w2024,
      treating the split as granularity within one conceptual category.
      Decision recorded in JEFF_MUST_INVESTIGATE.md ("IPUS uni_view —
      Frankenstein scale", RESOLVED 2026-05-12).
