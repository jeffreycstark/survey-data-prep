  - id: dem_army_rule
    concept: democratic_support
    description: "Having the army rule (1-4, higher = MORE approval)"
    type: ordinal
    note: "Raw 1=Very good -> 4=Very bad; reversed so higher = more pro-army-rule."
    scale:
      min: 1
      max: 4
      labels:
        1: "Very bad"
        2: "Fairly bad"
        3: "Fairly good"
        4: "Very good"
    source:
