  - id: nk_interest
    concept: north_korea
    description: "Interest in North Korea (1-4, higher=more interested)"
    type: ordinal
    note: "12 waves (missing 2014). Raw nk01: 1=not interested at all → 4=very interested. Identity. Tracks salience of NK as a public-attention object."
    source:
      w2015:  nk01
      w2016:  nk01
      w2017:  nk01
      w2018:  nk01
      w2019a: nk01
      w2019b: nk01
      w2020a: nk01
      w2020b: nk01
      w2021a: nk01
      w2021b: nk01
      w2022:  nk01
      w2023:  nk01
    scale: {min: 1, max: 4, labels: {1: "Not interested at all", 4: "Very interested"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 4]
      skip_unmapped_check: true

