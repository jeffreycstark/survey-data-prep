# KINU North Korea — perception of and engagement with NK
#
# Twenty-two variables across five sub-batteries:
#
#   (1) Interest / engagement                  — nk01           (12 waves)
#   (2) NK image / warmth (4-stance battery)   — nk0401-nk0404  (13 waves each, 0-10 thermometer)
#   (3) Regime trust & dialogue                — nk05, nk06     (11 waves)
#   (4) NK pursuit-of-unification frame        — nk0701, nk0702 (10-11 waves)
#   (5) Nuke perception (denuclearization,
#       war probability, salience)             — nk11, nk14,
#                                                nk1201-nk1203  (10-11 waves)
#   (6) NK refugee/defector perception         — nk0801-nk0807,
#                                                nk20            (9 waves)
#
# DIRECTIONALITY (higher = more intensity).
# All identity-recoded EXCEPT nk20 (defector contact frequency: raw 1=daily
# → 5=never, reversed so higher = more contact).
#
# DROPPED FROM THIS SPEC:
#   - nk02, nk0301, nk0302: nominal info-source / 1st-2nd-rank items (categorical handling)
#   - nk0703-nk0705: insufficient coverage / item labels not verified in survey pass
#   - nk21a-d: country-warmth thermometers (-5 to +5) — moved to security_threat.yml
#   - nk1701, nk1702: SK/US nuclear-armament support (4pt) — moved to security_threat.yml
#   - nk1804: NK-nukes-impossible-to-stop (5pt) — moved to security_threat.yml
#
# KGSS PARALLELS:
#   nk_interest (nk01) ~ no direct KGSS analogue
#   nk_warmth_aid/cooperate ~ contrasts with KGSS pol_northkorea_view (1-4 favorability — different scale, same construct family)
#   defector-perception items ~ KGSS pol_nk_defectors (very limited; 5 waves 2011-2016)
#
# MISSING CONVENTIONS:
#   9 = n/a in 1-5 / 1-4 / 1-3 scales
#   99 = n/a in 0-10 / 0-100 thermometers

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [9, 99]
    description: "KINU NK: 9=n/a in 1-X scales; 99=n/a in 0-10 thermometers"

variables:

  # ─────────────────────────────────────────────────────────────────────────
