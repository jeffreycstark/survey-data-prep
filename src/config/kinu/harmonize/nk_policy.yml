      skip_unmapped_check: true

  - id: nkpol_defector_support
    concept: nk_policy
    description: "Support for strengthened SK assistance to NK defectors (0-10, higher=stronger support)"
    type: ordinal
    note: "8 waves. Raw pc0117: 'NK policy- strengthen support for defectors.' Identity. Pairs analytically with the defector-perception items in north_korea.yml — policy preference vs perception."
    source:
