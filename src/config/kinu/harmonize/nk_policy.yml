  # ─────────────────────────────────────────────────────────────────────────
  # (2) Containment / sanctions
  # ─────────────────────────────────────────────────────────────────────────

  - id: nkpol_sanctions
    concept: nk_policy
    description: "Support for international cooperation to enforce sanctions on NK (0-10, higher=stronger support)"
    type: ordinal
    note: "11 waves (missing 2014 and 2021b). Raw pc0103: 'The international cooperation should ensure that sanctions against North Korea are implemented.' Identity. Often anti-correlated with engagement items at the respondent level — captures the sanctions-pressure pole of NK policy."
    source:
