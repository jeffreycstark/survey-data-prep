  # ─────────────────────────────────────────────────────────────────────────
  # (3) Diplomatic posture & policy process
  # ─────────────────────────────────────────────────────────────────────────

  - id: nkpol_us_china_posture
    concept: nk_policy
    description: "Preferred SK diplomatic posture between US and China (categorical: 1=US-aligned, 2=balanced, 3=China-aligned, 4=independent)"
    type: categorical
    note: "9 waves (per inventory). Raw pc05: 1=strengthen alliance with US over China, 2=balanced US-China diplomacy, 3=strengthen relationship with China over US, 4=independent diplomacy regardless. Nominal — not ordinal. Useful for analyses of Korean foreign-policy realignment in light of US-China competition."
    source:
      w2016:  pc05
      w2017:  pc05
      w2018:  pc05
      w2019a: pc05
      w2019b: pc05
      w2020a: pc05
      w2020b: pc05
      w2021a: pc05
      w2022:  pc05
    scale:
      min: 1
      max: 4
      labels:
        1: "Strengthen US alliance over China"
        2: "Balanced US-China diplomacy"
        3: "Strengthen China relationship over US"
        4: "Independent diplomacy regardless"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 4]
      skip_unmapped_check: true

  - id: nkpol_public_opinion_reflected
    concept: nk_policy
    description: "Sense that public opinion is reflected in SK unification policy (1-4, reversed so higher=more reflected)"
    type: ordinal
    note: "9 waves. Raw pc06: 1=reflected very much, 2=somewhat, 3=not reflected somewhat, 4=not reflected at all. REVERSED so higher = stronger sense of policy responsiveness on unification matters."
    source:
