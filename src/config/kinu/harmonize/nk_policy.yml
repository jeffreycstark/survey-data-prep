    description: "Support for resuming the Kaesong Industrial Complex (0-10, higher=stronger support)"
    type: ordinal
    note: "10 waves. Raw pc0112: 'NK policy- resuming Gaesung Industrial Complex.' Identity. Kaesong was closed in Feb 2016 by SK as a sanction; this item asks whether to reopen."
    source:
