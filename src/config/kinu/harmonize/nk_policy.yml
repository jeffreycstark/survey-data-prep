# KINU NK Policy — preferences for South Korean policy toward North Korea
#
# Ten variables across three sub-batteries:
#
#   (1) Engagement-policy support (0-10 oppose-support) — pc0101, pc0102,
#       pc0104, pc0107, pc0111, pc0112, pc0117                  (8-12 waves)
#   (2) Containment / sanctions support (0-10)                  — pc0103 (11 waves)
#   (3) Diplomatic posture & policy process                     — pc05, pc06 (9 waves)
#
# DIRECTIONALITY (higher = more intensity).
# All 0-10 items: identity (0=oppose very strongly → 10=support very strongly).
# pc05: nominal categorical (US-only / balanced / China-only / independent).
# pc06: REVERSED 1-4 scale (raw 1=reflected very much → 4=not at all; reversed
# so higher = stronger sense that public opinion is reflected in unification
# policy).
#
# DROPPED FROM THIS SPEC:
#   - pc0105 (propaganda): 7-wave coverage; included only because of substantive
#     interest in hawk-policy items but coverage is borderline. Add later.
#   - pc0106 (security ensure): 4 waves only.
#   - pc0108 (stop humanitarian aid): 3 waves only — overlap with pc0107 inverse.
#   - pc0109 (Kaesong closure was right): 3 waves only.
#   - pc0110 (THAAD): 3 waves only.
#   - pc0125-pc0131 (various recent items): 5-7 waves; defer.
#   - pc0118-pc0121, pc0134: 4 waves only with 1-4 scale (Likert format change).
#
# KGSS COMPARISON:
#   No direct KGSS analogue — KINU is the better source for NK-policy
#   preference series.
#
# MISSING CONVENTIONS:
#   9 = n/a in 1-4 / 1-7 scales
#   99 = n/a in 0-10 oppose-support scales

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [9, 99]
    description: "KINU NK policy: 9=n/a in 1-X scales; 99=n/a in 0-10 oppose-support"

variables:

  # ─────────────────────────────────────────────────────────────────────────
  # (1) Engagement-policy support
  # ─────────────────────────────────────────────────────────────────────────

  - id: nkpol_econ_exchange
    concept: nk_policy
    description: "Support for continuing inter-Korean economic exchange and cooperation (0-10, higher=stronger support)"
    type: ordinal
    note: "11 waves (missing 2014 and 2021b). Raw pc0101: 'Two Koreas should continue economic exchanges and cooperation even in a state of political and military confrontation.' 0=oppose very strongly → 10=support very strongly. Identity. Pro-engagement stance even under tension — measures unconditional engagement preference."
    source:
      w2015:  pc0101
      w2016:  pc0101
      w2017:  pc0101
      w2018:  pc0101
      w2019a: pc0101
      w2019b: pc0101
      w2020a: pc0101
      w2020b: pc0101
      w2021a: pc0101
      w2022:  pc0101
      w2023:  pc0101
    scale: {min: 0, max: 10, labels: {0: "Oppose very strongly", 10: "Support very strongly"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [0, 10]
      skip_unmapped_check: true

  - id: nkpol_use_nk_resources
    concept: nk_policy
    description: "Support for using NK labor and natural resources to grow the SK economy (0-10, higher=stronger support)"
    type: ordinal
    note: "8 waves (missing 2014, 2016, 2017, 2021b, 2022). Raw pc0102: 'Using North Korea's labor force and natural resources will greatly help South Korea's economic growth.' Identity. Frames NK as economic complement; high support indicates utilitarian-engagement view."
    source:
      w2015:  pc0102
      w2018:  pc0102
      w2019a: pc0102
      w2019b: pc0102
      w2020a: pc0102
      w2020b: pc0102
      w2021a: pc0102
      w2023:  pc0102
    scale: {min: 0, max: 10, labels: {0: "Oppose very strongly", 10: "Support very strongly"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [0, 10]
      skip_unmapped_check: true

  - id: nkpol_sports_culture
    concept: nk_policy
    description: "Support for expanding sports/cultural/human exchanges with NK (0-10, higher=stronger support)"
    type: ordinal
    note: "12 waves (missing 2014). Raw pc0104: 'We need to expand sports, culture and human exchanges with North Korea.' Identity. Lowest-cost engagement form — typically the most-supported item in the engagement battery."
    source:
      w2015:  pc0104
      w2016:  pc0104
      w2017:  pc0104
      w2018:  pc0104
      w2019a: pc0104
      w2019b: pc0104
      w2020a: pc0104
      w2020b: pc0104
      w2021a: pc0104
      w2021b: pc0104
      w2022:  pc0104
      w2023:  pc0104
    scale: {min: 0, max: 10, labels: {0: "Oppose very strongly", 10: "Support very strongly"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [0, 10]
      skip_unmapped_check: true

  - id: nkpol_humanitarian_aid
    concept: nk_policy
    description: "Support for continuing humanitarian aid to NK (0-10, higher=stronger support)"
    type: ordinal
    note: "11 waves (missing 2014, 2015). Raw pc0107: 'We must continue the humanitarian aid to North Korea.' Identity. Distinct from nkpol_econ_exchange — humanitarian frame; pairs analytically with the (deferred) pc0108 'unless NK gives up nukes, stop aid' item."
