        method: identity
    qc:
      valid_range: [0, 10]
      skip_unmapped_check: true

  - id: nkpol_geumgang_tourism
    concept: nk_policy
    description: "Support for resuming tourism to Mt. Geumgang (0-10, higher=stronger support)"
    type: ordinal
    note: "10 waves (per inventory). Raw pc0111: 'NK policy- resume tourism to Mt. Geumgang.' Identity. Mt. Geumgang tourism was suspended in 2008 after a fatal incident; this item asks whether it should resume."
    source:
