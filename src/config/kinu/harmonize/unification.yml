# KINU Unification — core unification attitudes battery
#
# Seventeen variables across four sub-batteries:
#
#   (1) Overall necessity                         — uni01            (13 waves)
#   (2) Agree-disagree statements (5pt Likert)    — uni0201–uni0214  (8-11 waves each, subset selected)
#   (3) Perceived benefits of unification         — uni0301–uni0303  (12-13 waves)
#   (4) Post-unification social-conflict forecasts — uni0601–uni0604  (11 waves each)
#
# DIRECTIONALITY (project-wide rule: higher numeric = more intensity).
# Almost every KINU item already follows this convention, so all 17 variables
# below are IDENTITY recoded:
#   - uni_necessity:          1=strongly unnecessary   → 4=strongly necessary
#   - uni_arg_*:              1=strongly disagree       → 5=strongly agree
#   - uni_benefit_*:          1=no benefit at all       → 4=very much beneficial
#   - uni_post_*_conflict:    1=will get much better    → 5=will get much worse
#
# For agreement-statement items the *substantive* direction (pro- vs anti-
# unification) varies item-by-item, but the *intensity* direction is always
# "higher = stronger agreement with the proposition as stated". Each item's
# note documents whether the proposition reads as pro- or anti-unification.
#
# DROPPED FROM THIS SPEC (single-wave or insufficient coverage):
#   - uni0202 (3w), uni0205 (2w), uni0207 (5w), uni0208 (4w), uni0210 (1w)
#   - uni0215 confederation item (6w, 2020+ only — add later if needed)
#   - uni0216–uni0220 (single wave 2022 only — too thin for longitudinal use)
#   - uni04 / uni04_open / uni05 / uni07 / uni08 / uni09 / uni10–uni13
#     (categorical/nominal items — belong in a separate categorical spec)
#
# MISSING CONVENTIONS:
#   9  = n/a within 1-point-something scales (1–4, 1–5, 1–7)
#   99 = n/a within 0–10 / 0–100 scales (none of the items below use this,
#        but listed for consistency with other KINU specs)

missing_conventions:
  treat_as_na:
    codes: [9, 99]
    description: "KINU: 9=n/a in 1–4/1–5/1–7 scales; 99=n/a in 0–10/0–100 scales"

variables:

  # ─────────────────────────────────────────────────────────────────────────
  # (1) Overall necessity of unification
  # ─────────────────────────────────────────────────────────────────────────

  - id: uni_necessity
    concept: unification
    description: "Perceived necessity of Korean unification (1-4, higher=stronger belief unification is necessary)"
    type: ordinal
    note: "13 waves (all). Raw uni01: 1=strongly unnecessary → 4=strongly necessary. Identity recoding (already in user-rule direction). Comparable in DIRECTION (but NOT in scaling) to KGSS pol_unification — KGSS uses the opposite raw direction (1=most necessary → 4=oppose) and would need reversal to compare. Trajectory peaks at 2018 (2.94) post-Pyongyang summit and declines steadily through 2023 (2.57)."
    source:
      w2014:  uni01
      w2015:  uni01
      w2016:  uni01
      w2017:  uni01
      w2018:  uni01
      w2019a: uni01
      w2019b: uni01
      w2020a: uni01
      w2020b: uni01
      w2021a: uni01
      w2021b: uni01
      w2022:  uni01
      w2023:  uni01
    scale: {min: 1, max: 4, labels: {1: "Strongly unnecessary", 4: "Strongly necessary"}}
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 4]
      skip_unmapped_check: true

  # ─────────────────────────────────────────────────────────────────────────
