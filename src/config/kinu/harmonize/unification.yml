      w2017:  uni0201
      w2018:  uni0201
      w2019a: uni0201
      w2019b: uni0201
      w2020a: uni0201
      w2020b: uni0201
      w2021a: uni0201
      w2021b: uni0201
      w2022:  uni0201
      w2023:  uni0201
    scale: {min: 1, max: 5, labels: {1: "Strongly disagree", 5: "Strongly agree"}}
