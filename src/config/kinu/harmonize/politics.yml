      w2014:  pt2001
      w2015:  pt2001
      w2016:  pt2001
      w2017:  pt2001
      w2018:  pt2001
      w2019a: pt2001
      w2019b: pt2001
      w2020a: pt2001
      w2020b: pt2001
      w2021a: pt2001
      w2021b: pt2001
      w2022:  pt2001
      w2023:  pt2001
    scale: {min: 1, max: 5, labels: {1: "Strongly disagree", 5: "Strongly agree"}}
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 5]
      treat_as_na: [9]
