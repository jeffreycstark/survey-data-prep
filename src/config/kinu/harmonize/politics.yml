# KINU Politics — political evaluations, ideology, RWA, party warmth
#
# Fifteen variables across four sub-batteries:
#
#   (1) Right-Wing Authoritarianism (RWA) battery   — pt2001-pt2007 (13 waves)
#   (2) Democracy / administration evaluation       — pt05, pt07, pt08, pt04 (9-12 waves)
#   (3) Economic evaluation (year-on-year change)   — pt1901, pt1902 (10 waves)
#   (4) Ideology + party warmth                     — pt1801, pt1303 (9-12 waves)
#
# DIRECTIONALITY: all identity-recoded.
#   - RWA items: 1=strongly disagree → 5=strongly agree on pro-authoritarian
#     statements (each item is worded so high agreement = more authoritarian).
#     The full battery sums to a pro-authoritarianism index.
#   - eval_democracy: 0=not democratic at all → 10=very democratic.
#   - eval_admin / eval_admin_unif_nk: 1=very badly → 4=very well.
#   - eval_econ_satisfaction: 1=very dissatisfied → 4=very satisfied.
#   - econ_*_year_change: 1=much worse than a year ago → 5=much better.
#   - ideology_lc_self: 0=very liberal → 10=very conservative.
#   - party_warmth_justice: 0=very negative → 100=very positive (999=n/a).
#
# DROPPED FROM THIS SPEC:
#   - pt1301, pt1302 (PPP/Dem Party warmth thermometers): 6 waves — sparse.
#   - pt02 (SK direction): 8 waves but 2016-2017 only; not analytically rich.
#   - pt1802, pt1803, pt1806 (party-perceived ideology): 8 waves, useful but
#     defer; correlated heavily with self-ID.
#   - pt1205, pt1206 (recent party-support items): 5 waves only.
#   - pt1601 (2017 vote intention): 7 waves but candidate-specific; nominal.
#   - pt21a-i20 (issue-ownership battery): 5 waves only.
#   - pt1809 (the lone "정치"-typo item): excluded — only 1 wave coverage.
#
# KGSS PARALLELS:
#   ideology_lc_self ~ KGSS pol_ideology (1-5 vs KINU 0-10; same direction)
#   eval_admin ~ KGSS pol_govt_eval (KGSS pre-2025 only)
#   eval_econ_satisfaction ~ KGSS pol_econ_sat (1-5 reversed; KINU 1-4 identity — direction matches)
#
# MISSING CONVENTIONS:
#   9 = n/a in 1-X scales (treated as NA per-variable)
#   99 = n/a in 0-10 scales (global)
#   999 = n/a in 0-100 thermometer (global; KINU-specific code for thermometers)

missing_conventions:
  treat_as_na:
    codes: [99, 999]
    description: "KINU politics: 99=n/a in 0-10/1-9; 999=n/a in 0-100 thermometers; per-variable 9=n/a for 1-X scales"

