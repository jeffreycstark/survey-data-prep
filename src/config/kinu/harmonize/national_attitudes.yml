      w2015:  at01
      w2016:  at01
      w2017:  at01
      w2018:  at01
      w2019a: at01
      w2019b: at01
      w2020a: at01
      w2020b: at01
      w2021a: at01
      w2021b: at01
      w2022:  at01
      w2023:  at01
    scale: {min: 1, max: 4, labels: {1: "Not proud at all", 4: "Very proud"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
