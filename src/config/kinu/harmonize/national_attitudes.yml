# KINU National Attitudes — pride, trust, patriotism, multiculturalism, system justification
#
# Twenty-five variables across five sub-batteries:
#
#   (1) National pride (1-4 identity)              — at01 + at0201-at0210  (12-13 waves)
#   (2) Trust (general + 6 institutions, 0-10)     — at06, at0701-at0706    (9-11 waves)
#   (3) Patriotism (1-5 agreement)                 — at0303, at0304         (11 waves)
#   (4) Multiculturalism (1-5 favor/oppose)        — at1701, at1702, at1703 (10 waves)
#   (5) System justification (1-9 agreement)       — at2801, at2803         (8 waves)
#
# DIRECTIONALITY: all identity-recoded (higher = more intensity of the construct
# as labelled in the description). For "system justification" items, high values
# indicate stronger system-justifying belief.
#
# DROPPED FROM THIS SPEC (substantive value but defer for scope):
#   - at0306-at0308 (patriotism: anthem, constructive criticism, work hard) —
#     8-wave coverage; substantively secondary to flag/identity items.
#   - at0406-at0409 (national attachment battery: bad-about-KR, fate-tied,
#     superiority, patriots) — 8-9 waves but require per-item reversal logic
#     and substantive interpretation; add later as a focused attachment YAML.
#   - at1201-at1206 (Inglehart post-materialism, 1-4 categorical 1st/2nd
#     choice) — nominal handling; needs categorical-pair construction.
#   - at19a-at19h (SDO 1-7 battery) — own sub-literature; defer.
#   - at2802, at2804 (system justification: radical-restructure, fair-opportunity)
#     — at2802 has direction-flip ambiguity (high=wants change=anti-system?);
#     handle in a follow-up to avoid confusion.
#
# KGSS PARALLELS:
#   trust_general (at06) ~ KGSS trust_reliable (0-10, both identity)
#   trust_president, trust_assembly, trust_courts, trust_parties, trust_media
#       ~ KGSS conf_bluehouse, conf_legislature, conf_judiciary,
#           ?, conf_press (KGSS uses 1-3 scale; KINU uses 0-10 — different but comparable in direction)
#   natid_pride_* battery ~ KGSS pride_* battery (KGSS uses 1-4 reversed)
#
# MISSING CONVENTIONS:
#   9 = n/a in 1-X scales (and special: 9 ALSO appears as a valid mid-range
#       value in at2801-at2804 1-9 scales — handle below per-variable)
#   99 = n/a in 0-10 confidence scales

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [99]
    description: "KINU national attitudes: 99=n/a in 0-10/1-9 scales. NOTE 9 NOT in global treat_as_na because it is a valid response value in the 1-9 system-justification items; per-variable missing handling for 1-5 items."

