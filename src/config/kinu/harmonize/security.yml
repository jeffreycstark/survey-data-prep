# KINU Security — threat perception, alliance, US-China posture, country warmth
#
# Sixteen variables across four sub-batteries. KINU's security group has 258
# variables in the codebook but only ~22 with 5+ wave coverage (security items
# rotate frequently). This spec captures the strongest cross-wave items.
#
# Sub-batteries:
#
#   (1) Threat perception                       — se0201, nk1804         (9 waves each)
#   (2) US alliance / nuclear posture           — se0401, se0403, se0404,
#                                                  nk1701, nk1702         (7-8 waves)
#   (3) US-vs-China importance                  — se0501, se0502          (7 waves)
#   (4) Country & leader warmth                 — nk21a-d, se0804/06/07   (5-8 waves)
#
# DIRECTIONALITY (higher = more intensity).
# Most items are identity-recoded. Two notable cases:
#   - nk21a-nk21d: bipolar -5 to +5 thermometers (-5=strongly dislike, +5=strongly like).
#     Identity preserved; "higher = more positive" reads as country-warmth intensity.
#   - se0501, se0502: bipolar 1-5 (1=US much more important, 5=China much more important).
#     Identity preserved; "higher = more pro-China" reads as China-importance intensity.
#
# DROPPED FROM THIS SPEC (insufficient coverage / categorical):
#   - All 1-2-wave security items (the bulk of the 258-var group)
#   - se0509, se0509b, se0533, se0534 (5w but with mixed/irregular scales)
#   - se0407 (5w, "other" scale type)
#   - se0801, se0802 (Global Leadership US/China, 5w each — could add later)
#   - se0616, se0620-se0624 (Korea-Japan items, 5w; defer to dedicated Japan-relations spec)
#
# KGSS PARALLELS:
#   No direct KGSS analogues — KGSS does not field comparable security/alliance items.
#   country_warmth_us/china/japan ~ KAMOS leader thermometer items (different scale)
#
# MISSING CONVENTIONS:
#   9 = n/a in 1-X scales (per-variable for safety)
#   99 = n/a in some 0-100 thermometers (some KINU items use 99 instead of 999)
#   999 = n/a in 0-100 leader-warmth thermometers (se0804/06/07)

missing_conventions:
  treat_as_na:
    codes: [99, 999]
    description: "KINU security: 99/999=n/a in 0-100 thermometers; per-variable 9=n/a for 1-X scales"

variables:

  # ─────────────────────────────────────────────────────────────────────────
  # (1) Threat perception
  # ─────────────────────────────────────────────────────────────────────────

  - id: war_possibility_5pt
    concept: security
    description: "Perceived possibility of war on the Korean peninsula (1-5, higher=higher perceived war risk)"
    type: ordinal
    note: "9 waves combining two raw variables. Raw se02 (2016 only) and se0201 (2019a onward); same construct ('war possibility'), same 1-5 scale (1=very low → 5=very high). Identity. Most-fielded security threat item across KINU."
    source:
      w2016:  se02
      w2019a: se0201
      w2019b: se0201
      w2020a: se0201
      w2020b: se0201
      w2021a: se0201
      w2021b: se0201
      w2022:  se0201
      w2023:  se0201
    scale: {min: 1, max: 5, labels: {1: "Very low", 5: "Very high"}}
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 5]
      treat_as_na: [9]
      skip_unmapped_check: true

  - id: nk_nukes_unstoppable
    concept: security
    description: "Agreement that it is impossible to stop NK's nuclear program (1-5, higher=more pessimistic about denuke)"
    type: ordinal
    note: "9 waves. Raw nk1804: 1=strongly disagree → 5=strongly agree. Identity. Pessimism about denuke; pairs with nk_denuke_possible (3-pt) in north_korea.yml."
    source:
      w2016:  nk1804
      w2019a: nk1804
      w2019b: nk1804
      w2020a: nk1804
      w2020b: nk1804
      w2021a: nk1804
      w2021b: nk1804
      w2022:  nk1804
      w2023:  nk1804
    scale: {min: 1, max: 5, labels: {1: "Strongly disagree", 5: "Strongly agree"}}
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 5]
      treat_as_na: [9]
      skip_unmapped_check: true

  # ─────────────────────────────────────────────────────────────────────────
