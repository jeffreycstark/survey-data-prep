    note: "13 waves. Raw religion: 1=Protestant, 2=Buddhist, 3=Roman Catholic, 4=do not belong to a denomination (i.e., none/atheist/agnostic), 5=other. Nominal. Note 4 is the largest category in modern KINU samples (Korean secularization)."
