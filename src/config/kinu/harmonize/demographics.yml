# KINU Demographics — respondent demographic attributes
#
# Fourteen variables drawn from the "demographics" + "Basic" codebook groups.
# Together these support cohort/age/gender/SES decomposition of any KINU
# substantive analysis.
#
# DIRECTIONALITY (project-wide rule: higher numeric = more intensity).
# Two items are reversed from raw to satisfy the rule:
#   - urban_rural: raw 1=metropolitan → 3=rural; reversed so higher = more urban.
#   - religious_attendance: raw 1=more than weekly → 6=never; reversed so
#     higher = more frequent attendance.
# The rest are identity-recoded:
#   - age, age_5cat, birthyear: numeric/ordinal (higher = older)
#   - cohort: nominal/ordinal (1=war generation … 7=Z generation; "intensity"
#     does not apply but ordering reflects birth-year recency from oldest)
#   - sex: binary (1=male, 2=female; matches KGSS convention)
#   - subjective_income_5pt, subjective_class_6pt: identity (higher = higher class)
#   - education: identity (higher = more education)
#   - region, religion, marital_status, employment, home_region: nominal categories
#   - income_manwon: continuous numeric (Korean 만원 units)
#
# ⚠ Direction note vs KGSS:
# KGSS subjective_class_6pt is documented as "higher = lower class"; KINU
# uses the opposite direction (higher = higher class) per the user-rule.
# When merging KGSS+KINU subjective-class data across surveys, ONE side must
# be reversed at analysis time. KINU's direction is the more intuitive one
# and matches the project rule; the KGSS direction is preserved for backward
# compatibility with existing KGSS analyses.
#
# DROPPED FROM THIS SPEC:
#   - house (8 waves, 2019+ only; could be added later for housing-wealth analysis)
#   - regular, typejob (employment-conditional, narrow coverage <500/wave)
#   - occupa_open, religion_open (open-ended duplicates of occupa/religion)
#   - dist (district code; survey-design metadata, not analytical)
#   - id, year, imonth, idate (already handled by loader / final-dataset script)
#
# MISSING CONVENTIONS:
#   9 / 99 / 9999 = n/a (varies by item; declared per-variable below
#   but listed globally for safety)

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [9, 99, 9999]
    description: "KINU: 9=n/a in 1-X scales; 99=n/a in 0-100/two-digit-code scales; 9999=n/a for continuous income"
  treat_as_na_cat99:
    codes: [99, 9999]
    description: "Categorical demographics where 9 is a valid code (region 9 = Gangwon, occupa 9 = student); .sav n/a = 99. Codebook-verified 2026-08-07."
  treat_as_na_income:
    codes: [9999]
    description: "Continuous income in manwon — only 9999 is n/a; 9 and 99 are real amounts. Added 2026-08-07."

variables:

  # ─────────────────────────────────────────────────────────────────────────
  # Age & cohort
  # ─────────────────────────────────────────────────────────────────────────

  - id: age
    concept: demographics
    description: "Respondent age in years (continuous)"
    type: continuous
    note: "13 waves (all). Continuous integer; no labels. Range typically 19+ (KINU samples adults 19+)."
    source:
      w2014:  age
      w2015:  age
      w2016:  age
      w2017:  age
      w2018:  age
      w2019a: age
      w2019b: age
      w2020a: age
      w2020b: age
      w2021a: age
      w2021b: age
      w2022:  age
      w2023:  age
    scale: {min: 18, max: 99, labels: {}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [18, 99]
      skip_unmapped_check: true

  - id: age_5cat
    concept: demographics
    description: "Age range in 5 categories (1=18-29 → 5=60+, identity, higher=older)"
    type: ordinal
    note: "13 waves. Raw age_rge: 1=18~29, 2=30-39, 3=40-49, 4=50-59, 5=over 60. Identity; matches KGSS pattern of preferring categorical age slots for cohort-style analysis. Use this when age cells need balanced sample sizes."
    source:
      w2014:  age_rge
      w2015:  age_rge
      w2016:  age_rge
      w2017:  age_rge
      w2018:  age_rge
      w2019a: age_rge
      w2019b: age_rge
      w2020a: age_rge
      w2020b: age_rge
      w2021a: age_rge
      w2021b: age_rge
      w2022:  age_rge
      w2023:  age_rge
    scale: {min: 1, max: 5, labels: {1: "18-29", 5: "60+"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 5]
      skip_unmapped_check: true

  - id: birthyear
    concept: demographics
    description: "Respondent birth year (continuous, 4-digit calendar year)"
    type: continuous
    note: "13 waves. Continuous; range 1933-2001 in this dataset. Useful for fine-grained cohort analysis where age_5cat is too coarse."
    source:
      w2014:  birthyear
      w2015:  birthyear
      w2016:  birthyear
      w2017:  birthyear
      w2018:  birthyear
      w2019a: birthyear
      w2019b: birthyear
      w2020a: birthyear
      w2020b: birthyear
      w2021a: birthyear
      w2021b: birthyear
      w2022:  birthyear
      w2023:  birthyear
    scale: {min: 1925, max: 2010, labels: {}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1925, 2010]
      skip_unmapped_check: true

  - id: cohort
    concept: demographics
    description: "Korean named-generation cohort (1=war → 7=Z generation; categorical-ordinal)"
    type: categorical
    note: "13 waves. Raw cohort: 1=war generation (pre-1953), 2=industrial, 3=386 generation (born 1960s), 4=X generation, 5=IMF generation, 6=Millennials, 7=Z generation. Treated as categorical because the named labels are the analytical unit; the numeric ordering reflects descending age but does not represent an interval scale. CODEBOOK CAVEAT 2026-05-12: the extracted codebook xlsx documents only codes 1-6, but the raw .sav file has code 7 'Z generation' labeled and observed in 290 cases across all waves (growing from 19 in 2014 to 41 in 2023). The xlsx is incomplete vs the .sav."
    source:
      w2014:  cohort
      w2015:  cohort
      w2016:  cohort
      w2017:  cohort
      w2018:  cohort
      w2019a: cohort
      w2019b: cohort
      w2020a: cohort
      w2020b: cohort
      w2021a: cohort
      w2021b: cohort
      w2022:  cohort
      w2023:  cohort
    scale:
      min: 1
      max: 7
      labels:
        1: "War generation"
        2: "Industrial generation"
        3: "386 generation"
        4: "X generation"
        5: "IMF generation"
        6: "Millennials"
        7: "Z generation"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 7]
      skip_unmapped_check: true

  # ─────────────────────────────────────────────────────────────────────────
  # Sex / region
  # ─────────────────────────────────────────────────────────────────────────

  - id: sex
    concept: demographics
    description: "Respondent sex (1=male, 2=female; binary)"
    type: categorical
    note: "13 waves. Raw gender: 1=male, 2=female. Identity. Matches KGSS sex coding so KGSS+KINU pooled analyses can use the same dummy."
    source:
      w2014:  gender
      w2015:  gender
      w2016:  gender
      w2017:  gender
      w2018:  gender
      w2019a: gender
      w2019b: gender
      w2020a: gender
      w2020b: gender
      w2021a: gender
      w2021b: gender
      w2022:  gender
      w2023:  gender
    scale: {min: 1, max: 2, labels: {1: "Male", 2: "Female"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 2]
      skip_unmapped_check: true

  - id: region
    concept: demographics
    description: "Survey region (sido/시도): 17 South Korean administrative areas + Foreign + North Korea; categorical"
    type: categorical
    note: "13 waves. Raw region uses KINU's BASIC-region 19-code scheme (distinct from the DEMOGRAPHICS-region 18-code scheme used in raw `home`/home_region). Codes: 1=Seoul, 2=Busan, 3=Daegu, 4=Incheon, 5=Gwangju, 6=Daejeon, 7=Ulsan, 8=Gyeonggi, 9=Gangwon, 10=Chungbuk, 11=Chungnam, 12=Jeonbuk, 13=Jeonnam, 14=Gyeongbuk, 15=Gyeongnam, 16=Jeju, 17=Sejong (added in 2018), 18=foreign, 19=North Korea. Code 17 (Sejong) appears starting year 5 (2018) and grows over time — empty in years 1-4. Codes 18 (foreign) and 19 (NK) are unobserved in the cumulative data (KINU samples current SK residents). Nominal — not ordinal."
    source:
      w2014:  region
      w2015:  region
      w2016:  region
      w2017:  region
      w2018:  region
      w2019a: region
      w2019b: region
      w2020a: region
      w2020b: region
      w2021a: region
      w2021b: region
      w2022:  region
      w2023:  region
    scale:
      min: 1
      max: 19
      labels:
        1:  "Seoul"
        2:  "Busan"
        3:  "Daegu"
        4:  "Incheon"
        5:  "Gwangju"
        6:  "Daejeon"
        7:  "Ulsan"
        8:  "Gyeonggi"
        9:  "Gangwon"
        10: "Chungbuk"
        11: "Chungnam"
        12: "Jeonbuk"
        13: "Jeonnam"
        14: "Gyeongbuk"
        15: "Gyeongnam"
        16: "Jeju"
        17: "Sejong"
        18: "Foreign"
        19: "North Korea"
    missing:
      # FIX 2026-08-07: treat_as_na deleted code 9 = Gangwon (every Gangwon respondent, all 13 waves)
      use_convention: treat_as_na_cat99
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 19]
      skip_unmapped_check: true

  - id: urban_rural
    concept: demographics
    description: "Urbanicity of respondent's region (1=rural, 2=medium/small city, 3=metropolitan; reversed so higher = more urban)"
    type: ordinal
    note: "13 waves. Raw reg_size: 1=metropolitan, 2=medium/small city, 3=rural. Reversed in harmonization so higher = more urban (matches the project rule that higher = more intensity, here interpreted as 'more urbanicity')."
    source:
      w2014:  reg_size
      w2015:  reg_size
      w2016:  reg_size
      w2017:  reg_size
      w2018:  reg_size
      w2019a: reg_size
      w2019b: reg_size
      w2020a: reg_size
      w2020b: reg_size
      w2021a: reg_size
      w2021b: reg_size
      w2022:  reg_size
      w2023:  reg_size
    scale: {min: 1, max: 3, labels: {1: "Rural area", 2: "Medium/small city", 3: "Metropolitan area"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_3pt
    qc:
      valid_range: [1, 3]
      skip_unmapped_check: true

  - id: home_region
    concept: demographics
    description: "Respondent's region of origin / regionalism (1-18 sido scheme — 17=North Korea, 18=Foreign)"
    type: categorical
    note: "13 waves. Raw home uses an 18-code sido scheme (NOT 19; differs from `region` which has 17=Sejong+18=foreign+19=NK). The 'home' scheme has 1-16=Korean sido, 17=North Korea, 18=foreign. Distinct concept: 'home' captures regional identity / 고향, not current residence. Useful for analyses of regional cleavages (호남/영남) where origin matters more than current residence. Narrowed from [1,19] to [1,18] on 2026-05-12 — code 19 was a stale claim, never declared in the codebook nor observed in data."
    source:
      w2014:  home
      w2015:  home
      w2016:  home
      w2017:  home
      w2018:  home
      w2019a: home
      w2019b: home
      w2020a: home
      w2020b: home
      w2021a: home
      w2021b: home
      w2022:  home
      w2023:  home
    scale:
      min: 1
      max: 19
      labels:
        1:  "Seoul"
        2:  "Busan"
        3:  "Daegu"
        4:  "Incheon"
        5:  "Gwangju"
        6:  "Daejeon"
        7:  "Ulsan"
        8:  "Gyeonggi"
        9:  "Gangwon"
        10: "Chungbuk"
        11: "Chungnam"
        12: "Jeonbuk"
        13: "Jeonnam"
        14: "Gyeongbuk"
        15: "Gyeongnam"
        16: "Jeju"
        17: "North Korea"
        18: "Foreign"
