    type: ordinal
    note: "13 waves. Raw class: 1=much lower than average → 5=much higher than average. Identity. Distinct from subjective_class_6pt (which asks about subjective social class). Better-suited for income-relative-to-population analyses."
    source:
      w2014:  class
      w2015:  class
      w2016:  class
      w2017:  class
      w2018:  class
      w2019a: class
      w2019b: class
      w2020a: class
      w2020b: class
      w2021a: class
      w2021b: class
      w2022:  class
      w2023:  class
    scale: {min: 1, max: 5, labels: {1: "Much lower than average", 5: "Much higher than average"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 5]
      skip_unmapped_check: true

  - id: subjective_class_6pt
    concept: demographics
    description: "Subjective social class (1-6, higher=higher class)"
    type: ordinal
    note: "13 waves. Raw class_fam: 1=lowest class → 6=highest class. Identity. ⚠ Direction OPPOSITE of KGSS subjective_class_6pt (which is coded higher=lower class). When merging KGSS+KINU on subjective class, reverse one side first."
    source:
      w2014:  class_fam
      w2015:  class_fam
      w2016:  class_fam
      w2017:  class_fam
      w2018:  class_fam
      w2019a: class_fam
      w2019b: class_fam
      w2020a: class_fam
      w2020b: class_fam
      w2021a: class_fam
      w2021b: class_fam
      w2022:  class_fam
      w2023:  class_fam
    scale: {min: 1, max: 6, labels: {1: "Lowest class", 6: "Highest class"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 6]
      skip_unmapped_check: true

  - id: income_manwon
    concept: demographics
    description: "Monthly household income in 만원 (Korean currency unit; continuous)"
    type: continuous
    note: "13 waves. Raw income: continuous integer in 만원 (≈ 10,000 KRW = USD 7-8). Range observed up to ~1500+ 만원 (high earners). Sentinel 9999 = n/a (treated as NA). Use logged income for regression; raw values may have right-skew. Wave-specific median should be reported in any cross-wave analysis since inflation matters."
    source:
      w2014:  income
      w2015:  income
      w2016:  income
      w2017:  income
      w2018:  income
      w2019a: income
      w2019b: income
      w2020a: income
      w2020b: income
      w2021a: income
      w2021b: income
      w2022:  income
      w2023:  income
    scale: {min: 0, max: 9998, labels: {}}
    missing:
      # FIX 2026-08-07: treat_as_na deleted real incomes of 9 and 99 manwon
      use_convention: treat_as_na_income
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [0, 9998]
      skip_unmapped_check: true

  - id: education
    concept: demographics
    description: "Educational attainment (1-8, higher=more education)"
    type: ordinal
    note: "11 waves (missing 2014 and 2015 — early waves used a different educational coding). Raw edu: 1=no education, 2=primary, 3=middle, 4=high school, 5=college (2-3yr), 6=university (4yr), 7=master's, 8=doctoral. Identity. KGSS-comparable in DIRECTION though KGSS uses a 1-3 harmonization; for fine-grained analyses use this 1-8 scale."
