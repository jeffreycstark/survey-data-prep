# WVS — respondent/interview identifiers.
# IDs are DATA for raw-traceability and merges, never the uniqueness
# backbone (that is row_uid). ID variables carry NO missing codes — the
# generalized lesson of the 2026-08-09 ABS idnumber bug.
# Sources + key verdicts label/measure-verified 2026-08-10; see
# docs/superpowers/specs/2026-08-10-row-identifiers-design.md.
schema_version: 1

missing_conventions:
  no_missing_codes:
    codes: []
    description: "Serial IDs have no refused/DK values; every code is real."

variables:
  - id: s007
    concept: identifiers
    description: "Original respondent number (raw S007). country+s007 unique in w1/w2/w5 (verified 0 dups). w3 DELIBERATELY null — its raw S007 carries 4,005 within-country duplicates and is join-hazardous; w4/w6 lack S007; w7 not mapped (D_INTERVIEW exists raw but is out of scope)."
    type: nominal
    source:
      w1: S007
      w2: S007
      w3: null
      w4: null
      w5: S007
      w6: null
      w7: null
    missing:
      use_convention: no_missing_codes
    harmonize:
      default:
        method: identity
    qc:
      skip_range_check: true
      skip_unmapped_check: true
