# WVS Democratic Support / Political System Preferences
# Waves 1-7 harmonization
#
# SCALE DIRECTION:
# "Having a political system where [X]" — how good or bad?
# Raw: 1=Very good, 2=Fairly good, 3=Fairly bad, 4=Very bad
# Target: 1=Very bad, 2=Fairly bad, 3=Fairly good, 4=Very good
# All items reversed so higher = more support for that system type
#
# INTERPRETATION NOTE:
# Each item measures support for a specific system type independently.
# Higher scores mean MORE support for that particular system:
#   - dem_strong_leader: higher = more support for authoritarian strong leader
#   - dem_experts_rule: higher = more support for technocratic governance
#   - dem_army_rule: higher = more support for military governance
#   - dem_democratic_system: higher = more support for democracy
#   - dem_religious_law: higher = more support for religious authority
# Researchers should combine/contrast items as needed for their analysis.
#
# MISSING VALUES:
# W6 parquet: negatives already converted to NA
# W7 parquet: -5=Other missing, -4=Not asked, -3=Not applicable, -2=No answer, -1=Don't know

missing_conventions:
  treat_as_na:
    codes: [-5, -4, -3, -2, -1]
    description: "WVS standard missing codes"

variables:
  - id: dem_strong_leader
    concept: democratic_support
    description: "Having a strong leader who does not have to bother with parliament and elections"
    type: ordinal
    source:
      w1: null
      w2: null
      w3: V154
      w4: V164
      w5: V148
      w6: V127
      w7: Q235
    scale:
      min: 1
      max: 4
      labels:
        1: "Very bad"
        2: "Fairly bad"
        3: "Fairly good"
        4: "Very good"
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_4pt
        note: "Both waves coded 1=Very good → 4=Very bad; reverse so high=more support for strong leader"
    qc:
      valid_range: [1, 4]
      validate:
        - waves: [w6, w7]
          phrase: "strong leader"

