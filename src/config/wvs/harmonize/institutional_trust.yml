# WVS Institutional Trust (Confidence in Institutions)
# Waves 1-7 harmonization
#
# SCALE DIRECTION:
# Raw: 1=A great deal, 2=Quite a lot, 3=Not very much, 4=None at all
# Target: 1=None at all, 2=Not very much, 3=Quite a lot, 4=A great deal
# Both waves need safe_reverse_4pt so higher = more trust
#
# MISSING VALUES:
# W6 parquet: negatives already converted to NA
# W7 parquet: -5=Other missing, -4=Not asked, -3=Not applicable, -2=No answer, -1=Don't know

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-5, -4, -3, -2, -1]
    description: "WVS standard missing codes"

variables:
  - id: trust_churches
    concept: institutional_trust
    description: "Confidence in the churches/religious organizations"
    type: ordinal
    source:
      w1: V135
      w2: V272
      w3: V135
      w4: V147
      w5: V131
      w6: V108
      w7: Q64
    scale:
      min: 1
      max: 4
      labels:
        1: "None at all"
        2: "Not very much"
        3: "Quite a lot"
        4: "A great deal"
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_4pt
        note: "Both waves coded 1=Great deal → 4=None; reverse so high=trust"
    qc:
      valid_range: [1, 4]
      validate:
        - waves: [w6, w7]
          phrase: "church"

