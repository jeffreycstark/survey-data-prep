# WVS Media Consumption / Information Sources
# Waves 1-7 harmonization
#
# SCALE DIRECTION:
# Raw: 1=Daily, 2=Weekly, 3=Monthly, 4=Less than monthly, 5=Never
# Target: 1=Never, 2=Less than monthly, 3=Monthly, 4=Weekly, 5=Daily
# All items need safe_reverse_5pt so higher = more frequent use
#
# NOTE ON WAVE DIFFERENCES:
# W1-W5: null for all items (W5 uses binary scale, W1-W4 have no per-medium items; incompatible)
# W6 includes magazines (V218) which W7 dropped
# W7 includes social media (Q207) which W6 did not have
# All other items are present in both W6 and W7
#
# MISSING VALUES:
# W6 parquet: negatives already converted to NA
# W7 parquet: -5=Other missing, -4=Not asked, -3=Not applicable, -2=No answer, -1=Don't know

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-5, -4, -3, -2, -1]
    description: "WVS standard missing codes"

variables:
  - id: info_newspaper
    concept: media_consumption
    description: "How often do you use the following sources to obtain information: Daily newspaper"
    type: ordinal
    source:
      w1: null
      w2: null
      w3: null
      w4: null
      w5: null
      w6: V217
      w7: Q201
    scale:
      min: 1
      max: 5
      labels:
        1: "Never"
        2: "Less than monthly"
        3: "Monthly"
        4: "Weekly"
        5: "Daily"
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_5pt
        note: "Both waves coded 1=Daily → 5=Never; reverse so high=more frequent"
    qc:
      valid_range: [1, 5]
      validate:
        - waves: [w6, w7]
          phrase: "newspaper"

