# KGSS Institutional Confidence
# Years: 2003-2014, 2016, 2018, 2021, 2023, 2025 (17 years)
#
# SCALE DIRECTION:
# Raw: 1=A great deal of confidence, 2=Only some confidence, 3=Hardly any confidence
# Target: 1=Hardly any, 2=Some, 3=A great deal (higher = more confidence)
# All variables use safe_reverse_3pt
#
# NOTE: This is a 1-3 scale (not 1-4 or 0-10 like other surveys).
# Do not compare conf_* variables to trust_* from ABS/WVS/LBS without rescaling.
#
# MISSING VALUES:
# -8 = DK (Don't Know)
# -1 = IAP (Inapplicable / skipped)

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-8, -1]
    description: "KGSS: -8=DK, -1=IAP/inapplicable"

variables:
  - id: conf_business
    concept: institutional_confidence
    description: "Confidence in leaders of major companies"
    type: ordinal
    source:
      w2003: CONBUS
      w2004: CONBUS
      w2005: CONBUS
      w2006: CONBUS
      w2007: CONBUS
      w2008: CONBUS
      w2009: CONBUS
      w2010: CONBUS
      w2011: CONBUS
      w2012: CONBUS
      w2013: CONBUS
      w2014: CONBUS
      w2016: CONBUS
      w2018: CONBUS
      w2021: CONBUS
      w2023: CONBUS
      w2025: CONBUS
    scale:
      min: 1
      max: 3
      labels:
        1: "Hardly any confidence"
        2: "Only some confidence"
        3: "A great deal of confidence"
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_3pt
        note: "Raw 1=great deal → 3=hardly any; reverse so high=more confidence"
    qc:
      valid_range: [1, 3]

