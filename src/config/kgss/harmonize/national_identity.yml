# KGSS ISSP National Identity module (2003 / 2013 / 2023, with bonus 2025 for PROUD* items)
#
# Five variable families:
#
#   (1) General national pride (5 items)  — agree/disagree with broad national-identity statements
#   (2) Domain-specific pride (10 items)  — pride in democracy, economy, science, sports, etc.
#   (3) "True Korean" criteria (6 items)  — importance of birthplace, citizenship, ancestry, etc.
#   (4) International relations (6 items) — protectionism vs globalism attitudes
#   (5) Immigration attitudes (5 items)   — economic/cultural/social effects of immigration
#
# SCALE SUMMARY:
#   5-point agree (general pride / international / immigration items except imm_limit_number):
#     Raw 1=매우 찬성 (strongly agree) → 5=매우 반대 (strongly disagree). REVERSED so higher = more agreement.
#   5-point LETIN1 (imm_limit_number):
#     Raw 1=많이 늘어야 (much more) → 5=많이 줄어야 (much less). REVERSED so higher = want FEWER immigrants.
#   4-point domain pride (PROUD*):
#     Raw 1=매우 자랑스럽다 (very proud) → 4=전혀 자랑스럽지 않다 (not at all). REVERSED so higher = more proud.
#   4-point true-Korean criteria (KR*):
#     Raw 1=매우 중요 (very important) → 4=전혀 중요하지 않음 (not at all). REVERSED so higher = more important.
#
# WAVE COVERAGE:
#   Core ISSP National Identity: 2003, 2013, 2023
#   Domain pride items (PROUD*): ALSO in 2025 — 4 waves of identical items
#   Some true-Korean and immigration items also appeared in 2010
#
# SEMANTIC NOTE on natid_shame (KRSHAMED): statement is "there are things in Korea that make me ashamed."
# Reversed so higher = more agreement = MORE shame. This is deliberately inverse to the other pride items.
#
# MISSING VALUES:
# -8 = DK, -1 = IAP; 8/9/88/98/99 = legacy DK/IAP sentinels

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-8, -1, 8, 9, 88, 98, 99]
    description: "KGSS: -8=DK, -1=IAP; legacy 8/9/88/98/99 sentinels"

