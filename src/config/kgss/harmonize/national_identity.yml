    concept: national_identity
    description: "Agree: 'Rather be Korean than any other nationality' (1-5, higher=more agreement)"
    type: ordinal
    note: "KRCITIZN. Raw 1=strongly agree, 5=strongly disagree. Reversed so high=agree."
    source:
      w2003: KRCITIZN
      w2013: KRCITIZN
      w2023: KRCITIZN
    scale: {min: 1, max: 5, labels: {1: "Strongly disagree", 5: "Strongly agree"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_5pt
    qc:
      valid_range: [1, 5]

  - id: natid_shame
