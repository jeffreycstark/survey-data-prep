# KGSS ISSP Role of Government module
#
# Two variable families:
#
#   (1) Government responsibility — "should it be the government's responsibility to ..."
#       GOVRES1–GOVRES10, fielded in 2006 and 2016.
#       Raw scale 1-4: 1=당연히 정부의 책임 (definitely govt's responsibility),
#                       4=당연히 정부의 책임이 아니다 (definitely not).
#       REVERSED so higher = more state responsibility expected.
#
#   (2) Government spending — "should govt spend more or less on ..."
#       GOVSPD1–GOVSPD8, fielded in 2006, 2014, 2016, 2018, 2021, 2023, 2025 (7 waves — strongest longitudinal coverage in KGSS).
#       Raw scale 1-5: 1=훨씬 더 늘려야 (much more), 5=훨씬 더 줄여야 (much less).
#       REVERSED so higher = more spending desired.
#
# MISSING VALUES:
# -8 = DK, -1 = IAP

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-8, -1, 88, 98, 99]
    description: "KGSS: -8=DK, -1=IAP; legacy 88/98/99 sentinels"

variables:
  # -------- GOVERNMENT RESPONSIBILITY (2006 & 2016) --------
  - id: gov_resp_jobs
    concept: role_of_government
    description: "Should govt be responsible for providing jobs (1-4, higher=more state role)"
    type: ordinal
    source:
      w2006: GOVRES1
      w2016: GOVRES1
    scale: {min: 1, max: 4, labels: {1: "Definitely not", 4: "Definitely yes"}}
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_4pt
    qc:
      valid_range: [1, 4]

