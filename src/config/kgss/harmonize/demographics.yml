# KGSS Demographics
# Years: 2003-2014, 2016, 2018, 2021, 2023 (16 years)
#
# Core demographic variables repeated annually in the KGSS.
#
# VARIABLE NOTES:
#   AGE:     Respondent age in years (18–99; 99=99+)
#   SEX:     1=Male, 2=Female
#   EDUC:    Education level (0=no formal, 1=elementary, ..., 7=PhD, 8=other)
#            Coding consistent across all 16 years.
#   MARITAL: Marital status (1=married, 2=widowed, 3=divorced, 4=separated, 5=never married, 6=cohabiting)
#   EMPLY:   Employment status (1=employed, 2=not employed)
#   INCOME:  Monthly household income categorical (0=no income, 1–21 = brackets in KRW; 87=10M+ uncertain)
#   REGION:  1=Seoul, 2=Gyeonggi, 3=Gangwon, 4=Chungcheong, 5=Gyeongsang, 6=Jeolla, 7=Jeju
#   URBAN:   0=Rural, 1=Urban
#   RELIG:   Religion nominal (1=Buddhist, 2=Protestant, 3=Catholic, 4=No religion, 5+=other)
#   ATTEND:  Religious attendance (1=few times/week, 8=never)
#   CLASS:   Subjective class 6-point (1=upper-upper, 6=lower-lower; higher=lower class)
#   RANK:    Subjective class 10-point (1=bottom, 10=top; higher=higher class)
#
# MISSING VALUES:
# -8 = DK (Don't Know)
# -1 = IAP (Inapplicable / skipped)

missing_conventions:
  treat_as_na:
    codes: [-8, -1]
    description: "KGSS: -8=DK, -1=IAP/inapplicable"

variables:
