# KGSS Political Attitudes
# Years: 2003-2014, 2016, 2018, 2021, 2023 (16 years)
#
# Variables:
#   CURGOV   - Assessment of current government (1=very good, 5=very poor)
#   SATECO   - Satisfaction with national economy (1=very satisfied, 5=very dissatisfied)
#   PARTYLR  - Political orientation/ideology (1=very liberal, 5=very conservative)
#   KRPROUD  - National pride (1=very proud, 4=not proud at all)
#   ECOPROS  - Prospect for Korean economy (1=much better, 5=much worse)
#   POLPROS  - Prospect for Korean politics (1=much better, 5=much worse)
#   NORTHWHO - View on North Korea (1=support, 4=fight against)
#   NKACCEPT - Policy toward North Korean defectors (1=admit all, 3=admit none)
#   UNIFI    - Need for unification (1=very necessary, 4=not at all necessary)
#
# NOTE: Prospect/assessment variables coded higher=worse; stored as-is (identity).
# Researchers should note direction before analysis.
#
# MISSING VALUES:
# -8 = DK (Don't Know)
# -1 = IAP (Inapplicable / skipped)

missing_conventions:
  treat_as_na:
    codes: [-8, -1]
    description: "KGSS: -8=DK, -1=IAP/inapplicable"

variables:
  - id: pol_govt_eval
    concept: political_attitudes
    description: "Assessment of current government's administration (1=very good, 5=very poor)"
    type: ordinal
    note: "Higher values = worse evaluation; reverse before comparing to satisfaction scales coded high=good"
    source:
      w2003: CURGOV
      w2004: CURGOV
      w2005: CURGOV
      w2006: CURGOV
      w2007: CURGOV
      w2008: CURGOV
      w2009: CURGOV
      w2010: CURGOV
      w2011: CURGOV
      w2012: CURGOV
      w2013: CURGOV
      w2014: CURGOV
      w2016: CURGOV
      w2018: CURGOV
      w2021: CURGOV
      w2023: CURGOV
    scale:
      min: 1
      max: 5
      labels:
        1: "Very good"
        2: "Somewhat good"
        3: "Neither good nor poor"
        4: "Somewhat poor"
        5: "Very poor"
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 5]

