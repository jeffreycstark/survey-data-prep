  # -------- (5) POLITICAL ACTION --------
  - id: action_petition
    concept: civic_attitudes
    description: "Signed a petition (1-4, higher=more active after reversal)"
    type: ordinal
    note: "Raw 1=did in past year, 2=did long ago, 3=could do, 4=never have/will. Reversed so high=more active."
    source:
      w2004: SIGNPET
      w2009: SIGNPET
      w2014: SIGNPET
      w2016: SIGNPET
      w2018: SIGNPET
    scale: {min: 1, max: 4, labels: {1: "Never, never will", 4: "Did in past year"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_4pt
    qc:
      valid_range: [1, 4]

  - id: action_boycott
    concept: civic_attitudes
    description: "Boycotted/avoided buying certain products (1-4, higher=more active after reversal)"
    type: ordinal
    source:
      w2004: AVOIDBUY
      w2009: AVOIDBUY
      w2014: AVOIDBUY
      w2016: AVOIDBUY
      w2018: AVOIDBUY
    scale: {min: 1, max: 4, labels: {1: "Never, never will", 4: "Did in past year"}}
    missing:
