    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 7]

  - id: cit_right_minorities
    concept: civic_attitudes
    description: "Importance of govt respecting/protecting minority rights (1-7, higher=more important)"
    type: ordinal
    source:
      w2004: RGHTSMIN
      w2011: RGHTSMIN
      w2014: RGHTSMIN
      w2023: RGHTSMIN
    scale: {min: 1, max: 7, labels: {1: "Not at all important", 7: "Very important"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 7]

  - id: cit_right_polopts
    concept: civic_attitudes
    description: "Importance of citizen participation in public policy decisions (1-7, higher=more important)"
    type: ordinal
    source:
      w2004: POLOPTS
      w2011: POLOPTS
      w2014: POLOPTS
      w2023: POLOPTS
    scale: {min: 1, max: 7, labels: {1: "Not at all important", 7: "Very important"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 7]

  - id: cit_right_oppsegov
    concept: civic_attitudes
    description: "Importance of right to civil disobedience (1-7, higher=more important)"
    type: ordinal
    source:
      w2004: OPPSEGOV
      w2011: OPPSEGOV
      w2014: OPPSEGOV
      w2023: OPPSEGOV
    scale: {min: 1, max: 7, labels: {1: "Not at all important", 7: "Very important"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 7]

  # -------- (3) POLITICAL EFFICACY --------
  - id: pol_efficacy_internal
    concept: civic_attitudes
    description: "Internal efficacy: respondent's perceived influence on government (1-5, higher=more efficacy after reversal)"
    type: ordinal
    note: "POLEFF11. Raw 1=strongly agree (have influence), 5=strongly disagree. Reversed so high=more efficacy."
    source:
      w2004: POLEFF11
      w2014: POLEFF11
      w2023: POLEFF11
    scale: {min: 1, max: 5, labels: {1: "No efficacy", 5: "High efficacy"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_5pt
    qc:
      valid_range: [1, 5]

  - id: pol_efficacy_external
    concept: civic_attitudes
    description: "External efficacy: govt cares about respondent's views (1-5, higher=more efficacy after reversal)"
    type: ordinal
    note: "POLEFF18. Raw 1=strongly agree (govt cares), 5=strongly disagree. Reversed so high=more efficacy."
    source:
      w2004: POLEFF18
      w2014: POLEFF18
      w2023: POLEFF18
    scale: {min: 1, max: 5, labels: {1: "Govt ignores me", 5: "Govt listens to me"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_5pt
    qc:
      valid_range: [1, 5]

  # -------- (4) DEMOCRACY ASSESSMENT --------
  - id: dem_now
    concept: civic_attitudes
    description: "Perceived democracy in Korea today (0-10, higher=more democratic)"
    type: continuous
    note: "DEMTODAY. 0-10 scale. Fielded in 2004, 2014, 2023, AND 2025 (only democracy item in 2025)."
    source:
      w2004: DEMTODAY
      w2014: DEMTODAY
      w2023: DEMTODAY
      w2025: DEMTODAY
    scale: {min: 0, max: 10, labels: {0: "Hardly realized", 10: "Fully realized"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [0, 10]

  - id: dem_10yrs_past
    concept: civic_attitudes
    description: "Perceived democracy in Korea 10 years ago (0-10, higher=more democratic)"
    type: continuous
    source:
      w2004: DEM10PST
      w2014: DEM10PST
      w2023: DEM10PST
    scale: {min: 0, max: 10, labels: {0: "Hardly realized", 10: "Fully realized"}}
    missing:
