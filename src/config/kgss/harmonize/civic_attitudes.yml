# KGSS Civic Attitudes — ISSP Citizenship module (2004 / 2014 / 2023) + related
#
# This file covers items from the ISSP Citizenship module and political-participation
# items that repeat across multiple waves. Organized into five groups:
#
#   (1) Citizenship virtues  — importance of civic duties (PAYTAXES, OBEYLAWS, WATCHGOV, HELPKR)
#   (2) Citizenship rights   — importance of civic/political rights (SOLOK, RGHTSMIN, POLOPTS, OPPSEGOV)
#   (3) Political efficacy   — internal and external efficacy (POLEFF11, POLEFF18)
#   (4) Democracy assessment — perceived democracy now/past/future (DEMTODAY, DEM10PST, DEM10FUT)
#   (5) Political action     — engagement in 5 participation forms (SIGNPET, AVOIDBUY, JOINDEM, ATTRALLY, CNTCTGOV)
#   (6) Administration       — evaluation of admin service and corruption (SERVEPEO, CORRUPTN)
#
# SCALES:
#   Citizenship virtues/rights: 1-7, 1=전혀 중요하지 않다 (not at all important), 7=매우 중요하다 (very important).
#     Higher = more important. NO reversal needed; use identity.
#   Political efficacy: 1-5, 1=매우 그렇다 (strongly agree), 5=매우 그렇지 않다 (strongly disagree).
#     Reverse so higher = more efficacy (agreement with efficacy-affirming statement).
#   Democracy assessment: 0-10, 0=거의 실현되지 않다 (hardly realized), 10=매우 잘 실현되다 (well realized).
#     NO reversal. Note: DEMTODAY includes 2025 (most items don't).
#   Political action: 1-4, 1=지난 1년 동안 한 적이 있다 (did in past year), 4=전에도 안했고 앞으로도 안 할 것이다 (never/will never).
#     Reverse so higher = more active.
#   Administration service (SERVEPEO): 1-4, 1=매우 성의껏 (very attentively), 4=전혀 성의껏 하지 않는다 (not at all).
#     Reverse so higher = better service perception.
#   Administration corruption (CORRUPTN): 1-5, 1=부패한 사람이 거의 없다 (almost no one corrupt), 5=거의 모든 사람이 부패 (almost all).
#     NO reversal; higher = perceives more corruption.
#
# MISSING VALUES:
# -8 = DK, -1 = IAP, 8 = DK legacy, 88 = DK/refusal legacy, 99 = IAP legacy.

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-8, -1, 88, 98, 99]
    description: "KGSS: -8=DK, -1=IAP; legacy 88, 98, 99 sentinel codes"

variables:
  # -------- (1) CITIZENSHIP VIRTUES --------
  - id: cit_virtue_paytaxes
    concept: civic_attitudes
    description: "Importance of paying taxes as a civic virtue (1-7, higher=more important)"
    type: ordinal
    source:
      w2004: PAYTAXES
      w2014: PAYTAXES
      w2023: PAYTAXES
    scale: {min: 1, max: 7, labels: {1: "Not at all important", 7: "Very important"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 7]

  - id: cit_virtue_obeylaws
    concept: civic_attitudes
    description: "Importance of obeying laws and rules as a civic virtue (1-7, higher=more important)"
    type: ordinal
    source:
      w2004: OBEYLAWS
      w2014: OBEYLAWS
      w2023: OBEYLAWS
    scale: {min: 1, max: 7, labels: {1: "Not at all important", 7: "Very important"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 7]

  - id: cit_virtue_watchgov
    concept: civic_attitudes
    description: "Importance of keeping watch on government actions as a civic virtue (1-7, higher=more important)"
    type: ordinal
    source:
      w2004: WATCHGOV
      w2014: WATCHGOV
      w2023: WATCHGOV
    scale: {min: 1, max: 7, labels: {1: "Not at all important", 7: "Very important"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 7]

  - id: cit_virtue_helpkr
    concept: civic_attitudes
    description: "Importance of helping the poor in Korea as a civic virtue (1-7, higher=more important)"
    type: ordinal
    source:
      w2004: HELPKR
      w2014: HELPKR
      w2023: HELPKR
    scale: {min: 1, max: 7, labels: {1: "Not at all important", 7: "Very important"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 7]

  # -------- (2) CITIZENSHIP RIGHTS --------
  - id: cit_right_solok
    concept: civic_attitudes
    description: "Importance of adequate standard of living as a citizen right (1-7, higher=more important)"
    type: ordinal
    source:
