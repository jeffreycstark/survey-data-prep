  # -------- (6) ADMINISTRATION EVALUATION --------
  - id: admin_service
    concept: civic_attitudes
    description: "Perceived attentiveness of public admin service (1-4, higher=better service after reversal)"
    type: ordinal
    note: "Raw SERVEPEO 1=매우 성의껏 봉사 (very attentive), 4=전혀 성의껏 하지 않는다 (not at all). Reversed so high=better service perception."
    source:
      w2004: SERVEPEO
      w2014: SERVEPEO
      w2023: SERVEPEO
    scale: {min: 1, max: 4, labels: {1: "Not attentive at all", 4: "Very attentive"}}
