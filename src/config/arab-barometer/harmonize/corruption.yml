# Arab Barometer Corruption Perceptions
# Waves: w2-w5, w7-w8
#
# KEY ITEMS:
# Q210 = extent of corruption in state institutions (best time-series item)
# Q211 = government working to eliminate corruption
# Q211B = corruption widespread locally
#
# SCALE NOTE:
# Q210 in W2-W3 is binary (1=yes, 2=no). W4+ is 1-4 scale.
# We harmonize W2-W3 to the 1-4 scale: yes → 1 (large extent), no → 4 (not at all).
#
# MISSING VALUES:
# W2-W3: 0=missing, 8=DK, 9=decline
# W4+: 98=DK, 99=refused

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [0, -1, -8, -9, 8, 9, 98, 99, 100, 997, 998, 999]
    description: "Arab Barometer missing codes"

variables:
  # ===========================================================================
  # Extent of corruption in state institutions (Q210)
  # ===========================================================================
  # W2-W3: binary 1=yes, 2=no
  # W4-W8: 1=large extent, 2=medium, 3=small, 4=not at all
  # Target: 1-4, higher = LESS corruption perceived (more positive)

  - id: corruption_extent
    concept: corruption
    description: "Extent of corruption in state institutions (1-4; 1=large extent, 4=not at all; higher=less corruption perceived)"
    type: ordinal
    source:
      w2: q210
      w3: q210
      w4: q210
      w5: Q210
      w7: Q210
      w8: Q210
    scale:
      min: 1
      max: 4
      labels:
        1: "To a large extent"
        2: "To a medium extent"
        3: "To a small extent"
        4: "Not at all"
    harmonize:
      default:
        method: identity
        note: "W4-W8 already 1-4"
      w2:
        method: recode
        mapping:
          1: 1
          2: 4
        note: "W2 binary: 1=yes (corruption exists) → 1 (large extent); 2=no → 4 (not at all)"
      w3:
        method: recode
        mapping:
          1: 1
          2: 4
        note: "W3 binary: same as W2"
    qc:
      valid_range: [1, 4]

  # ===========================================================================
  # Government working to eliminate corruption (Q211)
  # ===========================================================================
  # All waves: 1=great extent, 2=medium, 3=limited, 4=not at all
  # Higher = govt doing LESS about corruption
  # Variable name shifts: q211 (W2-W3), Q211 (W5), Q211_1 (W7), Q211_2 (W8)

  - id: corruption_govt_action
    concept: corruption
    description: "Govt working to eliminate corruption (1-4; 1=great extent, 4=not at all; higher=less action)"
    type: ordinal
    source:
      w2: q211
      w3: q211
      w4: null
      w5: Q211
      w7: Q211_1
      w8: Q211_2
    scale:
      min: 1
      max: 4
      labels:
        1: "To a great extent"
        2: "To a medium extent"
        3: "To a limited extent"
        4: "Not at all"
    note: "W4 missing. Variable name changes across waves but scale is consistent."
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 4]

  # ===========================================================================
  # Corruption widespread locally (Q211B)
  # ===========================================================================
  # 1=hardly anyone, 2=not a lot, 3=most, 4=almost everyone
  # Higher = MORE perceived local corruption

  - id: corruption_local
    concept: corruption
    description: "How widespread is corruption locally (1-4; 1=hardly anyone, 4=almost everyone; higher=more corruption)"
    type: ordinal
    source:
      w2: null
      w3: null
      w4: null
      w5: Q211A
      w7: Q211B
      w8: Q211B
    scale:
      min: 1
      max: 4
      labels:
        1: "Hardly anyone"
        2: "Not a lot"
        3: "Most"
        4: "Almost everyone"
    note: "W5 uses Q211A, W7-W8 use Q211B. W2-W4 not available."
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 4]

  # ===========================================================================
  # Corruption trend (Q210a / te210) — W2-W3 only
  # ===========================================================================

  - id: corruption_trend
    concept: corruption
    description: "Corruption now vs. past (1=more serious, 2=same, 3=less serious)"
    type: ordinal
    source:
      w2: te210
      w3: q210a
      w4: null
      w5: null
      w7: null
      w8: null
    scale:
      min: 1
      max: 3
      labels:
        1: "More serious than before"
        2: "Similar"
        3: "Less serious than before"
    note: "W2-W3 only. W2 compares to last year, W3 to two years ago."
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 3]

  # ===========================================================================
  # Religious leaders as corrupt as secular (Q606_8) — W5, W7, W8
  # ===========================================================================

  - id: religious_leaders_corrupt
    concept: corruption
    description: "Religious leaders as likely to be corrupt as non-religious (1-4; 1=strongly agree, 4=strongly disagree)"
    type: ordinal
    source:
      w2: null
      w3: null
      w4: null
      w5: Q606_8
      w7: Q606_8
      w8: Q606_8
    scale:
      min: 1
      max: 4
    note: "W5-W8. Higher = disagrees (thinks religious leaders are less corrupt)."
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 4]

  # ===========================================================================
  # No corruption as essential for democracy (Q550A_2) — W8 only
  # ===========================================================================

  - id: dem_essential_no_corruption
    concept: corruption
    description: "No corruption as essential feature of democracy (1-4; 1=very essential, 4=not essential; W8 only)"
    type: ordinal
    source:
      w2: null
      w3: null
      w4: null
      w5: null
      w7: null
      w8: Q550A_2
    scale:
      min: 1
      max: 4
      labels:
        1: "Very essential"
        2: "Somewhat essential"
        3: "Not very essential"
        4: "Not essential at all"
    note: "W8 only. Directly measures whether Tunisians define democracy in anti-corruption terms."
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 4]
