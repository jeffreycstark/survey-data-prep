# Arab Barometer: Meanings / Features of Democracy
# Waves: w2-w5, w7-w8 (W1 no Tunisia, W6 deprioritized)
#
# The "most important features" forced-choice item (Q515) is only in W2-W3.
# These are baseline-only items — cannot track change over time.
#
# MISSING VALUES: same as democratic_attitudes.yml

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [0, -1, -8, -9, 8, 9, 98, 99, 100, 96, 94, 997, 998, 999, 99994, 99996, 99998, 99999]
    description: |
      Arab Barometer missing codes (varies by wave). 99994/99996/99998/99999
      added 2026-05-13 for W2-W3 dem_feature_* — these are W2/W3-specific
      DK/refused markers (Tunisia/Egypt fielding used 5-digit refusal codes).

variables:
  # ===========================================================================
  # Most Important Features of Democracy (Q515) — W2-W3 ONLY
  # ===========================================================================
  # Forced-choice: "Which is the most important feature of democracy?"
  # Value labels not embedded in SPSS metadata — need questionnaire.
  # Typically: 1=Ability to change govt through elections,
  # 2=Freedom to criticize govt, 3=Narrowing income gap,
  # 4=Providing basic necessities (varies by wave)

  - id: dem_feature_1st
    concept: meanings_of_democracy
    description: "Most important feature of democracy — 1st choice (categorical, see codebook)"
    type: nominal
    source:
      w2: q5151
      w3: q5151
      w4: null
      w5: null
      w7: null
      w8: null
    note: |
      W2-W3 only. Value labels vary — decode from questionnaire PDF.
      W2 raw has 52 cases of country-specific extension codes (2001-10503,
      "Other: independent judiciary / freedom of the media / justice / etc.")
      that fall outside the [1, 10] standard scale. Same analytic choice as
      dem_feature_2nd: keep only the universal 1-10 codes and declare the
      extension codes below so the audit recognizes them as intentional drops
      rather than coverage loss. The code SET differs from dem_feature_2nd's —
      these are different questions with different observed "other" answers —
      so it is enumerated from the raw data, not copied from the twin.
      Added 2026-07-31; until then only dem_feature_2nd carried the
      declaration, which left the twins split across error and warn in the
      out-of-range triage.
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 10]
      coverage_missing_codes_by_wave:
        w2: [2001, 2002, 2003, 2004, 3001, 3501, 3505,
             4501, 4502, 4503, 4504, 4505, 9001,
             10002, 10003, 10501, 10502, 10503]

  - id: dem_feature_2nd
    concept: meanings_of_democracy
    description: "Most important feature of democracy — 2nd choice (categorical, see codebook)"
    type: nominal
    source:
      w2: q5152
      w3: q5152
      w4: null
      w5: null
      w7: null
      w8: null
    note: |
      W2-W3 only. W2 raw has 81 cases of country-specific extension codes
      (2001-10506: "Other: religious freedom / security / etc.") that fall
      outside the [1, 10] standard scale. The YAML's analytic choice is to
      keep only the universal 1-10 codes; the extension codes are declared
      below so the audit recognizes them as intentional drops, not as
      coverage loss.
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 10]
      coverage_missing_codes_by_wave:
        w2: [2001, 2002, 2005, 2006, 3001, 3502, 3503, 3504, 3506, 3507,
             8001, 8002, 8003, 8004, 8005, 8006, 9001, 10001,
             10502, 10503, 10504, 10505, 10506]
