# Arab Barometer Demographics
# Waves: w2-w5, w7-w8

missing_conventions:
  treat_as_na:
    codes: [0, -1, -8, -9, 8, 9, 98, 99, 100, 997, 998, 999]
    description: "Arab Barometer missing codes"

variables:
  - id: gender
    concept: demographics
    description: "Gender (1=Male, 2=Female)"
    type: nominal
    source:
      w2: q1002
      w3: q1002
      w4: q1002
      w5: Q1002
      w7: Q1002
      w8: Q1002
    note: "W2 uses 0=missing,1=male,2=female; W5 has extra codes 3=MALE,5=FEMALE (cleaned by missing_conventions + valid_range)"
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 2]

  - id: education_level
    concept: demographics
    description: "Highest level of education (raw coding varies by wave — needs harmonization)"
    type: ordinal
    source:
      w2: q1003
      w3: q1003
      w4: q1003
      w5: Q1003
      w7: Q1003
      w8: Q1003
    note: "Scale differs across waves — will need custom recode for cross-wave comparison."
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 10]

  - id: urban_rural
    concept: demographics
    description: "Urban/Rural residence"
    type: nominal
    source:
      w2: q13
      w3: q13
      w4: q13
      w5: q13
      w7: Q13
      w8: Q13
    note: "W5 uses lowercase q13, labeled 'SETTLEMENT'"
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 2]

  - id: int_date
    concept: identifiers
    description: "Full interview date (Date class)"
    type: continuous
    source:
      w2: null
      w3: date
      w4: null
      w5: null
      w7: DATE
      w8: DATE
    note: "W3=Date class, W7/W8=character 'YYYY-MM-DD'. W2/W4/W5 have no date variable."
    harmonize:
      default:
        method: r_function
        fn: extract_date
    qc:
      skip_range_check: true

  - id: int_month
    concept: identifiers
    description: "Interview month (1-12)"
    type: ordinal
    source:
      w2: null
      w3: date
      w4: null
      w5: null
      w7: DATE
      w8: DATE
    note: "Extracted from date/DATE. W2/W4/W5 have no date variable."
    scale:
      min: 1
      max: 12
    harmonize:
      default:
        method: r_function
        fn: extract_month_from_date
    qc:
      valid_range: [1, 12]

  - id: int_year
    concept: identifiers
    description: "Interview year"
    type: ordinal
    source:
      w2: null
      w3: date
      w4: null
      w5: null
      w7: DATE
      w8: DATE
    note: "Extracted from date/DATE. W2/W4/W5 have no date variable."
    scale:
      min: 2010
      max: 2025
    harmonize:
      default:
        method: r_function
        fn: extract_year_from_date
    qc:
      valid_range: [2010, 2025]

  - id: weight
    concept: demographics
    description: "Survey weight"
    type: continuous
    source:
      w2: wt
      w3: wt
      w4: wt
      w5: wt
      w7: WT
      w8: WT
    harmonize:
      default:
        method: identity
