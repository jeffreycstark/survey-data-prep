# Arab Barometer Demographics
# Waves: w2-w5, w7-w8

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [0, -1, -8, -9, 8, 9, 98, 99, 100, 997, 998, 999]
    description: "Arab Barometer missing codes"

variables:
  - id: gender
    concept: demographics
    description: "Gender (1=Male, 2=Female)"
    type: nominal
    source:
      w2: q1002
      w3: q1002
      w4: q1002
      w5: Q1002
      w7: Q1002
      w8: Q1002
    note: "W2 uses 0=missing,1=male,2=female; W5 has extra codes 3=MALE,5=FEMALE (cleaned by missing_conventions + valid_range)"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 2]

  - id: age
    concept: demographics
    description: "Age of respondent in years"
    type: continuous
    source:
      w2: q1001
      w3: q1001
      w4: q1001
      w5: Q1001
      w7: Q1001
      w8: Q1001
    note: "W7-W8 also have Q1001YEAR (birth year) and Q1001APPROX; we use Q1001 (direct age). 0 and 999 treated as NA via missing_conventions."
    scale:
      min: 18
      max: 110
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
        note: "Continuous age in years. Missing codes cleaned by valid_range."
    qc:
      valid_range: [18, 110]

  - id: age_cohort
    concept: demographics
    description: "Age cohort (1=18-29, 2=30-39, 3=40-49, 4=50-59, 5=60+)"
    type: ordinal
    note: "Derived from continuous age. Same source columns as age."
    source:
      w2: q1001
      w3: q1001
      w4: q1001
      w5: Q1001
      w7: Q1001
      w8: Q1001
    scale:
      min: 1
      max: 5
      labels:
        1: "18-29 (youth)"
        2: "30-39"
        3: "40-49"
        4: "50-59"
        5: "60+"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: recode_age_cohort
        note: "Bins continuous age into 5 cohorts"
    qc:
      valid_range: [1, 5]

  - id: education_level
    concept: demographics
    description: "Highest level of education (raw coding varies by wave — needs harmonization)"
    type: ordinal
    source:
      w2: q1003
      w3: q1003
      w4: q1003
      w5: Q1003
      w7: Q1003
      w8: Q1003
    note: "Scale differs across waves — will need custom recode for cross-wave comparison."
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 10]

  - id: urban_rural
    concept: demographics
    description: "Urban/Rural residence"
    type: nominal
    source:
      w2: q13
      w3: q13
      w4: q13
      w5: q13
      w7: Q13
      w8: Q13
    note: "W5 uses lowercase q13, labeled 'SETTLEMENT'"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 2]

  - id: int_date
    concept: identifiers
    description: "Full interview date (Date class)"
    type: continuous
    source:
      w2: null
      w3: date
      w4: null
      w5: null
      w7: DATE
      w8: DATE
    note: "W3=Date class, W7/W8=character 'YYYY-MM-DD'. W2/W4/W5 have no date variable."
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: extract_date
    qc:
      skip_range_check: true

  - id: int_month
    concept: identifiers
    description: "Interview month (1-12)"
    type: ordinal
    source:
      w2: null
      w3: date
      w4: null
      w5: null
      w7: DATE
      w8: DATE
    note: "Extracted from date/DATE. W2/W4/W5 have no date variable."
    scale:
      min: 1
      max: 12
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: extract_month_from_date
    qc:
      valid_range: [1, 12]

  - id: int_year
    concept: identifiers
    description: "Interview year"
    type: ordinal
    source:
      w2: null
      w3: date
      w4: null
      w5: null
      w7: DATE
      w8: DATE
    note: |
      W3/W7/W8 extract directly from the raw date column. W2/W4/W5 have no
      interview-date variable in the raw AB files; int_year for those waves
      is filled in 99_create_final_dataset.R using a country × wave fieldwork
      crosswalk (derived from published AB methodology reports).
    scale:
      min: 2006
      max: 2025
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: extract_year_from_date
    qc:
      valid_range: [2006, 2025]

  - id: weight
    concept: demographics
    description: "Survey weight"
    type: continuous
    source:
      w2: wt
      w3: wt
      w4: wt
      w5: wt
      w7: WT
      w8: WT
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
