# Arab Barometer Demographics
# Waves: w2-w5, w7-w8

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [0, -1, -8, -9, 8, 9, 98, 99, 100, 997, 998, 999, 99999]
    description: |
      Arab Barometer missing codes. 99999 added 2026-05-13 for age W7/W8
      where the raw .sav uses 99999 = refusal/missing for the Q1001
      continuous-age variable (502 cases in W7, 214 in W8).
  no_missing_codes:
    codes: []
    description: |
      Empty convention for derived numeric variables whose values are
      ordinary integers (e.g. int_month 1-12, int_year 2007-2024) and
      would otherwise collide with the treat_as_na codes 8/9 (= month
      Aug/Sep get incorrectly excluded from raw_valid).

variables:
  - id: gender
    concept: demographics
    description: "Gender (1=Male, 2=Female)"
    type: nominal
    source:
      w2: q1002
      w3: q1002
      w4: q1002
      w5: Q1002
      w7: Q1002
      w8: Q1002
    note: |
      W2 uses 0=missing, 1=male, 2=female. W5 country 16 uses non-standard
      codes 3=MALE, 5=FEMALE (1,070 respondents) — value labels in the W5
      .sav confirm "3.  MALE" and "5.  FEMALE". Other W5 countries and
      all other waves use standard 1/2. Previously these 1,070 cases were
      NA-coerced by valid_range [1,2]; now mapped via recode_arab_gender_w5
      to preserve the data (3→1, 5→2).
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
      exceptions:
        w5:
          method: r_function
          fn: recode_arab_gender_w5
    qc:
      valid_range: [1, 2]

  - id: age
    concept: demographics
    description: "Age of respondent in years"
    type: continuous
    source:
      w2: q1001
      w3: q1001
      w4: q1001
      w5: Q1001
      w7: Q1001
      w8: Q1001
    note: "W7-W8 also have Q1001YEAR (birth year) and Q1001APPROX; we use Q1001 (direct age). 0 and 999 treated as NA via missing_conventions."
    scale:
      min: 18
      max: 110
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
        note: "Continuous age in years. Missing codes cleaned by valid_range."
    qc:
      valid_range: [18, 110]

  - id: age_cohort
    concept: demographics
    description: "Age cohort (1=18-29, 2=30-39, 3=40-49, 4=50-59, 5=60+)"
    type: ordinal
    note: "Derived from continuous age. Same source columns as age."
    source:
      w2: q1001
      w3: q1001
      w4: q1001
      w5: Q1001
      w7: Q1001
      w8: Q1001
    scale:
      min: 1
      max: 5
      labels:
        1: "18-29 (youth)"
        2: "30-39"
        3: "40-49"
        4: "50-59"
        5: "60+"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: recode_age_cohort
        note: "Bins continuous age into 5 cohorts"
    qc:
      valid_range: [1, 5]

  - id: education_level
    concept: demographics
    description: "Highest level of education (raw coding varies by wave — needs harmonization)"
    type: ordinal
    source:
      w2: q1003
      w3: q1003
      w4: q1003
      w5: Q1003
      w7: Q1003
      w8: Q1003
    note: "Raw-label-verified 2026-08-08: every wave (W2-W5, W7-W8) codes 1=illiterate/no formal education → 7=MA and above; the category WORDING drifts slightly (W5 5=tertiary, W7/W8 5=technical degree) but the 1-7 ladder is stable. Missing markers: 0 (W2/W3), 9=declined (W2), 98/99 (W4+), 100 (W7) — all in the convention."
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      # FIX 2026-08-08: was [1, 10] — an over-claim that made the convention's
      # 8/9 collide with the range. No wave has real codes above 7; W2's 9
      # (declined, n=26) is genuine missing and stays in the convention.
      valid_range: [1, 7]

  - id: urban_rural
    concept: demographics
    description: "Urban/Rural/Camp residence (1=Urban, 2=Rural, 3=Refugee camp)"
    type: nominal
    source:
      w2: q13
      w3: q13
      w4: q13
      w5: q13
      w7: Q13
      w8: Q13
    note: |
      W5 uses lowercase q13, labeled 'SETTLEMENT'. Raw scale is 3-category
      in W4-W8 (1=Urban, 2=Rural, 3=Refugee camp). 159-348 respondents per
      wave from refugee camps were previously NA-coerced by the [1,2]
      valid_range; widened to [1,3] on 2026-05-13 to preserve the
      substantive third category.
    scale:
      min: 1
      max: 3
      labels:
        1: "Urban"
        2: "Rural"
        3: "Refugee camp"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 3]

  - id: int_date
    concept: identifiers
    description: "Full interview date (Date class)"
    type: continuous
    source:
      w2: null
      w3: date
      w4: null
      w5: null
      w7: DATE
      w8: DATE
    note: |
      W3=Date class, W7/W8=character 'YYYY-MM-DD'. W2/W4/W5 have no date
      variable. Harmonized output is R Date class — typeof=double but
      is.numeric() returns FALSE (Date class blocks numeric semantics),
      so the type_stability check sees storage as "double" not "numeric".
      Skip the type check for this variable.
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: extract_date
    qc:
      skip_range_check: true
      skip_type_stability: true

  - id: int_month
    concept: identifiers
    description: "Interview month (1-12)"
    type: ordinal
    source:
      w2: null
      w3: date
      w4: null
      w5: null
      w7: DATE
      w8: DATE
    note: |
      Extracted from date/DATE. W2/W4/W5 have no date variable. Uses an
      empty missing-codes convention because month values 8 (August) and
      9 (September) would collide with the treat_as_na codes — 1,232 W8
      September interviews were incorrectly excluded from raw_valid before
      this was overridden.
    scale:
      min: 1
      max: 12
    missing:
      use_convention: no_missing_codes
    harmonize:
      default:
        method: r_function
        fn: extract_month_from_date
    qc:
      valid_range: [1, 12]

  - id: int_year
    concept: identifiers
    description: "Interview year"
    type: ordinal
    source:
      w2: null
      w3: date
      w4: null
      w5: null
      w7: DATE
      w8: DATE
    note: |
      W3/W7/W8 extract directly from the raw date column. W2/W4/W5 have no
      interview-date variable in the raw AB files; int_year for those waves
      is filled in 99_create_final_dataset.R using a country × wave fieldwork
      crosswalk (derived from published AB methodology reports).
    scale:
      min: 2006
      max: 2025
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: extract_year_from_date
    qc:
      valid_range: [2006, 2025]

  - id: weight
    concept: demographics
    description: "Survey weight"
    type: continuous
    source:
      w2: wt
      w3: wt
      w4: wt
      w5: wt
      w7: WT
      w8: WT
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
