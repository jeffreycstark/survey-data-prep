# Arab Barometer — respondent/interview identifiers.
# IDs are DATA for raw-traceability and merges, never the uniqueness
# backbone (that is row_uid). ID variables carry NO missing codes — the
# generalized lesson of the 2026-08-09 ABS idnumber bug.
# Sources + key verdicts label/measure-verified 2026-08-10; see
# docs/superpowers/specs/2026-08-10-row-identifiers-design.md.
schema_version: 1

missing_conventions:
  no_missing_codes:
    codes: []
    description: "Serial IDs have no refused/DK values; every code is real."

variables:
  - id: native_id
    concept: identifiers
    description: "Respondent ID (raw id/ID; W5-W8 only — W1-W4 releases carry no ID). wave+country+native_id unique except W5's 3 release duplicates and W8's 2,400-row ID=0 block (IDs never assigned in release; kept verbatim) — see key_uniqueness_exemptions.yml."
    type: nominal
    source:
      w2: null
      w3: null
      w4: null
      w5: id
      w7: ID
      w8: ID
    missing:
      use_convention: no_missing_codes
    harmonize:
      default:
        method: identity
    qc:
      skip_range_check: true
      skip_unmapped_check: true
