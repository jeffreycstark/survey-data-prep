  - id: trust_president
    concept: institutional_trust
    description: "Trust in president/head of state (1-4; higher=more trust). REVERSED."
    type: ordinal
    source:
      w2: null
      w3: null
      w4: null
      w5: Q201B_31
      w7: Q201A_31B
      w8: Q201A_31B
    note: |
      W5 Q201B_31 = "President/Prime Minister" (combined item; half-sample
      split ballot, ~50% within-country coverage). W7/W8 Q201A_31B =
      "President/Head of State" (separate from Q201A_31C = Prime Minister).
      W2-W4 did not include a separate head-of-state item. Country coverage
      varies by constitutional form: populated in presidential/semi-presidential
      systems (Tunisia, Iraq, Palestine, Mauritania, Egypt in some waves),
      not in pure parliamentary monarchies (Jordan, Morocco, Kuwait).
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_4pt
    qc:
      valid_range: [1, 4]
