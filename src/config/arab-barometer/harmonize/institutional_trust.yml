# Arab Barometer Institutional Trust
# Waves: w2-w5, w7-w8
#
# SCALE: 1=A great deal of trust, 2=Quite a lot/Medium, 3=Limited/Not a lot,
# 4=Absolutely no trust. HIGHER = LESS TRUST.
# We REVERSE so higher = more trust (matching Afro/WVS convention).
#
# MISSING VALUES:
# W2-W3: 0=missing, 8=DK, 9=decline
# W4: 98=DK, 99=decline
# W5+: 98=DK, 99=refused

missing_conventions:
  treat_as_na:
    codes: [0, -1, -8, -9, 8, 9, 98, 99, 100, 997, 998, 999]
    description: "Arab Barometer missing codes"

variables:
  - id: trust_government
    concept: institutional_trust
    description: "Trust in government/council of ministers (1-4; higher=more trust). REVERSED."
    type: ordinal
    source:
      w2: q2011
      w3: q2011
      w4: q2011
      w5: Q201A_1
      w7: Q201A_1
      w8: Q201A_1
    scale:
      min: 1
      max: 4
      labels:
        1: "No trust at all"
        2: "Not a lot of trust"
        3: "Quite a lot of trust"
        4: "A great deal of trust"
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_4pt
        note: "Raw 1=great trust → reversed so 4=great trust"
    qc:
      valid_range: [1, 4]

  - id: trust_courts
