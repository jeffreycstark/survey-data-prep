  - id: trust_police
    concept: institutional_trust
    description: "Trust in police/public security (1-4; higher=more trust). REVERSED."
    type: ordinal
    source:
      w2: q2014
      w3: q2014
      w4: q2014
      w5: Q201A_42
      w7: null
      w8: Q201B_4
    note: |
      W7 has NO comparable trust_police item: the only police variable is
      Q201A_42A_MOR (Morocco-only, 62% coverage within Morocco, 0% all other
      countries including Tunisia). AB W7 dropped the generic police battery.
      W8 restored it as Q201B_4 (Tunisia 100%, cross-country ~95-100%).
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_4pt
    qc:
      valid_range: [1, 4]

  - id: trust_political_parties
    concept: institutional_trust
    description: "Trust in political parties (1-4; higher=more trust). REVERSED."
    type: ordinal
    source:
      w2: q2015
      w3: null
      w4: q20120
      w5: Q201B_20
      w7: null
      w8: null
    note: |
      Spotty coverage. W3 missing. W5 uses a half-sample split-ballot
      (Tunisia ~50% response). W7 and W8 omit the generic political-parties
      trust item entirely (no Q201B_20; only country-specific sectarian-party
      items like Q201B_12 "main Sunni party" / Q201B_14 "main Shia party").
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_4pt
    qc:
      valid_range: [1, 4]

