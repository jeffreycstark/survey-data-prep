# KAMOS Institutional Trust
# Scale: 0-10 (0=completely untrustworthy, 10=completely trustworthy)
# Higher = more trust throughout.
#
# MISSING VALUES: No negative codes found in data; trust items appear fully
# clean. Standard exclusion codes included as a precaution.
#
# NOTE: W1 variable names differ slightly from W4 (e.g. Medtrust vs medtrust,
# Orgtrust vs orgtrust). Source fields handle this per wave.

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [97, 98, 99]
    description: "Don't know / refused"

variables:
  - id: trust_central_govt
    concept: institutional_trust
    description: "Trust in central government (0-10)"
    type: continuous
    source:
      w1: cgotrust
      w2: cgotrust
      w3: cgotrust
      w4: cgotrust
    scale:
      min: 0
      max: 10
      direction: higher_more_trust
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [0, 10]

  - id: trust_local_govt
    concept: institutional_trust
    description: "Trust in local government (0-10)"
    type: continuous
