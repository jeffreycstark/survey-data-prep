        3: "Distrust somewhat"
        4: "Trust somewhat"
        5: "Trust a lot"
        6: "Trust fully"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_6pt
        note: "Raw W5 runs 1=Trust fully -> 6=Distrust fully; reversed so higher = more trust."
    qc:
      valid_range: [1, 6]
      validate:
        - waves: [w5]
          phrase: "people.*interact"
  - id: trust_strangers_w5_6pt
    concept: social_trust
    description: "How much trust do you have in people you meet for the first time? — native W5 6-point scale"
    type: ordinal
