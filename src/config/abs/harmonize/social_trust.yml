  # ===========================================================================
  # GROUP 2: Trust in Different People
  # WARNING: W5 uses 6-point scale, others use 4-point
  # ===========================================================================
  - id: trust_relatives
    concept: social_trust
    description: "How much trust do you have in your relatives?"
    type: ordinal
    source:
      w1: null # Not asked
      w2: q24
      w3: q25
      w4: q26
      w5: q24 # WARNING: 6pt scale
      w6: q24
    # W2: 1=None → 4=Great deal (low→high)
    # W3, W4, W6: 1=Great deal → 4=None (high→low, needs reversal)
    # W5: 6pt 1=Trust fully → 6=Distrust fully (needs collapse + reversal)

    scale:
      min: 1
      max: 4
      labels:
        1: "None at all"
        2: "Not very much trust"
        3: "Quite a lot of trust"
        4: "A great deal of trust"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_4pt
        note: "W3, W4, W6 coded 1=Great deal → 4=None; reverse so high=trust"
      exceptions:
        w2:
          method: r_function
          fn: reverse_trust_vietnam_w2
          note: "W2 identity for most countries; Vietnam (country=11) coded 1=Great deal → 4=None"
        w3:
          method: r_function
          fn: reverse_trust_vietnam_w3
          note: "W3 reverse for most countries; Vietnam (country=11) coded 1=None → 4=Great deal"
        w5:
          method: r_function
          fn: collapse_6pt_to_4pt_reverse
          note: "W5 has 6pt scale (1=Trust fully → 6=Distrust fully); collapse and reverse"
    qc:
      valid_range: [1, 4]
      group_by: country
      transformation_allow_reverse: true
      validate:
        - waves: [w2, w3, w4, w5, w6]
          phrase: "trust.*relative"
      notes:
        - "W5 uses different 6-point scale - requires special harmonization"
  - id: trust_strangers
    concept: social_trust
    description: "How much trust do you have in people you meet for the first time?"
    type: ordinal
    source:
      w1: null
      w2: null
      w3: null
      w4: null
      w5: q27 # WARNING: 6pt scale
      w6: q27
    scale:
      min: 1
      max: 4
      labels:
        1: "None at all"
        2: "Not very much trust"
        3: "Quite a lot of trust"
        4: "A great deal of trust"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_4pt
        note: "W6 coded 1=Great deal → 4=None; reverse so high=trust"
      exceptions:
        w5:
          method: r_function
          fn: collapse_6pt_to_4pt_reverse
          note: "W5 has 6pt scale; collapse and reverse"
    qc:
      valid_range: [1, 4]
      validate:
        - waves: [w5, w6]
          phrase: "first time|strangers"
  # ===========================================================================
  # W5 native 6-pt companions (added 2026-08-08). The harmonized 4-pt columns
  # collapse W5's 6-point scale by merging BOTH poles (raw 1,2 -> 4; 5,6 -> 1),
  # so W5's top/bottom bins are structurally wider than every other wave's and
  # W5 top-box shares/means are mechanically inflated ~2.4-4.6x (Check D).
  # These columns preserve W5's native resolution. Use them for any W5-level
  # analysis; use the 4-pt columns for W4<->W6 comparisons that bypass W5.
  # Seam documented in docs/surveys/abs.md and CLAUDE.md gotchas.
  # ===========================================================================
  - id: trust_relatives_w5_6pt
    concept: social_trust
    description: "How much trust do you have in your relatives? — native W5 6-point scale"
    type: ordinal
    source:
      w1: null
      w2: null
      w3: null
      w4: null
      w5: q24
      w6: null
    note: "W5-only companion to trust_relatives, which collapses W5 6->4 by pole-merge and carries the Check D bin-width seam. This column keeps the native W5 categories, reversed so higher = more trust."
    scale:
      min: 1
      max: 6
      labels:
        1: "Distrust fully"
        2: "Distrust a lot"
        3: "Distrust somewhat"
        4: "Trust somewhat"
        5: "Trust a lot"
        6: "Trust fully"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_6pt
        note: "Raw W5 runs 1=Trust fully -> 6=Distrust fully; reversed so higher = more trust."
    qc:
      valid_range: [1, 6]
      validate:
        - waves: [w5]
          phrase: "trust.*relative"
  - id: trust_neighbors_w5_6pt
    concept: social_trust
    description: "How much trust do you have in your neighbors? — native W5 6-point scale"
    type: ordinal
