    qc:
      valid_range: [1, 6]
      validate:
        - waves: [w5]
          phrase: "neighbor"
  - id: trust_acquaintances_w5_6pt
    concept: social_trust
    description: "How much trust do you have in other people you interact with? — native W5 6-point scale"
    type: ordinal
    source:
      w1: null
      w2: null
      w3: null
      w4: null
      w5: q26
      w6: null
    note: "W5-only companion to trust_acquaintances, which collapses W5 6->4 by pole-merge and carries the Check D bin-width seam. This column keeps the native W5 categories, reversed so higher = more trust."
    scale:
      min: 1
