# Social Trust - Comprehensive YAML (v2 - CORRECTED)
# Variables measuring generalized trust, interpersonal trust, and social networks
# Corrected 2025-01-10: Fixed scale directions and documented W5 6pt scale issue

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-1, 0, 7, 8, 9, 97, 98, 99, 1099]
    description: "Standard missing codes"
variables:
  - id: trust_acquaintances
    concept: social_trust
    description: "How much trust do you have in other people you interact with?"
    type: ordinal
    source:
      w1: null # Not asked
      w2: q26
      w3: q27
      w4: q28
      w5: q26 # WARNING: 6pt scale
      w6: q26
    # Same pattern as trust_relatives

    scale:
      min: 1
      max: 4
      labels:
        1: "None at all"
        2: "Not very much trust"
        3: "Quite a lot of trust"
        4: "A great deal of trust"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_4pt
        note: "W3, W4, W6 coded 1=Great deal → 4=None; reverse so high=trust"
      exceptions:
        w2:
          method: r_function
          fn: reverse_trust_vietnam_w2
          note: "W2 identity for most countries; Vietnam (country=11) coded 1=Great deal → 4=None"
        w3:
          method: r_function
          fn: reverse_trust_vietnam_w3
          note: "W3 reverse for most countries; Vietnam (country=11) coded 1=None → 4=Great deal"
        w5:
          method: r_function
          fn: collapse_6pt_to_4pt_reverse
          note: "W5 has 6pt scale; collapse and reverse"
    qc:
      valid_range: [1, 4]
      group_by: country
      transformation_allow_reverse: true
      validate:
        - waves: [w2, w3, w4, w5, w6]
          phrase: "people.*interact"
  # ===========================================================================
  # GROUP 1: Generalized Trust
  # ===========================================================================
  - id: trust_generalized_binary
    concept: social_trust
    description: "Would you say most people can be trusted or must be very careful in dealing with people?"
    type: nominal
    missing:
      use_convention: treat_as_na
      codes: [3, 6]
    source:
      w1: q024
      w2: q23
      w3: q23
      w4: q23
      w5: q22
      w6: q22
    # WARNING: W1 has 3 categories (1=Careful, 2=Trusted, 3=Both)
    # WARNING: W5 has 3 categories (1=Trusted, 2=Careful, 3=Depends)
    # Target scale: 1=Trusted, 0=Careful

    scale:
      min: 0
      max: 1
      labels:
        1: "Most people can be trusted"
        0: "Must be very careful"
    harmonize:
      default:
        method: r_function
        fn: recode_binary_yes_no
        note: "W3, W4, W6 coded 1=Trusted, 2=Careful; map to 1/0"
      exceptions:
        w1:
          method: recode
          mapping:
            1: 0  # Careful -> 0
            2: 1  # Trusted -> 1
            3: null
          note: "W1 has 3 categories: 1=Careful→0, 2=Trusted→1, 3=Both→NA"
        w2:
          method: r_function
          fn: recode_binary_01
          note: "W2 coded 1=Careful, 2=Trusted; map to 0/1"
        w5:
          method: recode
          mapping:
            1: 1  # Trusted -> 1
            2: 0  # Careful -> 0
            3: null
          note: "W5 has 3 categories: 1=Trusted→1, 2=Careful→0, 3=Depends→NA"
    qc:
      valid_range: [0, 1]
      validate:
        - waves: [w1, w2, w3, w4, w5, w6]
          phrase: "most people.*trusted|careful.*dealing"
      notes:
        - "W1 and W5 have 3rd category that must be recoded to NA"
        - "W2 scale is reversed from W3-W6"
  - id: trust_generalized_ordinal
    concept: social_trust
    description: "Do you agree that most people are trustworthy?"
    type: ordinal
    source:
      w1: null # Not asked
      w2: null # Not asked
      w3: q49
      w4: q24
      w5: q23
      w6: q23
    # Verified 2025-01-10: All waves 1=Strongly agree → 4=Strongly disagree

    scale:
      min: 1
      max: 4
      labels:
        1: "Strongly disagree"
        2: "Somewhat disagree"
        3: "Somewhat agree"
        4: "Strongly agree"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_4pt
        note: "All waves coded 1=Agree → 4=Disagree; reverse so high=trust"
    qc:
      valid_range: [1, 4]
      validate:
        - waves: [w3, w4, w5, w6]
          phrase: "trustworthy"
  # ===========================================================================
  # GROUP 3: Trust in Government (from political attitudes)
  # ===========================================================================
  - id: trust_govt_do_right
    concept: social_trust
    description: "You can generally trust the people who run our government to do what is right"
    type: ordinal
    source:
      w1: q131
      w2: q130
      w3: q136
      w4: q137
      w5: q144
      w6: q136
    # All waves: 1=Strongly agree → 4=Strongly disagree

    scale:
      min: 1
      max: 4
      labels:
        1: "Strongly disagree"
        2: "Somewhat disagree"
        3: "Somewhat agree"
        4: "Strongly agree"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_4pt
        note: "All waves coded 1=Agree → 4=Disagree; reverse so high=trust"
    qc:
      valid_range: [1, 4]
      validate:
        - waves: [w1, w2, w3, w4, w5, w6]
          phrase: "trust.*government.*right"
