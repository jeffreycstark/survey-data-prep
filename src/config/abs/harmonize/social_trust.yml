          note: "W3 reverse for most countries; Vietnam (country=11) coded 1=None → 4=Great deal"
        w5:
          method: r_function
          fn: collapse_6pt_to_4pt_reverse
          note: "W5 has 6pt scale; collapse and reverse"
    qc:
      valid_range: [1, 4]
