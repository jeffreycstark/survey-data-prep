  # ===========================================================================
  - id: subjective_social_status
    concept: demographics
    description: "Subjective social status (1=lowest, 10=highest)"
    type: ordinal
    source:
      w1: null  # se017 is a DIFFERENT question: 5-category social CLASS (1=Upper, 5=Lower),
                # direction inverted vs. the 10-pt status ladder in W2-6. DO NOT harmonize.
      w2: se13
      w3: se12
      w4: se12
      w5: SE12
      w6: se12
    scale:
      min: 1
      max: 10
      labels:
        1: "Lowest status"
        10: "Highest status"
    missing:
      # FIX 2026-08-07: treat_as_na deleted valid rungs 7/8/9
