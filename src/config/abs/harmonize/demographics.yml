      use_convention: treat_as_na_10pt
      codes: [90]
    source:
      w1: se007
      w2: se7
      w3: se7
      w4: se7
      w5: SE7
      w6: se7
    scale:
      min: 1
      max: 11
      labels:
        1: "Several times a day"
        2: "Once a day"
        3: "Several times a week"
        4: "Once a week"
        5: "Several times a month"
        6: "Once a month"
        7: "Several times a year"
        8: "Once a year"
        9: "Less often"
