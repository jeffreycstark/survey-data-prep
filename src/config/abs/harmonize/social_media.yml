# Social Media - Validated YAML (v2)
# Variables measuring internet usage, social media platforms, and online political engagement
# Validated 2025-01-11

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-1, 0, 7, 8, 9, 97, 98, 99, 1099]
    description: "Standard missing codes"
  internet_frequency_missing:
    codes: [-1, 97, 98, 99]
    description: "Internet frequency variables: 7/8/9 are valid responses in W5/W6 (a few times/year, hardly ever, never); only true non-response codes removed"
variables:
  # ===========================================================================
  # GROUP 2: Internet Access (Wave 4 only)
  # ===========================================================================
  - id: internet_access_home
    concept: social_media
    description: "Do you have access to the internet at home?"
    type: nominal
    source:
      w1: null
      w2: null
      w3: null
      w4: q47
      w5: null
      w6: null
    scale:
      min: 0
      max: 1
      labels:
        1: "Yes"
        0: "No"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: recode_binary_yes_no
    qc:
      valid_range: [0, 1]
      validate:
        - waves: [w4]
          phrase: "internet.*home|access.*internet"
  - id: internet_access_mobile
    concept: social_media
    description: "Do you have access to the internet on your mobile phone?"
    type: nominal
    source:
      w1: null
      w2: null
      w3: null
      w4: q48
      w5: null
      w6: null
    scale:
      min: 0
      max: 1
      labels:
        1: "Yes"
        0: "No"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: recode_binary_yes_no
    qc:
      valid_range: [0, 1]
      validate:
        - waves: [w4]
          phrase: "internet.*mobile|mobile.*internet"
  # ===========================================================================
  # GROUP 4: Internet for Political Information
  # ===========================================================================
  - id: internet_political_info
    concept: social_media
    description: "How often do you use the internet to find information about politics and government? (W4-only; NATIVE 6-pt frequency, higher = more frequent)"
    type: ordinal
    source:
      w1: null
      w2: null
      w3: null
      w4: q51
      w5: null
      w6: null
    scale:
      min: 1
      max: 6
      labels:
        1: "Practically never"
        2: "A few times a year"
        3: "A few times a month"
        4: "Once or twice a week"
        5: "Several times a week"
        6: "Everyday"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_6pt
        note: "⚠️ SCALE CHANGED 2026-08-11: was a 6->4 collapse (and before that the wrong collapse fn entirely — the W5 trust pole-merge). This item exists in W4 ONLY, so there is no cross-wave scale to harmonize toward and the collapse was pure information loss; the column now carries the native 6-pt, reversed from raw 1=Everyday -> 6=Practically never so higher = more frequent. Any consumer written against the old 1-4 coding (paper 01b's vp-ajcp-revisions.R) must be re-audited, not just re-run."
    qc:
      valid_range: [1, 6]
      validate:
        - waves: [w4]
          phrase: "internet.*politic|political.*information"
  # ===========================================================================
  # GROUP 1: Internet Usage Frequency
  # ===========================================================================
  - id: news_internet
    concept: social_media
    description: "How often do you use the internet, either through computer, tablet or smartphone?"
    type: ordinal
    missing:
      use_convention: internet_frequency_missing
    source:
      w1: null
      w2: q66
      w3: q45
      w4: q49
      w5: q49
      w6: q50
    scale:
      min: 1
      max: 6
      labels:
        1: "Never"
        2: "Hardly ever"
        3: "A few times a year"
        4: "At least once a month"
        5: "At least once a week"
        6: "Daily or more"
      note: |
        Harmonized 1-6 scale (higher = more frequent use). Raw scales differed by wave:
        W2/W3: 6-pt (1=almost daily, 6=never); W4: 8-pt (0=N/A, 1=several hrs/day, 8=never);
        W5/W6: 9-pt (0=no access, 1=connected all time, 9=never).
        W2/W3 'almost daily' collapses into category 6 (Daily+) — cannot distinguish
        sub-daily frequency in those waves. 0 (no access/not aware) -> NA in all waves.
    harmonize:
      default:
        method: r_function
        fn: recode_internet_w5w6_to_6pt
        note: "W5/W6: 9-pt scale; 0=no access->NA; 1-4=daily variants->6; 5->5; 6->4; 7->3; 8->2; 9->1"
      exceptions:
        w2:
          method: r_function
          fn: recode_internet_w2w3_to_6pt
          note: "W2: 6-pt scale; 0=not aware->NA; 1=almost daily->6; 6=never->1"
        w3:
          method: r_function
          fn: recode_internet_w2w3_to_6pt
          note: "W3: 6-pt scale; 1=almost daily->6; 6=never->1"
        w4:
          method: r_function
          fn: recode_internet_w4_to_6pt
          note: "W4: 8-pt scale; 0=not applicable->NA; 1-3=daily variants->6; 4->5; 5->4; 6->3; 7->2; 8->1"
    qc:
      valid_range: [1, 6]
      # Declare wave-specific structural-missing codes the recodes intentionally
      # drop. Without these declarations the audit flags the drops as coverage
      # loss; with them, the audit correctly classifies them as expected.
      # Per the recode function notes above:
      #   W2: 0 = "not aware" -> NA; 7/8/9 = DK/refused (W2/W3 are 1-6
      #     substantive so 7/8/9 are out-of-scale missing).
      #   W3: 7/8/9 = DK/refused (same as W2). (W3 has no code 0.)
      #   W4: 0 = "not applicable" -> NA.
      #   W5/W6: 0 = "no access" -> NA. 7/8/9 ARE valid scale responses
      #     in W5/W6 (a few times/year, hardly ever, never) — do NOT
      #     declare 7/8/9 missing for W5/W6.
      coverage_missing_codes_by_wave:
        w2: [0, 7, 8, 9]
        w3: [7, 8, 9]
        w4: [0]
        w5: [0]
        w6: [0]
      validate:
        - waves: [w2, w3, w4, w5, w6]
          phrase: "internet"
  # ===========================================================================
  # GROUP 6: Political Information Source
  # ===========================================================================
  - id: political_info_channel
    concept: social_media
    description: "Most important channel for finding information about politics and government"
    type: nominal
    source:
      w1: null
      w2: null
      w3: null
      w4: null
      w5: q52
      w6: q53
    scale:
      min: 1
      max: 6
      labels:
        1: "Television (airwaves, cable, online)"
        2: "Newspaper (print and online)"
        3: "Internet and social media"
        4: "Radio (airwaves and online)"
        5: "Face-to-face conversation"
        6: "Others"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
      by_wave:
        w5:
          method: recode
          mapping: {1: 1, 2: 2, 3: 3, 4: 4, 5: 6}
          note: "W5 (q52) offers only five categories and has NO face-to-face option: its 5 = 'Other channel' maps to harmonized 6 = Others, not 5 = Face-to-face. Was identity until 2026-08-11, misfiling 531 W5 respondents as face-to-face."
    qc:
      valid_range: [1, 6]
      validate:
        - waves: [w5, w6]
          phrase: "channel.*information|information.*politic"
