        0: "No"
    harmonize:
      default:
        method: r_function
        fn: recode_binary_yes_no
    qc:
      valid_range: [0, 1]
      validate:
        - waves: [w6]
          phrase: "illness|death"
  - id: covid_impact_income_loss
    concept: covid19
    description: "Did you or family suffer from loss of household income due to COVID?"
    type: nominal
    source:
      w1: null
      w2: null
      w3: null
      w4: null
      w5: null
      w6: q139c
    scale:
      min: 0
      max: 1
      labels:
        1: "Yes"
        0: "No"
    harmonize:
