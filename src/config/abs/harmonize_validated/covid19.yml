  # ===========================================================================
  # GROUP 2: Trust in Government COVID Response
  # ===========================================================================
  - id: covid_trust_govt_info
    concept: covid19
    description: "How much do you trust COVID-related information provided by the government?"
    type: ordinal
    source:
      w1: null
      w2: null
      w3: null
      w4: null
      w5: null
      w6: q141
    scale:
      min: 1
      max: 4
      labels:
        1: "No trust at all"
        2: "Not much trust"
        3: "Quite a lot of trust"
        4: "A great deal of trust"
    harmonize:
      default:
        method: r_function
        fn: safe_4pt_none
    qc:
      valid_range: [1, 4]
      validate:
        - waves: [w6]
          phrase: "trust.*covid|covid.*information"
  # ===========================================================================
  # GROUP 4: COVID Restriction Acceptance (q143a-e, W6 only)
  # Scale: 1=Always, 2=Sometimes, 3=Never → reversed so high=more accepting
  # ===========================================================================
  - id: covid_restrict_postpone_elections
    concept: covid19
    description: "When there is a public health challenge like COVID, is it justifiable for the government to postpone elections?"
    type: ordinal
    source:
      w1: null
      w2: null
      w3: null
      w4: null
      w5: null
      w6: q143a
    scale:
      min: 1
      max: 3
      labels:
        1: "Never"
        2: "Sometimes"
        3: "Always"
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_3pt
        note: "Raw: 1=Always → 3=Never; reverse so high=more accepting of restrictions"
    qc:
      valid_range: [1, 3]
      validate:
        - waves: [w6]
          phrase: "postpone.*election"
