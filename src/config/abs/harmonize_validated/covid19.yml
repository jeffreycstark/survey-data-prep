      max: 1
      labels:
        1: "Yes"
        0: "No"
    harmonize:
      default:
        method: r_function
        fn: recode_binary_yes_no
    qc:
      valid_range: [0, 1]
      validate:
        - waves: [w6]
          phrase: "education"
  - id: covid_impact_illness
    concept: covid19
    description: "Did you or family suffer from serious illness or death due to COVID?"
    type: nominal
