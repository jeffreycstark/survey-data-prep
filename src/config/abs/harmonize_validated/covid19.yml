  - id: covid_livelihood_impact
    concept: covid19
    description: "How serious is COVID's negative impact on your family's livelihood?"
    type: ordinal
    source:
      w1: null
      w2: null
      w3: null
      w4: null
      w5: null
      w6: q140
    scale:
      min: 1
      max: 4
      labels:
        1: "Not serious at all"
        2: "Not very serious"
        3: "Somewhat serious"
        4: "Very serious"
    harmonize:
      default:
        method: r_function
        fn: safe_4pt_none
    qc:
      valid_range: [1, 4]
      validate:
