    qc:
      valid_range: [0, 1]
      validate:
        - waves: [w6]
          phrase: "household income"
  - id: covid_impact_job_loss
    concept: covid19
    description: "Did you or family suffer from loss of job due to COVID?"
    type: nominal
    source:
      w1: null
      w2: null
      w3: null
      w4: null
      w5: null
      w6: q139b
    scale:
      min: 0
      max: 1
