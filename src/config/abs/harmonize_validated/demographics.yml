      codes: [996, 998, 999, 9998, 9999]
    source:
      w1: se006
      w2: se6
      w3: se6
      w4: se6
      w5: SE6
      w6: se6
    scale:
      min: 1
      max: 90
      labels:
        1: "Traditional/Folk religion"
        10: "Roman Catholic"
        20: "Protestant"
        40: "Islam"
        50: "Hindu"
        60: "Buddhist"
        75: "Shinto"
        76: "Taoism"
        78: "Confucianism"
        80: "Other"
        90: "None"
    note: "Detailed religion codes vary by country/wave - see codebook for full list"
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 9999]
      validate:
        - waves: [w1, w2, w3, w4, w5, w6]
