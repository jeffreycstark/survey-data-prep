  # ===========================================================================
  # GROUP 1: Basic Demographics
  # ===========================================================================
  - id: urban_rural
    concept: demographics
    description: "Urban or rural residence"
    type: nominal
    source:
      w1: level3
      w2: level3
      w3: level3
      w4: level
      w5: Level
      w6: level
    scale:
      min: 0
      max: 1
      labels:
        1: "Urban"
        0: "Rural"
    harmonize:
      default:
        method: r_function
        fn: recode_urban_rural_binary
        note: "W1-W3 coded 1=urban, 2=rural; map to 1=Urban, 0=Rural"
      exceptions:
        w4:
          method: r_function
          fn: recode_urban_rural_reversed_binary
          note: "W4 coded 1=Rural, 2=Urban; map to 1=Urban, 0=Rural"
        w5:
          method: r_function
          fn: recode_urban_rural_reversed_binary
          note: "W5 coded 1=Rural, 2=Urban; map to 1=Urban, 0=Rural"
        w6:
          method: r_function
          fn: recode_urban_rural_reversed_binary
          note: "W6 coded 1=Rural, 2=Urban; map to 1=Urban, 0=Rural"
    qc:
      valid_range: [0, 1]
      validate:
        - waves: [w1, w2, w3, w4, w5, w6]
          phrase: "urban|rural"
