    source:
      w1: null
      w2: se7a
      w3: se7a
      w4: se7a
      w5: SE7A
      w6: se7a
    scale:
      min: 1
      max: 4
      labels:
        1: "Very religious"
        2: "Moderately religious"
        3: "Lightly religious"
        4: "Not religious at all"
    harmonize:
      default:
        method: identity
        note: "Higher values = less religious"
    qc:
      valid_range: [1, 4]
      validate:
        - waves: [w2, w3, w4, w5, w6]
          phrase: "describe.*religious"
  - id: seeking_employment
    concept: demographics
    description: "Are you currently seeking employment?"
    type: nominal
    missing:
      use_convention: treat_as_na
    source:
      w1: null
      w2: null
      w3: se9d
      w4: se9d
      w5: SE9D
      w6: se9d
    scale:
      min: 1
      max: 3
      labels:
        1: "Yes"
        2: "No"
