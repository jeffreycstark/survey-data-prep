  # ===========================================================================
  # GROUP 11: Binary Gate Variables — Ever Participated (0=Never, 1=Ever done)
  #
  # These derive from the same source variables as the ordinal action_contact_*
  # items but use wave-appropriate recoding to produce full-sample binary
  # indicators (N = all respondents, not just those who said "yes" to a filter).
  #
  # Raw scale structures:
  #   W1:    1=Once, 2=More than once, 9=Never done (9 kept via contact_binary_missing)
  #   W2:    1=Once, 2=More than once, 3=Never
  #   W3:    0=Never Done, 1=Once, 2=More than once (0 kept via contact_binary_missing)
  #   W4:    1=More than once, 2=Once, 3=Never
  #   W5/W6: 1=>3×, 2=2-3×, 3=once, 4=might, 5=would never (raw reversed; 0=N/A→NA)
  #
  # NOTE: The existing action_contact_* ordinal items are miscoded for W1–W4
  # (wrong scale structure assumed). These gate variables are correctly specified
  # and should be preferred for cross-wave participation analysis.
  # ===========================================================================

  - id: gate_contact_elected
    concept: political_action
    description: "Ever contacted elected officials or legislative representatives (binary)"
    type: nominal
    missing:
      use_convention: contact_binary_missing
    source:
      w1: q075
      w2: q81
      w3: q64
      w4: q69
      w5: q70
      w6: q68
    scale:
      min: 0
      max: 1
      labels:
        0: "Never done"
        1: "Done at least once"
    editorial_note: |
      QUESTION WORDING NON-EQUIVALENCE — W2 vs W3/W4/W5/W6:
      W2 (q81): "Contacted elected officials or representatives at any level" — broad framing,
        no motivational qualifier.
      W3 (q64): "Contacted elected officials or legislative representative because of personal/
        family/neighborhood problems" — problem-motivated framing, definitionally narrower.
      W4–W6: Return to broad "at any level" framing (no motivation qualifier).
      W3 produces substantially lower rates (Cambodia: ~4%) than W2 (~33%) or W4 (~5%).
      W4 (broad framing) also shows ~5%, confirming the drop is not coding error — W3's
      problem framing genuinely suppresses reported participation.
      RECOMMENDED USE: Use W4–W6 as primary cross-wave comparison series. W2 can serve as
      a pre-collapse baseline in footnotes with explicit caveat that W2/W3 framings differ.
      W3 rates are interpretable as "problem-motivated contact" not general contact — valid
      as a trough data point with appropriate labeling.
    harmonize:
      default:
        method: r_function
        fn: recode_contact_to_binary_5pt
        note: "W5/W6: raw 1-3 (ever done) → 1; raw 4-5 (never done) → 0"
      exceptions:
        w1:
          method: r_function
          fn: recode_contact_to_binary_w1
          note: "W1: raw 9 (Never done) → 0; raw 1,2 (done) → 1"
        w2:
          method: r_function
          fn: recode_contact_to_binary_w2w4
          note: "W2: raw 1,2 (done) → 1; raw 3 (Never) → 0"
        w3:
          method: r_function
          fn: recode_contact_to_binary_w3
          note: "W3: raw 0 (Never Done) → 0; raw 1,2 (done) → 1"
        w4:
          method: r_function
          fn: recode_contact_to_binary_w2w4
          note: "W4: raw 1,2 (done) → 1; raw 3 (Never) → 0"
    qc:
      valid_range: [0, 1]
      # contact_binary_missing keeps codes 0 and 9 live so the wave-specific
      # recode functions can interpret them. In W2-W6 code 9 = "Decline to
      # answer" (missing) and code 0 = "Not applicable" (W6, very rare),
      # both correctly mapped to NA by the recode functions. Declare those
      # wave-specific drops here so the coverage check sees them as intent.
      coverage_missing_codes_by_wave:
        w2: [0, 9]
        w3: [9]
        w4: [9]
        w5: [9]
        w6: [0, 9]
      validate:
        - waves: [w1, w2, w3, w4, w5, w6]
          phrase: "elected.*official|legislative.*representative"

  - id: gate_contact_civil_servant
    concept: political_action
    description: "Ever contacted civil servants or government officials (binary)"
    type: nominal
    missing:
      use_convention: contact_binary_missing
    source:
      w1: q073
      w2: q79
      w3: q65
      w4: q70
      w5: q71
      w6: q69
    scale:
      min: 0
      max: 1
      labels:
        0: "Never done"
        1: "Done at least once"
    editorial_note: |
      TWO QUESTION WORDING NON-EQUIVALENCES — treat as supplementary to gate_contact_elected:
      NON-EQUIVALENCE 1 — MOTIVATIONAL FRAMING (W3 only):
        W2/W4–W6: Broad framing, no motivational qualifier.
        W3 (q65): "because of personal/family/neighborhood problems" — same problem-motivated
          framing as W3 elected officials item; definitionally narrower across all contact items.
      NON-EQUIVALENCE 2 — CONCEPT SHIFT (W2 vs W3/W4 vs W6):
        W2 (q79): "Contacted government (administrative) official" — administrative/bureaucratic
          staff (civil servant proper).
        W3 (q65) / W4 (q70): "Contacted officials at higher level" — escalation framing;
          measures contact with senior/executive officials, not frontline civil servants.
        W5 (q71): "Contacted government officials" — intermediate framing.
        W6 (q69): "Contacted civil servants or officials" — broadest framing, most inclusive.
      RECOMMENDED USE: Use as supplementary evidence only. gate_contact_elected is the cleaner
      series for Cambodia analysis (one non-equivalence vs two here). If civil servant contact
      is substantively required, restrict primary comparison to W5–W6 where framing is closest,
      and note W2/W3/W4 limitations explicitly. Do not use W3 as a direct comparator to any
      other wave on this item.
    harmonize:
      default:
        method: r_function
        fn: recode_contact_to_binary_5pt
        note: "W5/W6: raw 1-3 → 1; raw 4-5 → 0"
      exceptions:
        w1:
          method: r_function
          fn: recode_contact_to_binary_w1
          note: "W1: raw 9 → 0; raw 1,2 → 1"
        w2:
          method: r_function
          fn: recode_contact_to_binary_w2w4
          note: "W2: raw 1,2 → 1; raw 3 → 0"
        w3:
          method: r_function
          fn: recode_contact_to_binary_w3
          note: "W3: raw 0 → 0; raw 1,2 → 1"
        w4:
          method: r_function
          fn: recode_contact_to_binary_w2w4
          note: "W4: raw 1,2 → 1; raw 3 → 0"
    qc:
      valid_range: [0, 1]
      coverage_missing_codes_by_wave:
        w2: [0, 9]
        w3: [9]
        w4: [9]
        w5: [9]
        w6: [0, 9]
      validate:
        - waves: [w1, w2, w3, w4, w5, w6]
          phrase: "civil servant|official"

  - id: gate_contact_influential
    concept: political_action
    description: "Ever contacted traditional/community leaders or other influential people outside government (binary)"
    type: nominal
    missing:
      use_convention: contact_binary_missing
    source:
      w1: null
      w2: q84
      w3: q66
      w4: q71
      w5: q72
      w6: q70
    scale:
      min: 0
      max: 1
      labels:
        0: "Never done"
        1: "Done at least once"
    editorial_note: |
      THREE NON-EQUIVALENCES — most complex gate variable; use with caution cross-nationally:
      NON-EQUIVALENCE 1 — W3 PROBLEM FRAMING:
        W3 (q66): "Contacted traditional leaders/community leaders." — q66 is within the q64
          problem-motivated battery ("because of personal, family, or neighborhood problems,
          or problems with government officials and policies"). Same contamination as all W3
          contact items. W3 rates will be suppressed.
      NON-EQUIVALENCE 2 — CONCEPT BROADENING W5/W6 vs W2/W3/W4:
        W2 (q84) / W3 (q66) / W4 (q71): "Contacted traditional leaders/community leaders"
          — concept is restricted to traditional/community leaders specifically.
        W5 (q72) / W6 (q70): "Contacted other influential people outside the government,
          such as traditional leaders/community leaders." — concept broadened to any
          influential non-government figure; traditional/community leaders cited as examples
          only. W5/W6 rates may be inflated relative to W2/W3/W4.
      NON-EQUIVALENCE 3 — W2 WITHIN-WAVE COUNTRY SUBSTITUTION (FIXED IN PIPELINE):
        W2 (q84) includes country-specific concept substitutions in the questionnaire:
          Indonesia: item reads "Mass media" (not traditional leaders at all).
          Taiwan / Hong Kong: item reads "Acquaintances in the government."
          These are entirely different concepts per country, making W2 cross-national
          comparison unreliable for this item. Cambodia was not in W2 (W2=null for Cambodia),
          so this does not affect Cambodia-specific analysis.
          FIX: 2_harmonize_all.R post-hoc sets gate_contact_influential to NA for
          Indonesia (country=9), Taiwan (country=7), and Hong Kong (country=2) in W2.
      RECOMMENDED USE: W4 only as a clean, concept-consistent, uncontaminated data point
      for within-series comparison. W5–W6 are internally consistent but conceptually broader.
      Avoid cross-wave comparisons that span the W4→W5 concept shift. W3 and W2 require
      explicit caveats. Consider excluding this variable from primary Cambodia analysis.
    harmonize:
      default:
        method: r_function
        fn: recode_contact_to_binary_5pt
        note: "W5/W6: raw 1-3 → 1; raw 4-5 → 0"
      exceptions:
        w2:
          method: r_function
          fn: recode_contact_to_binary_w2w4
          note: "W2: raw 1,2 → 1; raw 3 → 0"
        w3:
          method: r_function
          fn: recode_contact_to_binary_w3
          note: "W3: raw 0 → 0; raw 1,2 → 1"
        w4:
          method: r_function
          fn: recode_contact_to_binary_w2w4
          note: "W4: raw 1,2 → 1; raw 3 → 0"
    qc:
      valid_range: [0, 1]
      coverage_missing_codes_by_wave:
        # NOTE: W2 30% loss is from a SEPARATE bug — country-specific concept
        # substitution in HK/Taiwan/Indonesia (see editorial_note above) is
        # corrected by a post-hoc NA assignment in 2_harmonize_all.R. The
        # audit cannot see the country-level exclusion. The [0, 9] declaration
        # here handles the universal code-9 drops; the country-specific cells
        # need an engine-level skip_coverage_check_by_wave (deferred).
        w2: [0, 9]
        w3: [9]
        w4: [9]
        w5: [9]
        w6: [0, 9]
      validate:
        - waves: [w2, w3, w4, w5, w6]
          phrase: "influential|traditional leader|community leader"

