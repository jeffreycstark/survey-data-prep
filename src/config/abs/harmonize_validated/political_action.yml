# Political Action - Validated YAML (v2)
# Variables measuring political participation, civic engagement, and voting behavior
# NOTE: party_voted_for excluded due to country-specific codes (100s of values)
# Validated 2025-01-11

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-1, 0, 7, 8, 9, 97, 98, 99, 1099]
    description: "Standard missing codes"
  # W1-only participation items scored 1=once, 2=more than once, 9=never done.
  # 9 is the modal substantive response, not a missing code (ABS W1 codebook
  # flags only 97/98/99). The variables' own scale.labels already say so.
  treat_as_na_w1_never_done:
    codes: [-1, 0, 7, 8, 97, 98, 99, 1099]
    description: "W1 participation items: keeps 9='Never done' as a valid response"
  treat_as_na_winning_losing:
    codes: [-1, 0, 3, 7, 8, 9, 97, 98, 99, 1099]
    description: "Standard missing codes plus 3=not applicable/other in winner-loser items"
  contact_binary_missing:
    codes: [-1, 7, 8, 97, 98, 99, 1099]
    description: |
      Binary gate participation items: keeps 0 and 9 as live values so recode functions
      can interpret them semantically. W1: 9=Never done (valid); W3: 0=Never Done (valid);
      W2/W4: 3=Never (already valid under treat_as_na); W5/W6: 0=N/A, falls to NA in recode.
      True non-response codes (7=don't understand, 8=can't choose, 97/98/99=refuse) → NA.
variables:
  - id: action_contact_civil_servant
    concept: political_action
    description: "In the past three years, contacted civil servants or officials"
    type: ordinal
    source:
      w1: q073
      w2: q79
      w3: q65
      w4: q70
      w5: q71
      w6: q69
    scale:
      min: 1
      max: 5
      labels:
        1: "Would never do"
        2: "Have not done, but might"
        3: "Have done once"
        4: "Have done 2-3 times"
        5: "Have done >3 times"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_5pt
    qc:
      valid_range: [1, 5]
      validate:
        - waves: [w1, w2, w3, w4, w5, w6]
          phrase: "civil servant|official"
  # ===========================================================================
  # GROUP 1: Contacting Officials / Representatives
  # Scale: 1-5 (1=done >3 times, 5=would never do) - REVERSED so higher = more active
  # ===========================================================================
