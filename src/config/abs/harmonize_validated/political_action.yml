    source:
      w1: null
      w2: q87
      w3: q70
      w4: q75
      w5: q74
      w6: q72
    scale:
      min: 0
      max: 1
      labels:
        0: "Never done"
        1: "Done at least once"
    editorial_note: |
      CONCEPT SHIFT — W2/W3/W4 vs W5/W6 (NO problem-framing issue in any wave):
      W3 NOTE: q70 is in the q69 citizen-action battery ("Here is a list of actions that
        people sometimes take as citizens..."), NOT in the q64 problem-motivated battery.
        W3 framing is equivalent to W2/W4 for this item.
      W2 (q87) / W3 (q70) / W4 (q75): "Got together with others to raise an issue or
        sign a petition" — broader concept capturing both collective mobilization (issue
        raising with others) and individual signing.
      W5 (q74): "Signed a paper petition" — narrowed to individual paper signing only;
        collective "raise an issue" action dropped entirely.
      W6 (q72): "Signed a paper or online petition?" — adds online modality vs W5 but
        retains the narrower petition-only concept; collective action still excluded.
      RECOMMENDED USE: W2/W3/W4 are directly comparable (consistent wording). W5/W6 are
      comparable to each other. Cross-series comparison (W2–W4 vs W5–W6) should note that
      W5/W6 rates may be higher (online petition lowers friction) or lower (drops collective
      mobilization component) — direction is ambiguous. Use W2–W4 as preferred series for
      Cambodia analysis if collective action dimension matters.
    harmonize:
      default:
        method: r_function
        fn: recode_contact_to_binary_5pt
        note: "W5/W6: raw 1-3 → 1; raw 4-5 → 0"
      exceptions:
        w2:
          method: r_function
          fn: recode_contact_to_binary_w2w4
          note: "W2: raw 1,2 → 1; raw 3 → 0"
        w3:
          method: r_function
          fn: recode_contact_to_binary_w3
          note: "W3: raw 0 → 0; raw 1,2 → 1"
        w4:
          method: r_function
          fn: recode_contact_to_binary_w2w4
          note: "W4: raw 1,2 → 1; raw 3 → 0"
    qc:
      valid_range: [0, 1]
      coverage_missing_codes_by_wave:
        w2: [0, 9]
        w3: [9]
        w4: [9]
        w5: [9]
        w6: [0, 9]
      validate:
        - waves: [w2, w3, w4, w5, w6]
          phrase: "petition|raise.*issue"

