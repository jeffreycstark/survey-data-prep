# WVS Turkey Sensitivity Gradient Analysis
# Harmonization spec for Wave 6 (2011) → Wave 7 (2018)
# Pre/post July 2016 coup attempt and subsequent purges
#
# CODING NOTES:
# WVS confidence items: 1=A great deal, 2=Quite a lot, 3=Not very much, 4=None at all
# Target direction: higher = more trust (matching ABS convention)
# Therefore ALL confidence items need safe_reverse_4pt
#
# Democracy items (1-10): already intuitive (higher = more democratic/important/satisfied)
# EXCEPTION: V142 in W6 Turkey uses a 1-4 scale, not 1-10. See note on satisfaction item.
#
# Human rights (V143/Q253): 1=A great deal of respect ... 4=No respect at all
# Needs reversal to match intuitive direction (higher = more respect)
#
# Country filter: V2=792 (W6), B_COUNTRY=792 (W7)
# Weight: V258 (W6), W_WEIGHT (W7)

missing_conventions:
  treat_as_na:
    codes: [-1, -2, -3, -4, -5]
    description: "WVS standard missing codes (negative values)"

variables:

  # ============================================================
  # HIGH-SENSITIVITY TRUST ITEMS (Gradient Test)
  # ============================================================

  - id: wvs_trust_police
    concept: institutional_trust
    description: "Confidence in the police"
    type: ordinal
    source:
      wvs6: V113
      wvs7: Q69
    scale:
      min: 1
      max: 4
      labels:
        1: "None at all"
        2: "Not very much"
        3: "Quite a lot"
        4: "A great deal"
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_4pt
    qc:
      valid_range: [1, 4]
      validate:
        - waves: [wvs6, wvs7]
          phrase: "police"
    tags: [gradient, high_sensitivity]

