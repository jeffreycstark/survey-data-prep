  # ============================================================
  # DEMOCRACY / LOW-SENSITIVITY ITEMS
  # ============================================================

  - id: wvs_democracy_importance
    concept: democracy
    description: "How important is it to live in a democratically governed country (1-10)"
    type: ordinal
    source:
      wvs6: V140
      wvs7: Q250
    scale:
      min: 1
      max: 10
      labels:
        1: "Not at all important"
        10: "Absolutely important"
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 10]
      validate:
        - waves: [wvs6, wvs7]
          phrase: "democrat"
    tags: [gradient, low_sensitivity, critical_citizens]

  - id: wvs_democracy_evaluation
    concept: democracy
    description: "How democratically is this country being governed today (1-10)"
    type: ordinal
    source:
      wvs6: V141
      wvs7: Q251
    scale:
      min: 1
      max: 10
      labels:
        1: "Not at all democratic"
        10: "Completely democratic"
    harmonize:
      default:
