    type: ordinal
    note: >
      Turkey-specific sensitivity is ambiguous: military perpetrated the 2016 coup
      but was subsequently purged and subordinated to civilian (regime) control.
      Respondents may fear expressing too much trust (signals coup sympathy) or
      too little (signals opposition to the government that defeated the coup).
    source:
      wvs6: V109
      wvs7: Q65
    scale:
      min: 1
      max: 4
      labels:
        1: "None at all"
        2: "Not very much"
        3: "Quite a lot"
