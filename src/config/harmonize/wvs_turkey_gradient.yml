      validate:
        - waves: [wvs6, wvs7]
          phrase: "democrat"
    tags: [gradient, low_sensitivity]

  - id: wvs_system_satisfaction
    concept: democracy
    description: "Satisfaction with how the political system is functioning (1-10 in W7; 1-4 in W6 Turkey)"
    type: ordinal
    note: >
      CRITICAL: Turkey W6 (V142) uses a 1-4 scale, but W7 (Q252) uses 1-10.
      This appears to be a country-specific deviation in the W6 Turkish questionnaire.
      Options: (a) standardize both to z-scores, (b) use only for direction comparison,
      or (c) rescale W6 1-4 to 1-10 range. Recommend z-score approach for effect
      size computation to avoid scale artifacts.
    source:
      wvs6: V142
      wvs7: Q252
    scale:
      min: 1
      max: 10
      labels:
        1: "Not satisfied at all"
        10: "Completely satisfied"
    harmonize:
      default:
        method: identity
      exceptions:
        wvs6:
          method: r_function
          fn: rescale_4pt_to_10pt
          note: "Turkey W6 uses 1-4 scale; rescale or z-score"
    qc:
      valid_range: [1, 10]
    tags: [gradient, low_sensitivity, critical_citizens]

  - id: wvs_human_rights
    concept: democracy
    description: "How much respect is there for individual human rights (1-4)"
    type: ordinal
    note: >
      Scale: 1=A great deal of respect, 4=No respect at all.
      Reverse so higher = more respect.
    source:
      wvs6: V143
      wvs7: Q253
    scale:
      min: 1
      max: 4
      labels:
        1: "No respect at all"
        2: "Not much respect"
        3: "Some respect"
        4: "A great deal of respect"
    harmonize:
