# Construct anchor: economic_evaluations (ABS-anchored, ticket D9)
#
# Third construct anchor in the Phase D series (after democratic_attitudes
# and institutional_trust). Subjective evaluations of economic conditions
# at sociotropic (national) and pocketbook (household/family) target levels,
# across present, retrospective, and prospective time horizons. The
# comparative-political-behavior literature treats these items as a tight
# unidimensional cluster: respondents who say the national economy is good
# now also tend to say it was good a year ago, will be good in a year, and
# that their family is doing well — within-respondent correlations are
# typically 0.3-0.6 (Lewis-Beck & Stegmaier 2000; Duch & Stevenson 2008).
#
# Anchor is `econ_national_now` (current national economic conditions).
# This id is declared in ABS only (src/config/abs/harmonize/
# economy.yml). Other surveys use the parallel id `econ_national_current`
# (arab-barometer, afro, lbs); the cross-survey loaders below use the
# `surveys:` field to declare those siblings without forcing a separate
# anchor file. The diagnostic runs `--survey abs` against this anchor; the
# cross-survey rows will be `skip` until D3 is extended to multi-survey
# runs.
#
# DRAFT for Jeff's review on first pass; expected to demote a small number
# of loaders to `either` after the first D3 run if the empirical pattern
# is strongly against theory (per ticket D9 instructions).

schema_version: 1
construct: economic_evaluations
last_reviewed: "2026-05-10"

description: >
  Subjective economic evaluations: how respondents assess current,
  retrospective, and prospective economic conditions at the national
  (sociotropic) and household (pocketbook) levels. The literature treats
  this as a tight unidimensional cluster — sociotropic and pocketbook,
  retrospective and prospective evaluations covary strongly within
  respondent (Kinder & Kiewiet 1981; Lewis-Beck & Stegmaier 2000; Duch &
  Stevenson 2008). The anchor is `econ_national_now` because retrospective
  sociotropic evaluation of the current national economy is the most
  theory-central item in economic-voting research and has the widest
  cross-survey coverage. All harmonized items run higher = better economic
  evaluation, so most loaders are `positive`. The single `negative` loader
  is `econ_worried_lose_income`, which inverts: higher = more worry, which
  should anti-correlate with positive economic mood.

notes:
  - >
    `econ_national_now` is the ABS-declared id for the current-national-
    economy item. Three other surveys (arab-barometer, afro, lbs) declare
    a parallel item under the id `econ_national_current` instead; that
    naming inconsistency is a harmonization-spec issue, not an anchor-file
    issue. This file therefore anchors on the ABS id and registers the
    cross-survey siblings as separate loaders gated by `surveys:`. A
    follow-up cleanup task could rename either side so a single anchor
    works across surveys.
  - >
    Brief-suggested loader ids `econ_family_future`, `econ_national_past`,
    `econ_family_past`, and `gov_economic_performance`/`gov_handle_economy`
    are NOT declared in ABS production specs. The closest declared analogs
    are: `econ_family_outlook` (pocketbook prospective, 5-year horizon),
    `econ_change_1yr` (sociotropic retrospective, 1-year horizon),
    `econ_family_change` (pocketbook retrospective, 5-year horizon),
    `gov_basic_necessities` (governance perception of basic-needs
    provision — closest ABS-declared item to government economic
    performance). `econ_country_past`/`econ_family_past` exist in
    `src/config/abs/harmonize/regime_nostalgia.yml` but that file is
    not in `harmonize/`, so those ids are not in production
    output. `econ_national_past` exists in arab-barometer and is included
    here gated by `surveys:`.
  - >
    All loaders carry `expected_sign: positive` except `econ_worried_lose_income`
    (negative). The unidimensional-cluster prediction means a sign
    disagreement on any positive loader is most likely a reverse-coding bug
    in the source spec — exactly the silent-killer pattern Layer 4 is
    designed to catch.
  - >
    Per-wave coverage gaps are encoded via `waves:`. Several ABS items only
    appear from W4/W5 onward (`econ_distribution_fair`, `econ_generation_opportunity`,
    `econ_next_generation_life`, `econ_worried_lose_income`); restricting
    those loaders prevents the diagnostic from misreporting legitimate
    absence as a missing-loader error.
  - >
    First D3 run (2026-05-10) on ABS produced 7 sign disagreements out of
    778 (variable x wave x country) rows; all 7 are isolated country-wave
    cells, NOT systematic flips. Pooled correlations across countries are
    uniformly the expected sign for every variable in every wave. The
    most prominent disagreement is Thailand W1 on `econ_outlook_1yr`
    (r=-0.33) and `econ_family_outlook` (r=-0.23): in Thailand 2001
    (post-1997 Asian Financial Crisis recovery), respondents who report
    the current economy is good simultaneously expect it to worsen — a
    substantively interpretable post-crisis-mood-reversion pattern, not
    a coding bug. The remaining 5 disagreements have |r| < 0.13 (effectively
    noise around zero). Loaders are kept `positive` because the pooled
    construct-validity signal is strong; the diagnostic is doing its job
    surfacing country-wave anomalies for human inspection.

anchor:
  variable: econ_national_now
  expected_direction: positive
  notes: >
    Higher harmonized value = better national economic conditions. Per
    `src/config/abs/harmonize/economy.yml`, W1-W2 raw was
    1=Very bad → 5=Very good (already in standard direction); W3-W6 raw
    was reversed (1=Very good → 5=Very bad) and is reverse-coded by
    safe_reverse_5pt during harmonization. After harmonization the
    direction is uniform across W1-W6, so no per_wave override is needed.
    If the harmonization itself is wrong for any wave, that is a Layer 1/3
    finding, not an anchor-file finding.

loaders:
  # ============================================================================
  # POCKETBOOK-CURRENT, SOCIOTROPIC-PROSPECTIVE/RETROSPECTIVE, POCKETBOOK-
  # PROSPECTIVE/RETROSPECTIVE: the standard four-corner economic-voting
  # battery (Lewis-Beck & Stegmaier 2000). All `positive` because all are
  # harmonized to higher = better evaluation.
  # ============================================================================

  - id: econ_family_now
    expected_sign: positive
    justification: >
      Pocketbook current evaluation. Sociotropic-pocketbook correlations
      are the canonical within-respondent diagnostic for the economic
      evaluations cluster (Kinder & Kiewiet 1981); this loader is the
      tightest expected loading on the anchor.

  - id: econ_outlook_1yr
    expected_sign: positive
    justification: >
      Sociotropic prospective evaluation (national economy in 1 year).
      Prospective and retrospective sociotropic items load on the same
      latent dimension as current sociotropic evaluation (Duch & Stevenson
      2008, ch. 3); same target level (national), different time horizon.

  - id: econ_family_outlook
    expected_sign: positive
    justification: >
      Pocketbook prospective evaluation (family economic situation in
      5 years). Loads with current pocketbook on the household-economic-
      mood dimension; expected slightly weaker than `econ_family_now`
      due to the longer horizon and forecast uncertainty.

  - id: econ_change_1yr
    expected_sign: positive
    justification: >
      Sociotropic retrospective evaluation (national economy compared to
      1 year ago). Retrospective sociotropic is the most theory-central
      economic-voting item (Fiorina 1981); expected to load tightly with
      the anchor's current-national evaluation.

  - id: econ_family_change
    expected_sign: positive
    justification: >
      Pocketbook retrospective evaluation (family situation compared to
      5 years ago). Loads on the household-economic-trajectory dimension;
      expected positive but somewhat weaker than `econ_family_now`
      because the 5-year horizon dilutes within-respondent consistency.

  # ============================================================================
  # ADJACENT EVALUATIONS: household income adequacy, perceived govt
  # provision of basic necessities, intergenerational mobility,
  # distributional fairness. Theoretically tight with sociotropic now.
  # ============================================================================

  - id: hh_income_sat
    expected_sign: positive
    justification: >
      Whether household income covers needs (1=does not cover, great
      difficulties → 4=covers well, can save). Direct proxy for the
      household's financial position; expected to covary positively with
      sociotropic-current evaluation as the standard household-finances
      vs. country-economy linkage in the economic-voting literature
      (Sanders 2000).
    waves: [w2, w3, w4, w5, w6]
    notes: >
      Not asked in W1 per democracy_satisfaction.yml source mapping.

  - id: gov_basic_necessities
    expected_sign: positive
    justification: >
      Perception that the government provides basic necessities (food,
      clothes, shelter); the closest ABS-declared item to a government-
      economic-performance evaluation. Expected to covary positively with
      sociotropic evaluation: respondents who say the economy is good are
      more likely to credit the government with delivering basic provision
      (Anderson 2007; performance-evaluation cluster).
    waves: [w2, w3, w4, w5, w6]
    notes: >
      Not asked in W1 per governance.yml source mapping.

  - id: econ_next_generation_life
    expected_sign: positive
    justification: >
      Will the next generation have a better or worse life than ours?
      Long-horizon prospective evaluation; loads with current sociotropic
      mood as part of broader economic optimism (Inglehart 1990).
    waves: [w5, w6]
    notes: >
      Asked only in W5/W6 per economic_attitudes.yml source mapping.

  - id: econ_generation_opportunity
    expected_sign: positive
    justification: >
      Compared to parents' generation, does my generation have more or
      fewer opportunities? Intergenerational-mobility item; positively
      correlates with sociotropic mood as part of broader economic
      optimism, though weaker than direct economic-evaluation items.
    waves: [w4, w5, w6]
    notes: >
      Asked only W4-W6 per economic_attitudes.yml source mapping.

  - id: econ_distribution_fair
    expected_sign: positive
    justification: >
      Perception of income distribution fairness (1=very unfair → 4=very
      fair after harmonization). Loads weakly-positively with sociotropic
      mood — respondents satisfied with the economy are also more likely
      to view its distribution as fair, even controlling for objective
      inequality (Hauser & Norton 2017). Expected weaker loading than
      direct evaluation items.
    waves: [w4, w5, w6]
    min_correlation: 0.05
    notes: >
      Asked only W4-W6 per economic_attitudes.yml source mapping.

  # ============================================================================
  # NEGATIVE LOADER: economic worry inverts (high = more worry).
  # ============================================================================

  - id: econ_worried_lose_income
    expected_sign: negative
    justification: >
      Worry about losing major income source (1=not worried → 4=very
      worried after harmonization). Should anti-correlate with positive
      sociotropic evaluation: respondents who say the economy is good
      report less income-loss anxiety (Mughan 2007's economic-insecurity
      literature). Sign disagreement here is a high-priority Layer 4
      finding pointing at a reverse-coding bug in either spec.
    waves: [w5, w6]
    notes: >
      Asked only in W5/W6 per economic_attitudes.yml source mapping.

  # ============================================================================
  # CROSS-SURVEY LOADERS: parallel id `econ_national_current` exists in
  # arab-barometer, afro, and lbs; `econ_national_future` and
  # `econ_national_past` in arab-barometer. These are gated by `surveys:`
  # so they are SKIPPED when the diagnostic runs against ABS, and would
  # be evaluated only when the diagnostic is extended to multi-survey
  # runs. They are included here so a future cross-survey diagnostic
  # has them already declared.
  # ============================================================================

  - id: econ_national_current
    expected_sign: positive
    surveys: [arab-barometer, afro, lbs]
    justification: >
      Cross-survey sibling of `econ_national_now`: same construct, same
      direction (higher=better), declared under a different id in non-ABS
      surveys. When the diagnostic runs against arab-barometer/afro/lbs,
      this is the natural sibling of the anchor; it should load near-
      perfectly because it measures the same object on the same scale
      (Lewis-Beck & Stegmaier 2000).

  - id: econ_national_future
    expected_sign: positive
    surveys: [arab-barometer]
    justification: >
      Arab Barometer's prospective sociotropic item (national economy
      in 2-5 years). Same theoretical loading as ABS `econ_outlook_1yr`:
      prospective sociotropic loads with current sociotropic on the
      national-economic-mood dimension (Duch & Stevenson 2008).
