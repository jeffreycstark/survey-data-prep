# KIPA Corruption — Respondent demographics
#
# Variable names shift across three naming regimes:
#   - cumulative (2004-2007):  sex / age / edu / inc
#   - 2008 + 2022-2023:        dq1 / dq2 / dq3 / dq4
#   - 2009-2021:               sex / age (or age_re) / edu / inc
#
# For age, the 2013-2016 waves have BOTH a continuous-years variable (age) AND
# a categorical 1-5 variable (age_re). We use the categorical throughout for
# cross-wave comparability; continuous-years is not harmonized here.
#
# 2011-2012 also have age1 (continuous) alongside age (categorical).

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-8, -9, 8, 9, 88, 99]
    description: "KIPA corruption: common sentinel missing codes"
  treat_as_na_income:
    codes: [-8, -9, 88, 99]
    description: "For inc/dq4, where 8 is a REAL top income bracket from 2008 on (600만원+ / 700만원+; ~1,150 respondents) and 9 is a REAL bracket in 2022-23 (800~900만원). Raw-label-verified 2026-08-08. The 무응답 meaning of 9 in 2004-2021 is retired per wave via valid_range_by_wave + coverage_missing_codes_by_wave instead. 99=모름/무응답 (2022)."

variables:
  - id: sex
    concept: demographics
    description: "Respondent sex (1=male, 2=female)"
    type: binary
    source:
      w2004: sex
      w2005: sex
      w2006: sex
      w2007: sex
      w2008: dq1
      w2009: sex
      w2010: sex
      w2011: sex
      w2012: sex
      w2013: sex
      w2014: sex
      w2015: sex
      w2016: sex
      w2017: sex
      w2018: sex
      w2019: sex
      w2020: sex
      w2021: sex
      w2022: dq1
      w2023: dq1
    scale: {min: 1, max: 2, labels: {1: "Male", 2: "Female"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 2]

  - id: age_cat
    concept: demographics
    description: "Respondent age in categorical bands (typically 5-6 categories per KIPA coding; 20s/30s/40s/50s/60+, some waves split 60+ into a 6th band)"
    type: ordinal
    note: "Categorical age. 2013-2016 switched the primary `age` variable to continuous years and added `age_re` as the categorical — we use `age_re` for those waves. 2011-2012 also have `age1` (continuous) alongside categorical `age`. From 2017 onward `age` is categorical again. Some waves use a 6th category (60s / 70+); valid_range=[1,6] to avoid silently dropping those rows."
    source:
      w2004: age
      w2005: age
      w2006: age
      w2007: age
      w2008: dq2
      w2009: age
      w2010: age
      w2011: age
      w2012: age
      w2013: age_re
      w2014: age_re
      w2015: age_re
      w2016: age_re
      w2017: age
      w2018: age
      w2019: age
      w2020: age
      w2021: age
      w2022: dq2
      w2023: dq2
    scale: {min: 1, max: 6, labels: {1: "20s or younger", 5: "60s", 6: "70+ (present only in waves with 6-band coding)"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 6]   # Allow up to 6 — some waves may use 6 categories

  - id: education
    concept: demographics
    description: "Respondent education level on the 2010-21 native 6-category frame (1=중졸 이하 → 6=대학원졸 이상; other eras recoded onto it)"
    type: ordinal
    note: >
      FIX 2026-08-08: all waves recoded onto the 2010-21 native 6-cat frame
      (1=중졸 이하, 2=고졸, 3=전문대졸, 4=대학중퇴, 5=대졸, 6=대학원졸 이상).
      Raw-label-verified schemes: 2004-09 are 1-4 (3=대졸, 4=대학원졸) and
      2022-23 are 1-5 (4=대졸, 5=대학원졸) — under the previous
      method-identity spec their codes 3/4/5 silently took the WRONG 2010-21
      meanings (e.g. a 2005 BA read as 전문대졸, a 2015 대학중퇴 read as a
      2022 대졸). Two granularity caveats survive the recode, both
      structural: (a) pre-2010 "대졸" explicitly includes 전문대졸 (the 2008
      dq3 label says 대졸(전문대 포함)), so harmonized 5 is broader before
      2010 and categories 3/4 cannot occur; (b) 2022-23 dropped the
      대학중퇴 category, so harmonized 4 cannot occur there. Ordinal
      direction is consistent in every wave.
    source:
      w2004: edu
      w2005: edu
      w2006: edu
      w2007: edu
      w2008: dq3
      w2009: edu
      w2010: edu
      w2011: edu
      w2012: edu
      w2013: edu
      w2014: edu
      w2015: edu
      w2016: edu
      w2017: edu
      w2018: edu
      w2019: edu
      w2020: edu
      w2021: edu
      w2022: dq3
      w2023: dq3
    scale:
      min: 1
      max: 6
      labels:
        1: "중졸 이하 (middle school or less)"
        2: "고졸 (high school graduate)"
        3: "전문대졸 (junior college; 2010-21 and 2022-23 only)"
        4: "대학중퇴 (university dropout; 2010-21 only)"
        5: "대졸 (university graduate; pre-2010 includes junior college)"
        6: "대학원졸 이상 (graduate school or above)"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
        note: "2010-21 native codes ARE the target frame."
      by_wave:
        w2004:
          method: recode
          mapping: {1: 1, 2: 2, 3: 5, 4: 6}
        w2005:
          method: recode
          mapping: {1: 1, 2: 2, 3: 5, 4: 6}
        w2006:
          method: recode
          mapping: {1: 1, 2: 2, 3: 5, 4: 6}
        w2007:
          method: recode
          mapping: {1: 1, 2: 2, 3: 5, 4: 6}
        w2008:
          method: recode
          mapping: {1: 1, 2: 2, 3: 5, 4: 6}
        w2009:
          method: recode
          mapping: {1: 1, 2: 2, 3: 5, 4: 6}
        w2022:
          method: recode
          mapping: {1: 1, 2: 2, 3: 3, 4: 5, 5: 6}
        w2023:
          method: recode
          mapping: {1: 1, 2: 2, 3: 3, 4: 5, 5: 6}
    qc:
      # FIX 2026-08-08 (two-part): valid_range was [1, 10] — an over-claim
      # that made the convention's 8/9 collide with the range (no real 8/9
      # exist in any wave; 9=무응답 where labeled, caught by the convention).
      # Same day, the cross-era code misalignment was closed with the
      # by_wave recodes above — see the note field for the verified ladders.
      valid_range: [1, 6]

  - id: income
    concept: demographics
    description: "Respondent monthly household income (categorical; scale boundaries vary by wave due to inflation/KIPA revisions)"
    type: ordinal
    note: "Household income is categorical with boundaries updated periodically in KIPA — treat as ordinal-within-wave and exercise caution in cross-wave comparisons. Raw-label-verified bracket schemes (2026-08-08): 2004-07 are 1-6 (100만원 steps, 6=500만원+), 2008-20 are 1-8 (8=600만원+), 2021 is 1-8 (8=700만원+), 2022-23 are 1-10 (10=900만원+). 무응답 is 9 in 2004-21 (retired per wave via valid_range_by_wave, declared in coverage_missing_codes_by_wave) and 99 in 2022-23 (in the convention)."
    source:
      w2004: inc
      w2005: inc
      w2006: inc
      w2007: inc
      w2008: dq4
      w2009: inc
      w2010: inc
      w2011: inc
      w2012: inc
      w2013: inc
      w2014: inc
      w2015: inc
      w2016: inc
      w2017: inc
      w2018: inc
      w2019: inc
      w2020: inc
      w2021: inc
      w2022: dq4
      w2023: dq4
    scale: {min: 1, max: 10, labels: {1: "Lowest", 10: "Highest"}}
    missing:
      # FIX 2026-08-08: shared convention's 8 deleted the real top bracket in
      # every wave 2008-2023 (~1,150 respondents; the entire 600만원+/700만원+
      # tail) and its 9 deleted the real 800~900만원 bracket in 2022-23 (76).
      use_convention: treat_as_na_income
    harmonize:
      default:
        method: identity
    qc:
      # Per-wave ranges carry the bracket-scheme changes; the 2004-21 무응답
      # code 9 falls outside its wave's range and is range-coerced to NA
      # (logged to the oob log; declared below so Check E reads it as intent).
      valid_range_by_wave:
        w2004: [1, 6]
        w2005: [1, 6]
        w2006: [1, 6]
        w2007: [1, 6]
        w2008: [1, 8]
        w2009: [1, 8]
        w2010: [1, 8]
        w2011: [1, 8]
        w2012: [1, 8]
        w2013: [1, 8]
        w2014: [1, 8]
        w2015: [1, 8]
        w2016: [1, 8]
        w2017: [1, 8]
        w2018: [1, 8]
        w2019: [1, 8]
        w2020: [1, 8]
        w2021: [1, 8]
        w2022: [1, 10]
        w2023: [1, 10]
      coverage_missing_codes_by_wave:
        w2004: [9]
        w2005: [9]
        w2006: [9]
        w2007: [9]
        w2008: [9]
        w2009: [9]
        w2010: [9]
        w2011: [9]
        w2012: [9]
        w2013: [9]
        w2014: [9]
        w2015: [9]
        w2016: [9]
        w2017: [9]
        w2018: [9]
        w2019: [9]
        w2020: [9]
        w2021: [9]
