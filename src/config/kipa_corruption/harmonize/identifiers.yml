# KIPA Corruption — respondent/interview identifiers.
# IDs are DATA for raw-traceability and merges, never the uniqueness
# backbone (that is row_uid). ID variables carry NO missing codes — the
# generalized lesson of the 2026-08-09 ABS idnumber bug.
# Sources + key verdicts label/measure-verified 2026-08-10; see
# docs/superpowers/specs/2026-08-10-row-identifiers-design.md.
schema_version: 1

missing_conventions:
  no_missing_codes:
    codes: []
    description: "Serial IDs have no refused/DK values; every code is real."

variables:
  - id: native_id
    concept: identifiers
    description: "Respondent serial within year (raw id; unique per year except 2019's 74 release duplicates — see key_uniqueness_exemptions.yml). 2013-2015 null: those releases carry no id column."
    type: nominal
    source:
      w2004: id
      w2005: id
      w2006: id
      w2007: id
      w2008: id
      w2009: id
      w2010: id
      w2011: id
      w2012: id
      w2013: null
      w2014: null
      w2015: null
      w2016: id
      w2017: id
      w2018: id
      w2019: id
      w2020: id
      w2021: id
      w2022: id
      w2023: id
    missing:
      use_convention: no_missing_codes
    harmonize:
      default:
        method: identity
    qc:
      skip_range_check: true
      skip_unmapped_check: true
