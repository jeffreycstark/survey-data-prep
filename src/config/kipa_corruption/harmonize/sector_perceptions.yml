      w2021: a0611
      w2022: q11_1
      w2023: q11_1
    scale: {min: 1, max: 6, labels: {1: "Not at all corrupt", 6: "Very corrupt"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 6]
      skip_unmapped_check: true  # 2008/2009 use q7_* structure — intentionally unmapped

