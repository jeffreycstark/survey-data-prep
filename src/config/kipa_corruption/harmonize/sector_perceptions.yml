# KIPA Corruption — sector-level and agency-level corruption perceptions
#
# Three item families:
#
#   (1) Public vs private sector (2 items)           — all 20 years
#   (2) Administrative function areas (11 items)     — cum + 2010–2023
#   (3) Administrative agency levels (3 items)       — cum + 2010–2023
#
# All items use the same 1-6 scale: higher = more corruption perceived
# in that sector/function/agency. No reversal needed.
#
# The 2022-2023 waves expanded / reorganized the function list:
#   - Added: 노동 (labor), 국방 (defense)
#   - Dropped: 병무 (military service admin), 교정 (corrections)
#   - Renamed: 법조 (legal profession broad) → 검찰 (prosecutors only) for q23_4
# Only the items present in BOTH naming schemes are harmonized here.
#
# 2008-2009 use a different question structure (q7_* for function items) and
# are NOT mapped in this initial pass. Coverage: 18 of 20 years for functions.

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-8, -9, 8, 9, 88, 99]
    description: "KIPA corruption: common sentinel missing codes"

variables:
  # -------- (1) PUBLIC vs PRIVATE SECTOR --------
  - id: corr_sector_public
    concept: sector_corruption
    description: "Perceived corruption in public sector / administrative agencies (1-6, higher=more corrupt)"
    type: ordinal
    note: "a0611 (cum, 2010-2021) / q11_1 (2022-2023). All 20 years covered."
    source:
