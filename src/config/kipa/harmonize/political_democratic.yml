# KIPA Social Cohesion Survey (KSIS) — Political & Democratic Attitudes
# Years: 2013-2024 (variable coverage differs)
#
# These items complement the trust battery already in build_kipa_trust.R.
# Political satisfaction/prospect: 0-10 scale (higher = better/more optimistic)
# Democracy satisfaction/prospect: 0-10 scale, 2018-2022 only (5 years)
#
# Note: pol_sat and pol_prosp are already partially captured in
# build_kipa_trust.R bonus_crosswalk (pol_sat only). This spec adds
# pol_prosp and the democracy items for completeness.
#
# MISSING VALUES:
# 98/99 = DK/NR → treat as NA

missing_conventions:
  treat_as_na:
    codes: [98, 99]
    description: "KIPA: 98=DK, 99=NR"

variables:
  - id: pol_satisfaction
    concept: political_attitudes
    description: "Satisfaction with national political situation (0=not at all satisfied, 10=very satisfied)"
    type: ordinal
    note: "Already in build_kipa_trust.R bonus_crosswalk. Included here for spec completeness."
    source:
      y2013: q4
      y2014: q4
      y2015: q6
      y2016: q6
      y2017: q6
      y2018: q6
      y2019: q6
      y2020: q6
      y2021: q6
      y2022: q6
      y2023: q6
      y2024: q6
    scale:
      min: 0
      max: 10
      labels:
        0: "Not at all satisfied"
        5: "Average"
        10: "Very satisfied"
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [0, 10]

  - id: pol_prospect
    concept: political_attitudes
    description: "Prospect for national political situation (0=will get much worse, 10=will get much better)"
    type: ordinal
    note: "Not available in 2014"
    source:
      y2013: q5
      # y2014: not available
      y2015: q7
      y2016: q7
      y2017: q7
      y2018: q7
      y2019: q7
      y2020: q7
      y2021: q7
      y2022: q7
      y2023: q7
      y2024: q7
    scale:
      min: 0
      max: 10
      labels:
        0: "Will get much worse"
        5: "Average"
        10: "Will get much better"
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [0, 10]

  - id: dem_satisfaction
    concept: democratic_attitudes
    description: "Satisfaction with level of democracy in Korea (0=not at all satisfied, 10=very satisfied)"
    type: ordinal
    note: "Available 2018-2022 only (5 years). Already partially in build_kipa_trust.R."
    source:
      y2018: q8
      y2019: q8
      y2020: q8
      y2021: q8
      y2022: q8
    scale:
      min: 0
      max: 10
      labels:
        0: "Not at all satisfied"
        5: "Average"
        10: "Very satisfied"
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [0, 10]

  - id: dem_prospect
    concept: democratic_attitudes
    description: "Prospect for democracy level in Korea (0=will get much worse, 10=will get much better)"
    type: ordinal
    note: "Available 2018-2022 only (5 years)"
    source:
      y2018: q9
      y2019: q9
      y2020: q9
      y2021: q9
      y2022: q9
    scale:
      min: 0
      max: 10
      labels:
        0: "Will get much worse"
        5: "Average"
        10: "Will get much better"
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [0, 10]
