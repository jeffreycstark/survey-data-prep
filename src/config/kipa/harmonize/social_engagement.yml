# KIPA Social Cohesion Survey (KSIS) — Social Engagement
# Years: 2013-2024 (12 years; 2011-2012 excluded — different instrument)
#
# Three concept clusters:
#   1. Belonging / national pride (1-4 scale, higher = stronger)
#   2. Social group activity (1-5 scale, 1=never belonged, 5=active member)
#   3. Political interest (1-4 scale, 2021-2024 only)
#
# MISSING VALUES:
# 8/9 = DK/NR → treat as NA

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [8, 9]
    description: "KIPA: 8=DK, 9=NR"

variables:
  # ── Belonging & national pride ──────────────────────────────────────────────

  - id: national_pride
    concept: belonging
    description: "Pride as a citizen of Korea (1=not at all, 4=very much)"
    type: ordinal
    source:
      y2013: q3_1
      y2014: q3_1
      y2015: q5_1
      y2016: q5_1
      y2017: q5_1
      y2018: q5_1
      y2019: q5_1
      y2020: q5_1
      y2021: q5_1
      y2022: q5_1
      y2023: q5_1
      y2024: q5_1
    scale:
      min: 1
      max: 4
      labels:
        1: "Not at all"
        2: "Not really"
        3: "Somewhat"
        4: "Very much"
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 4]

  - id: belong_province
    concept: belonging
    description: "Sense of belonging to residential area — province/city level (1=not at all, 4=very much)"
    type: ordinal
    note: "2013-2014: single 'residential area' item (q3_2). 2015+: split into 3 levels; this captures province/city (시·도)."
    source:
      y2013: q3_2
      y2014: q3_2
      y2015: q5_2
      y2016: q5_2
      y2017: q5_2
      y2018: q5_2
      y2019: q5_2
      y2020: q5_2
      y2021: q5_2
      y2022: q5_2
      y2023: q5_2
      y2024: q5_2
    scale:
      min: 1
      max: 4
      labels:
        1: "Not at all"
        2: "Not really"
        3: "Somewhat"
        4: "Very much"
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 4]

  - id: belong_city
    concept: belonging
    description: "Sense of belonging to residential area — city/county/district level (1=not at all, 4=very much)"
    type: ordinal
    note: "Available 2016-2024 only (not 2013-2015, 2021 gap patched). 시·군·구 level."
    source:
      # y2013-y2014: not available (single item only)
      # y2015: q5_2_1 available
      y2015: q5_2_1
      y2016: q5_2_1
      y2017: q5_2_1
      y2018: q5_2_1
      y2019: q5_2_1
      y2020: q5_2_1
      y2021: q5_2_1
      y2022: q5_2_1
      y2023: q5_2_1
      y2024: q5_2_1
    scale:
      min: 1
      max: 4
      labels:
        1: "Not at all"
        2: "Not really"
        3: "Somewhat"
        4: "Very much"
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 4]

  - id: belong_town
    concept: belonging
    description: "Sense of belonging to residential area — town/village level (1=not at all, 4=very much)"
    type: ordinal
    note: "Available 2015-2024. 읍·면·동 level."
    source:
