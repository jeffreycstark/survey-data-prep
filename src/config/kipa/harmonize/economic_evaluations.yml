# KIPA Social Cohesion Survey (KSIS) — Economic Evaluations
# Years: 2013-2024 (12 years; 2011-2012 excluded — different instrument)
#
# Variable numbers shift across years but scales are consistent.
# All satisfaction/prospect items: 0-10 (higher = better/more optimistic)
# Mobility items: 1-4 (higher = more possible)
#
# MISSING VALUES:
# 8/9 or 98/99 = DK/NR → treat as NA

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [8, 9, 98, 99]
    description: "KIPA: 8/9=DK/NR (2013-2014), 98/99=DK/NR (later years)"

variables:
  - id: econ_nat_sat
    concept: economic_evaluations
    description: "Satisfaction with national economic situation (0=not at all satisfied, 10=very satisfied)"
    type: ordinal
    source:
      y2013: q6
      y2014: q6
      y2015: q8
      y2016: q8
      y2017: q8
      y2018: q10
      y2019: q10
      y2020: q10
      y2021: q10
      y2022: q10
      y2023: q8
      y2024: q8
    scale:
      min: 0
      max: 10
      labels:
        0: "Not at all satisfied"
        5: "Average"
        10: "Very satisfied"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [0, 10]

  - id: econ_nat_prospect
    concept: economic_evaluations
    description: "Prospect for national economic situation (0=will get much worse, 10=will get much better)"
    type: ordinal
    note: "Not available in 2014"
    source:
      y2013: q7
      # y2014: not available
      y2015: q9
      y2016: q9
      y2017: q9
      y2018: q11
      y2019: q11
      y2020: q11
      y2021: q11
      y2022: q11
      y2023: q9
      y2024: q9
    scale:
      min: 0
      max: 10
      labels:
        0: "Will get much worse"
        5: "Average"
        10: "Will get much better"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [0, 10]

  - id: econ_pers_stability
    concept: economic_evaluations
    description: "Personal current economic stability (0=not stable at all, 10=very stable)"
    type: ordinal
    source:
      y2013: q42
      y2014: q44
      y2015: q47
      y2016: q49
      y2017: q48
      y2018: q51
      y2019: q52
      y2020: q51
      y2021: q54
      y2022: q55
      y2023: q51
      y2024: q52
    scale:
      min: 0
      max: 10
      labels:
        0: "Not stable at all"
        5: "Average"
        10: "Very stable"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [0, 10]

  - id: econ_pers_prospect
    concept: economic_evaluations
    description: "Personal future economic outlook (0=will get much worse, 10=will get much better)"
    type: ordinal
    note: "Available 2018-2024 only (7 years)"
    source:
      # y2013-y2017: not available
      y2018: q52
      y2019: q53
      y2020: q52
      y2021: q55
      y2022: q56
      y2023: q52
      y2024: q53
    scale:
      min: 0
      max: 10
      labels:
        0: "Will get much worse"
        5: "Average"
        10: "Will get much better"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [0, 10]

  - id: mobility_self
    concept: economic_evaluations
    description: "Possibility of upward social/economic mobility through personal effort — self (1=not at all, 4=very much)"
    type: ordinal
    note: "Available 2013-2024 (not 2011-2012). 9=DK/NR."
    source:
      y2013: q3_3
      y2014: q3_3
      y2015: q5_3
      y2016: q5_3
      y2017: q5_3
      y2018: q5_3
      y2019: q5_3
      y2020: q5_3
      y2021: q5_3
      y2022: q5_3
      y2023: q5_3
      y2024: q5_3
    scale:
      min: 1
      max: 4
      labels:
        1: "Not at all"
        2: "Not really"
        3: "Somewhat"
        4: "Very much"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 4]

  - id: mobility_children
    concept: economic_evaluations
    description: "Possibility of upward social/economic mobility through personal effort — children (1=not at all, 4=very much)"
    type: ordinal
    note: "Available 2013-2024 (not 2011-2012). 9=DK/NR."
    source:
      y2013: q3_4
      y2014: q3_4
      y2015: q5_4
      y2016: q5_4
      y2017: q5_4
      y2018: q5_4
      y2019: q5_4
      y2020: q5_4
      y2021: q5_4
      y2022: q5_4
      y2023: q5_4
      y2024: q5_4
    scale:
      min: 1
      max: 4
      labels:
        1: "Not at all"
        2: "Not really"
        3: "Somewhat"
        4: "Very much"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 4]
