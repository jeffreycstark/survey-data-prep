# CFPS — political attitudes, government experience, and subjective position
# (adult frame, w2010-w2022; 2018+ person module filtered to 16+). Built for
# paper 26 (Dragon Children). Instrument continuity: govt eval qn4/qn1101 all
# six waves; trust battery + disposition + corruption 2014-2022; govt-experience
# battery 2010-2016 only; opinion battery 2010 (qm70x) and 2018-2022 (wv10x,
# subsampled ~7k in 2022); subjective position 2010 (qm40x) and 2014-2022
# (qn8011/qn8012/qn12012; qn12016 2018+).
#
# INSTRUMENT MAP ACROSS THE TWO WAVES:
#   2010 qn4        ~ 2014 QN1101   county/city government evaluation (5-pt)
#   2010 qn205-208  ~ 2014 QN1014-1017  government mistreatment/conflict battery
#   2014-only: QN1001 trust disposition, QN10021-QN10026 trust battery (0-10),
#              QN6011 perceived government corruption severity (0-10)
#   2010-only: qm70x opinion battery (meritocracy/fairness), qm401-404
#              subjective position and outlook
#
# ⚠️ TWO POSITIVE-CODE TRAPS (raw-verified on 2010, live counts):
#   1. On qn205-208 the "no" code IS 5 (n=21,633 at qn205), not the labelled 0
#      (n=0), and 79 = "此种经历不适用" (n=7,302) is a real skip category. The
#      recode maps {1->1, 5->0, 0->0}; 79 is declared an intentional drop.
#   2. The qm70x agree battery runs 1=十分不同意, 2=不同意, 3=同意, 4=十分同意
#      with the midpoint OUT OF ORDER at 5=既不同意也不反对 (n≈1,500) and an
#      in-range 6=不知道 (n≈5,500). Recoded to an ordered 5-pt with the neutral
#      at center; 6 declared an intentional drop.
# 2014 CODINGS VERIFIED 2026-08-09 against the Chinese Stata release. Two
# differences from the assumed scaffold, both fixed the same day:
#   - qn1001 codes are {1=大多数人是可以信任的, 5=要越小心越好} — NOT 1/2. The
#     original valid_range [1,2] would have deleted all 14,628 "careful" answers.
#   - The 2014 government battery ADDS a middle category the 2010 items lack:
#     {1=亲身经历过, 3=见到过此类事情但没有亲身经历过, 5=没有见到过, 79=没听懂}.
#     Harmonized as PERSONAL experience (1->1; 3,5->0); the witnessed-only group
#     (n≈2,400-3,300 per item) folds to 0 by design — a paper wanting the
#     3-category version should read raw qn1014-1017 directly.

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-10, -9, -8, -7, -2, -1]
    description: "CFPS negative missing states (see demographics.yml)."

variables:

  # ---- government evaluation --------------------------------------------------

  - id: govt_eval_county
    concept: politics
    description: "Overall evaluation of county/city government's work last year (1=worse than before ... 5=great achievements; REVERSED so higher = better evaluation)"
    type: ordinal
    note: "Raw runs 1=有很大成绩 -> 4=没有成绩, 5=比之前更糟了 (descending). safe_reverse_5pt gives higher = better. VERIFIED 2026-08-09: 2014 qn1101 carries the identical label set."
    source:
      w2010: qn4
      w2014: qn1101
      w2016: qn1101
      w2018: qn1101
      w2020: qn1101
      w2022: qn1101
    scale:
      min: 1
      max: 5
      labels:
        1: "Worse than before"
        2: "No achievements"
        3: "Not much achievement"
        4: "Some achievements"
        5: "Great achievements"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: r_function
        fn: safe_reverse_5pt
    qc:
      valid_range: [1, 5]
      coverage_missing_codes: [79]
      validate:
        - waves: [w2010, w2014]
          phrase: "政府|government"

  # ---- government experience battery (1 = experienced it, 0 = not) ------------

  - id: govt_mistreated
    concept: politics
    description: "Experienced unfair treatment by government cadres (1=yes, 0=no)"
    type: binary
    source:
      w2010: qn205
      w2014: qn1014
      w2016: qn1014
      w2018: null
      w2020: null
      w2022: null
    scale: {min: 0, max: 1, labels: {0: "No", 1: "Yes"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: recode
        mapping: {1: 1, 5: 0, 0: 0}
        note: "2010: raw 'no' is CAPI code 5 (n=21,633); labelled 0=no never occurs. 79 -> NA, declared below."
      by_wave:
        w2014:
          method: recode
          mapping: {1: 1, 3: 0, 5: 0}
          note: "2014 adds 3=witnessed-but-not-experienced (n=3,311); harmonized binary is PERSONAL experience, so 3 folds to 0. 79 = didn't understand -> NA."
    qc:
      valid_range: [0, 1]
      coverage_missing_codes: [79]
      validate:
        - waves: [w2010, w2014]
          phrase: "政府干部|干部"

  - id: govt_conflict
    concept: politics
    description: "Had a conflict with government cadres (1=yes, 0=no)"
    type: binary
    source:
      w2010: qn206
      w2014: qn1015
      w2016: qn1015
      w2018: null
      w2020: null
      w2022: null
    scale: {min: 0, max: 1, labels: {0: "No", 1: "Yes"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: recode
        mapping: {1: 1, 5: 0, 0: 0}
      by_wave:
        w2014:
          method: recode
          mapping: {1: 1, 3: 0, 5: 0}
          note: "2014 adds 3=witnessed-but-not-experienced; harmonized binary is PERSONAL experience (3 -> 0). 79 = didn't understand -> NA."
    qc:
      valid_range: [0, 1]
      coverage_missing_codes: [79]
      validate:
        - waves: [w2010, w2014]
          phrase: "干部|冲突"

  - id: govt_delay
    concept: politics
    description: "Experienced unreasonable delay / buck-passing at government offices (1=yes, 0=no)"
    type: binary
    source:
      w2010: qn207
      w2014: qn1016
      w2016: qn1016
      w2018: null
      w2020: null
      w2022: null
    scale: {min: 0, max: 1, labels: {0: "No", 1: "Yes"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: recode
        mapping: {1: 1, 5: 0, 0: 0}
      by_wave:
        w2014:
          method: recode
          mapping: {1: 1, 3: 0, 5: 0}
          note: "2014 adds 3=witnessed-but-not-experienced; harmonized binary is PERSONAL experience (3 -> 0). 79 = didn't understand -> NA."
    qc:
      valid_range: [0, 1]
      coverage_missing_codes: [79]
      validate:
        - waves: [w2010, w2014]
          phrase: "拖延|推诿|delay"

  - id: govt_fees
    concept: politics
    description: "Charged unreasonable fees at government offices (1=yes, 0=no)"
    type: binary
    source:
      w2010: qn208
      w2014: qn1017
      w2016: qn1017
      w2018: null
      w2020: null
      w2022: null
    scale: {min: 0, max: 1, labels: {0: "No", 1: "Yes"}}
    missing:
