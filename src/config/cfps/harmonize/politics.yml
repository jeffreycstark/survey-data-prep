        2: "Disagree"
        3: "Neither agree nor disagree"
        4: "Agree"
        5: "Strongly agree"
    missing: {use_convention: treat_as_na}
    harmonize:
      default:
        method: recode
        mapping: {1: 1, 2: 2, 5: 3, 3: 4, 4: 5}
        note: "Raw midpoint sits at 5; raw 6=don't know -> NA (declared)."
    qc:
