    harmonize:
      default:
        method: recode
        mapping: {1: 1, 5: 0, 0: 0}
      by_wave:
        w2014:
          method: recode
          mapping: {1: 1, 3: 0, 5: 0}
          note: "2014 adds 3=witnessed-but-not-experienced; harmonized binary is PERSONAL experience (3 -> 0). 79 = didn't understand -> NA."
    qc:
      valid_range: [0, 1]
      coverage_missing_codes: [79]
      validate:
        - waves: [w2010, w2014]
          phrase: "收费|fees"

