    type: binary
    note: "VERIFIED 2026-08-09: raw codes are {1=大多数人是可以信任的, 5=要越小心越好} — NOT 1/2. The scaffold's identity+[1,2] would have deleted all 14,628 code-5 answers; recode fixes it (1->1, 5->0)."
    scale: {min: 0, max: 1, labels: {0: "Can't be too careful", 1: "Most people can be trusted"}}
