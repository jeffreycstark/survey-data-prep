# CFPS Demographics and SES
# Waves: y2010, y2012, y2014, y2016, y2018, y2020
#
# ⚠ SCAFFOLD — every `source:` is null pending 00_probe_variables.R.
#
# Two distinct jobs in one file:
#
#   (a) ADULT SES — education and income. The consuming paper uses these to
#       split its two hypotheses: H1 says the treatment effect on trust runs
#       through adult SES, H2 says it does not. NB adult SES is POST-TREATMENT
#       relative to birth-year assignment, so this supports a descriptive
#       decomposition, NOT identified mediation. That caveat belongs in the
#       paper, but it is worth stating here so nobody builds a "mediator" column
#       and implies more than the design earns.
#
#   (b) BOUNDARY-BALANCE COVARIATES — hukou, urbanicity, ethnicity, region,
#       parental characteristics. These are the pre-treatment variables the RD
#       balance tests run on. Anything discontinuous at the lunar boundary is a
#       problem, so coverage matters more than precision here.

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-1, -2, -8, -9, -10]
    description: "PROVISIONAL CFPS negative sentinels — resolve via 00_probe_variables.R before mapping any source."

variables:
  - id: sex
    concept: demographics
    description: "Respondent's sex (project standard 1=male, 2=female)"
    type: nominal
    note: "TODO: resolve source AND raw coding. Recode to the project-standard 1/2 if CFPS uses 0/1."
    source:
      y2010: null
      y2012: null
      y2014: null
      y2016: null
      y2018: null
      y2020: null
    scale:
      min: 1
      max: 2
      labels:
        1: "Male"
        2: "Female"
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity

  - id: education
