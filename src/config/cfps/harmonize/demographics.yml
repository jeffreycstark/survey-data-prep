# CFPS — identifiers, weights, and demographics (adult module, w2010 + w2014)
#
# NAMING: both waves' Stata releases use lowercase raw names (qa1y_best, qn4;
# cfps_birthy, qn1101, cfps2014edu, rswt_natcs14).
#
# MISSING CONVENTION: CFPS codes ALL interviewer/missing states as NEGATIVES
# (-10 无法判断, -9 缺失, -8 不适用, -7 无法匹配, -2 拒绝回答, -1 不知道), so the
# convention can never collide with a positive substantive scale (the class the
# convention-collision check guards). Two POSITIVE traps exist and are handled
# per variable, never via the convention: legacy code 5 = "no" on some CAPI
# binaries (in 2010 gender it is labelled but unobserved; on the qn20x items it
# IS the live "no" code), and in-range DK codes on the qm70x opinion battery
# (6 = 不知道) — see politics.yml.
#
# 2014 CODINGS VERIFIED 2026-08-09 against the Chinese Stata release
# (cfps2014adult_201906.dta), which carries full value labels — the earlier
# SAS-based scaffold could only assume them. ⚠️ The Stata release names are
# LOWERCASE (cfps_gender, qn1101); the SAS release upper-cases the same
# variables. Sources below follow the Stata names; the loader reads Stata.

schema_version: 1

missing_conventions:
  treat_as_na:
    codes: [-10, -9, -8, -7, -2, -1]
    description: "CFPS negative missing states: -10 cannot judge, -9 missing, -8 not applicable, -7 unmatchable, -2 refused, -1 don't know. All negative by design — no collision with positive scales."

variables:

  - id: pid
    concept: identifiers
    description: "CFPS stable personal ID (constant across waves; panel linkage key)"
    type: nominal
    source:
      w2010: pid
      w2014: pid
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      skip_range_check: true
      skip_unmapped_check: true

  - id: province_code
    concept: identifiers
    description: "Province code at interview (national GB codes)"
    type: nominal
    source:
      w2010: provcd
      w2014: provcd14
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      skip_range_check: true
      skip_unmapped_check: true

  - id: weight_cs
    concept: weights
    description: "Cross-sectional person weight, national sample (2010 rswt_nat; 2014 rswt_natcs14)"
    type: continuous
    source:
      w2010: rswt_nat
      w2014: rswt_natcs14
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      skip_range_check: true
      skip_unmapped_check: true

  - id: weight_panel
    concept: weights
    description: "2010-2014 person panel weight, national sample (w2014 only)"
    type: continuous
    source:
      w2010: null
      w2014: rswt_natpn1014
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      skip_range_check: true
      skip_unmapped_check: true

  - id: gender
    concept: demographics
    description: "Gender (1 = male, 0 = female — matches the cross-survey harmonized convention)"
    type: binary
    source:
      w2010: gender
      w2014: cfps_gender
    note: "VERIFIED both waves: 0=女, 1=男, plus a labelled-but-unobserved legacy 5=女 (2010 and 2014 alike); the recode folds any 5 to 0 defensively."
    scale: {min: 0, max: 1, labels: {0: "Female", 1: "Male"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: recode
        mapping: {0: 0, 1: 1, 5: 0}
    qc:
      valid_range: [0, 1]

  - id: birth_year
    concept: demographics
    description: "Birth year (2010 corrected qa1y_best; 2014 CFPS_BIRTHY). Zodiac/dragon assignment derives from this + birth_month via src/r/lookups/zodiac.R"
    type: continuous
    source:
      w2010: qa1y_best
      w2014: cfps_birthy
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1900, 2000]

  - id: birth_month
    concept: demographics
    description: "Birth month 1-12 (w2010 qa1m; no respondent birth-month variable found in the 2014 adult file — panel pid links to the 2010 record for month)"
    type: ordinal
    source:
      w2010: qa1m
      w2014: null
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 12]

  - id: age
    concept: demographics
    description: "Age at interview (2010 qa1age; 2014 CFPS2014_AGE)"
    type: continuous
    source:
      w2010: qa1age
      w2014: cfps2014_age
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [16, 110]

  - id: urban
    concept: demographics
    description: "Urban residence per NBS classification (1 = urban, 0 = rural)"
    type: binary
    source:
      w2010: urban
      w2014: urban14
    scale: {min: 0, max: 1, labels: {0: "Rural", 1: "Urban"}}
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [0, 1]

  - id: ethnicity_code
    concept: demographics
    description: "Ethnicity code (w2010 qa5code; GB nationality codes, 1 = Han). 2014 counterpart not yet identified."
    type: nominal
    source:
      w2010: qa5code
      w2014: null
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      skip_range_check: true
      skip_unmapped_check: true

  - id: education_years
    concept: demographics
    description: "Completed years of education (2010 cfps2010eduy_best corrected; 2014 cfps2014eduy)"
    type: continuous
    source:
      w2010: cfps2010eduy_best
      w2014: cfps2014eduy
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [0, 22]

  - id: education_level
    concept: demographics
    description: "Highest completed education level (CFPS 8-rung ladder: 1=illiterate/semi-literate ... 8=doctorate). w2014 cfps2014edu; 2010 derived counterpart not in this release's adult file under a verified name."
    type: ordinal
    note: "VERIFIED 2026-08-09: 1=文盲/半文盲, 2=小学, 3=初中, 4=高中/中专/技校/职高, 5=大专, 6=大学本科, 7=硕士, 8=博士. Two extra codes declared below: 0=没数据 and 9=不必读书 — ⚠️ 9 has n=1,943 REAL adults (5%); its semantics are unclear and dropped from the ordinal ladder pending investigation. NOT comparable to other surveys' ladders without a crosswalk — treat as within-survey."
    source:
      w2010: null
      w2014: cfps2014edu
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1, 8]
      coverage_missing_codes: [0, 9]

  - id: ccp_member
    concept: demographics
    description: "Communist Party member — NO USABLE FULL-SAMPLE SOURCE in w2010/w2014 adult files; both waves null. See note."
    type: binary
    note: >
      ⚠️ TRAP, verified 2026-08-09: cfps_party's VARIABLE label says
      是否为中国共产党党员 but its VALUE labels are 0=数据缺失/1=数据正常 and
      ZERO of its 2,205 code-1 cases have a valid join year (while 436 code-0
      cases do) — it is NOT a membership measure; never use it. pn401a
      (是否中共党员, 0/5=no 1=yes 79=n/a) is real but skip-routed to ~1,055
      respondents (proxy module). Until a full-sample source is found (check
      famconf or the 2018+ person files), derive membership at analysis time
      from ccp_join_year non-missing (members-only coverage, n≈500 in 2014).
    source:
      w2010: null
      w2014: null
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [0, 1]

  - id: ccp_join_year
    concept: demographics
    description: "Year joined the Communist Party (members only; 2010 qa701, 2014 QN402)"
    type: continuous
    source:
      w2010: qa701
      w2014: qn402
    missing:
      use_convention: treat_as_na
    harmonize:
      default:
        method: identity
    qc:
      valid_range: [1920, 2014]
